<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f6bed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="错题本" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<title>错题本 · 拍题讲解与复习</title>
<script>
/* 主题防闪：主脚本还没加载前就把深浅定下来，暗色用户不会先看到一帧白屏。
   模式存 localStorage 的 ctb_theme（auto/light/dark），与设置页「外观」共用同一个键。 */
try {
  var _ctbTheme = localStorage.getItem('ctb_theme') || 'auto';
  if (_ctbTheme === 'dark' || (_ctbTheme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    var _ctbMeta = document.querySelector('meta[name="theme-color"]');
    if (_ctbMeta) _ctbMeta.setAttribute('content', '#171e29');
  }
} catch (e) { /* localStorage 拿不到就按浅色走 */ }
</script>
<style>
:root{
  --pri:#2f6bed; --pri-d:#1f52c4; --pri-soft:#e9f0ff;
  --card:#ffffff; --bg:#f2f4f9; --line:#e5eaf3;
  --text:#1b2430; --muted:#6b7787; --faint:#9aa5b5;
  --ok:#12a150; --ok-soft:#e6f7ed; --bad:#e5484d; --bad-soft:#fdecec;
  --warn:#c98a00; --warn-soft:#fff6e0; --radius:14px;
  --shadow:0 2px 10px rgba(27,36,48,.06);
  /* 语义扩展色：浅/深两套取值，暗色在下面 [data-theme="dark"] 里覆盖。
     surface2=灰面（chip/灰按钮/进度条底）；soft=更浅的悬浮底；
     ink2=正文强调字；muted2=次级文字；pri-line=主色的浅边框；
     note-bg/line=讲解便签底。 */
  --surface2:#eef1f6; --soft:#f8faff;
  --ink2:#2a3543; --muted2:#4a5a72; --pri-line:#a9c3f8;
  --note-bg:#fff8e8; --note-line:#f0dcae;
  --bad-ink:#8a2225; --ok-ink:#0b6b36; --warn-ink:#7a5400;
  --bar-bg:rgba(255,255,255,.97); --head-bg:rgba(242,244,249,.96);
}
/* ---------- 暗色模式 ----------
   html[data-theme="dark"] 由主题 JS 设置（跟随系统或手动切）。
   只覆盖变量：版式、间距、布局一概不动；深色固有区（原图底 #0d1520、
   顶栏渐变、查看器遮罩）两套主题下本来就成立，不需要变。 */
[data-theme="dark"]{
  --pri:#4d84f0; --pri-d:#9cbcfa; --pri-soft:#1c2c4d;
  --card:#222d3d; --bg:#171e29; --line:#33405a;
  --text:#e8edf6; --muted:#9fb0c7; --faint:#6f7f96;
  --ok:#38c472; --ok-soft:#12321f; --bad:#ff6b6e; --bad-soft:#3d1a1c;
  --warn:#e2a72e; --warn-soft:#392c10;
  --shadow:0 2px 10px rgba(0,0,0,.45);
  --surface2:#2b3850; --soft:#1c2636;
  --ink2:#d4ddeb; --muted2:#a8b8cd; --pri-line:#33518a;
  --note-bg:#33290f; --note-line:#5a4a1c;
  --bad-ink:#ff9fa1; --ok-ink:#6fe0a0; --warn-ink:#ecc06a;
  --bar-bg:rgba(30,40,56,.97); --head-bg:rgba(23,30,41,.96);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none !important}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:30;color:#fff;
  background:linear-gradient(135deg,#2f6bed,#4d8dff);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 12px rgba(47,107,237,.28);
}
/* 服务端断连横幅：贴在顶栏下方，任何页面都能看到 */
#connBanner{
  position:sticky;top:0;z-index:29;background:var(--warn-soft);color:var(--warn-ink);
  font-size:13px;line-height:1.5;padding:8px 14px;text-align:center;
  border-bottom:1px solid var(--note-line);
}
#topbar .tb-title{font-size:18px;font-weight:700;letter-spacing:.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .tb-sub{font-size:12px;font-weight:400;opacity:.85;margin-left:6px}
.tb-btn{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:6px 12px;
  font-size:14px;display:flex;align-items:center;gap:4px}
.tb-btn:active{background:rgba(255,255,255,.32)}
/* 左上角返回键：只在非首页出现，手机上点它 / 按系统返回键都能回上一页 */
.tb-back{padding:6px 12px;font-size:18px;font-weight:700;line-height:1;letter-spacing:1px}

/* ---------- 通用 ---------- */
.pad{padding:12px 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tiny{font-size:13px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 键盘焦点环：只在键盘导航（focus-visible）时出现，鼠标点击不显示。
   以前按钮完全没有可见焦点，用键盘/tab 键根本看不出停在哪 —— 现在补上。 */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
.btn:focus-visible{outline-offset:3px;border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:12px;padding:11px 16px;font-size:16px;font-weight:600;
  background:var(--pri);color:#fff;transition:opacity .15s}
.btn:active{opacity:.82}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--pri-line)}
.btn.gray{background:var(--surface2);color:var(--muted2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok)}
/* 复习卡「跳过这题」：要一眼能看到，但不能抢过判对/判错的戏 ——
   橙色描边 + 浅底，比 gray 醒目、比主按钮轻 */
.btn.skip{background:var(--warn-soft);color:var(--warn-ink);border:1.5px solid var(--warn);
  font-size:15px;padding:10px 16px}
.btn.block{width:100%}
.btn.lg{padding:15px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}

.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri-d);font-weight:600}
.badge.k{background:var(--surface2);color:var(--muted2);font-weight:500}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);color:var(--muted2);border-radius:999px;padding:3px 10px;font-size:13px}
/* ---------- 错因标签选择器（录入 / 整页校对 / 详情页共用） ---------- */
.tagpick{margin-top:2px}
.tagsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:32px;
  background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:7px 9px}
.tagsel .chip{background:var(--pri-soft);color:var(--pri-d);font-weight:600}
.tagsel .chip i{font-style:normal;margin-left:5px;opacity:.7}
.tagsel .chip:hover i{opacity:1}
/* 4 个分类两列排（一行两个下拉），收起时整块只有两行高 */
.taggrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tagg{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tagg-h{display:flex;align-items:center;gap:6px;padding:8px 9px;font-size:13px;
  color:var(--muted);font-weight:600;cursor:pointer;background:var(--soft)}
.tagg-h .arw{display:inline-block;font-size:10px;transition:transform .15s}
.tagg.open .tagg-h .arw{transform:rotate(90deg)}
.tagg-h .cnt{margin-left:auto;color:var(--pri-d);font-size:12px}
.tagg-b{display:none;gap:6px;flex-wrap:wrap;padding:9px 10px;background:var(--card);
  grid-column:1 / -1}
/* 展开的组跨满两列：标签铺得开、下面的组位置不被挤压跳动 */
.tagg.open{grid-column:1 / -1}
.tagg.open .tagg-b{display:flex}
.tagpick .chip{cursor:pointer;-webkit-user-select:none;user-select:none}
.tagpick .chip.on{background:var(--pri);color:#fff;border:0}
.tagcustom{margin-top:8px}
.tagcustom input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;
  font-size:13px;background:var(--card);color:var(--ink2)}
.tagsline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tagwrap{margin-top:8px}
/* 复习次数筛选：一排档位按钮下面跟一行「练过 最少 ～ 最多 次」 */
.rcrange{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;
  font-size:12px;color:var(--muted)}
.rcrange input{width:72px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;
  font-size:13px;background:var(--card);color:var(--ink2);text-align:center}
.rcrange input:focus{border-color:var(--pri-line);outline:none}
.rcrange input::-webkit-outer-spin-button,
.rcrange input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rcrange input[type=number]{-moz-appearance:textfield}

.dots{display:flex;gap:3px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
.dot.bad{background:var(--bad)}

/* ---------- 底栏 ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--bar-bg);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{flex:1;padding:9px 0 8px;color:var(--faint);font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button .ico{font-size:21px;line-height:1.1}
#tabbar button.on{color:var(--pri);font-weight:600}
/* 复习 tab 上的「今天到期」角标 */
#tabbar button{position:relative}
#tabbar .nb{position:absolute;top:3px;left:50%;margin-left:5px;min-width:17px;height:17px;
  padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;
  line-height:17px;font-weight:700;font-style:normal;text-align:center;
  box-shadow:0 1px 4px rgba(229,72,77,.4)}
#tabbar .cam{position:relative}
#tabbar .cam .ico{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2f6bed,#4d8dff);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;
  margin-top:-22px;box-shadow:0 6px 16px rgba(47,107,237,.4);border:3px solid #fff;
}

/* ---------- 列表页 ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;
  padding:9px 12px;box-shadow:var(--shadow)}
.search input{border:none;outline:none;flex:1;background:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;background:var(--card);color:var(--muted2);border-radius:999px;
  padding:6px 14px;font-size:14px;border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}

.item{display:flex;gap:12px;padding:12px;margin:0 14px 10px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);align-items:flex-start}
.item:active{background:var(--soft)}
.item .thumb{width:74px;height:74px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
.item .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--faint)}
.item .body{flex:1;min-width:0}
.item .l1{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.item .qt{font-size:15px;color:var(--ink2);line-height:1.45}
.item .l3{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--faint)}

.grouphead{display:flex;align-items:center;gap:8px;margin:16px 14px 8px;font-size:14px;
  font-weight:600;color:var(--muted2)}
.grouphead .n{font-weight:400;color:var(--faint);font-size:13px}
.grouphead::after{content:"";flex:1;height:1px;background:var(--line)}

.empty{padding:56px 24px;text-align:center;color:var(--faint)}
.empty .big{font-size:52px;margin-bottom:10px}

/* ---------- 表单 ---------- */
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.fld input[type=text],.fld textarea,.fld select{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
  background:var(--card);outline:none;line-height:1.5}
.fld textarea{resize:vertical;min-height:80px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--pri-line);background:var(--soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--muted2);border-radius:10px;
  padding:7px 12px;font-size:14px}
.seg button.on{background:var(--pri-soft);border-color:var(--pri-line);color:var(--pri-d);font-weight:600}
.dotpick{display:flex;gap:8px;align-items:center}
.dotpick .d{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  font-size:12px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.dotpick .d.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}

/* ---------- 拍照页 ---------- */
.drop{margin:14px;padding:38px 20px;border-radius:18px;background:var(--card);border:2px dashed var(--line);
  text-align:center;box-shadow:var(--shadow)}
.drop .ico{font-size:52px}
.preview{margin:14px;border-radius:16px;overflow:hidden;background:#0d1520;box-shadow:var(--shadow);
  position:relative}
.preview img{width:100%;max-height:46vh;object-fit:contain}
.preview .redo{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;
  border-radius:8px;padding:5px 10px;font-size:13px}
.preview .pageno{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-size:11px}
.verdict{margin:0 14px;padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:flex-start}
.verdict.wrong{background:var(--bad-soft);color:var(--bad-ink)}
.verdict.right{background:var(--ok-soft);color:var(--ok-ink)}
.verdict.partial{background:var(--warn-soft);color:var(--warn-ink)}
.verdict.unknown{background:var(--surface2);color:var(--muted2)}
.verdict .v{font-weight:700;font-size:15px}
.ai-box{margin:12px 14px;padding:14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.ai-box h4{margin:0 0 6px;font-size:14px;color:var(--pri-d)}
.ai-box p{margin:0 0 10px;white-space:pre-wrap;font-size:15px;color:var(--ink2)}
.ai-box p:last-child{margin-bottom:0}
.loading{margin:14px;padding:26px;border-radius:16px;background:var(--card);text-align:center;box-shadow:var(--shadow)}
.spin{width:30px;height:30px;border:3px solid var(--surface2);border-top-color:var(--pri);border-radius:50%;
  margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 页面切换过渡 & 骨架屏 ---------- */
#main.pagein{animation:pagein .16s ease-out}
@keyframes pagein{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}
/* 骨架屏：统计 / 列表等接口还没回来时的占位块，浅灰扫光 */
.skel{border-radius:10px;background:linear-gradient(90deg,var(--surface2) 25%,var(--soft) 45%,var(--surface2) 65%);
  background-size:240% 100%;animation:skel 1.1s ease-in-out infinite}
.skel.tx{height:13px;margin:9px 0}
.skel.card{height:86px;border-radius:var(--radius);margin:0 14px 10px}
@keyframes skel{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- 详情页 ---------- */
.hero{background:#0d1520}
.hero img{width:100%;max-height:44vh;object-fit:contain}
.sec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 14px}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--pri-d);display:flex;align-items:center;gap:6px}
.sec .txt{white-space:pre-wrap;font-size:15px;color:var(--ink2)}
.sec .txt b{color:var(--ink2)}
.actions{display:flex;gap:10px;padding:4px 14px 14px}
.actions .btn{flex:1}

/* ---------- 复习页 ---------- */
.review-card{margin:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.review-card .q{padding:14px}
.review-card .qimg{background:#0d1520}
.review-card .qimg img{width:100%;max-height:38vh;object-fit:contain}
/* 复习时先把题目照片收起来：照片里有孩子上次的作答，直接展示等于剧透 */
.qimg-mask{background:var(--surface2);color:var(--muted2);text-align:center;padding:24px 16px}
.qimg-mask .t{font-size:15px;font-weight:600}
/* 复习时的「错处加粗」：上次错的那几个小题一眼就能看到，不在会的题上耽误时间 */
.wq{font-weight:700;background:linear-gradient(transparent 58%, #ffe08a 58%);border-radius:2px}
.wqhint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#a9720a;margin-bottom:8px}
/* 「只看错的部分」：把答对的小题收起来（篇章原文和大题题干永远留着，不然没法做题） */
.onlywrong .squnit.hid{display:none}

/* ---------- 原图窗口：内嵌在错题上方，一次一张、可翻页、可缩放 ---------- */
/* 要点：图片用 transform 在一个「尺寸永远不变」的容器里平移缩放 ——
   放大缩小时只有窗口里的画面在变，下面的题目文字纹丝不动。
   （以前是给 img 设 width，一放大就把整页布局撑开、下面的内容全被顶走。） */
.pbox{position:relative;height:38vh;height:38dvh;min-height:210px;max-height:360px;overflow:hidden;
  background:#0d1520;user-select:none;-webkit-user-select:none;touch-action:pan-y;
  cursor:grab;overscroll-behavior:contain}
.pbox.panning{cursor:grabbing}
.pbox img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  max-width:none;max-height:none;pointer-events:none}
.pbox.loading img{opacity:0}
.pbox .pbmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8fa0b8;font-size:13px;text-align:center;padding:0 22px;line-height:1.7}
.pbox .pbbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:5px;
  padding:8px 8px 9px;background:linear-gradient(transparent,rgba(6,11,18,.86))}
.pbox .pbbar button{color:#fff;background:rgba(255,255,255,.15);border-radius:9px;
  padding:6px 10px;font-size:13px;line-height:1;min-width:34px}
.pbox .pbbar button:active{background:rgba(255,255,255,.34)}
.pbox .pbbar button:disabled{opacity:.35}
/* 当前生效的模式（按宽度铺满 / 整图适应）高亮，一眼看得出在看哪种 */
.pbox .pbbar button.on{background:rgba(255,255,255,.52);color:#0b1622;font-weight:700}
.pbox .pbbar .sp{flex:1}
.pbox .pbbar .rd{color:#c9d6e8;font-size:12px;font-variant-numeric:tabular-nums;padding:0 2px}
.pbox .pbdots{position:absolute;top:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.pbox .pbdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.34);
  transition:width .18s,background .18s}
.pbox .pbdots i.on{background:var(--card);width:16px;border-radius:99px}
.pbox .pbnav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:56px;
  border-radius:11px;background:rgba(8,13,20,.52);color:#fff;font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.pbox .pbnav:active{background:rgba(8,13,20,.8)}
.pbox .pbnav.l{left:8px} .pbox .pbnav.r{right:8px}
.pbox .pbhint{position:absolute;left:0;right:0;top:8px;text-align:center;color:#93a4bb;
  font-size:11px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* 旧压缩图/图丢了这类需要说明的情况 */
.pbox.bad .pbmsg{color:#f0b9a0}
.answer{margin:12px 14px;padding:14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.progress{height:5px;background:#e2e8f2;border-radius:99px;overflow:hidden;margin:0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f6bed,#54a0ff);border-radius:99px;
  transition:width .25s}
.judge{display:flex;gap:10px;padding:14px}
.judge .btn{flex:1;padding:15px;font-size:16px}

/* 今天该复习几题 —— 复习页顶部入口卡 */
.due-hero{background:linear-gradient(135deg,#2f6bed,#54a0ff);color:#fff;border-radius:16px;
  padding:18px;box-shadow:0 6px 18px rgba(47,107,237,.28)}
.due-hero .btn{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.badge.due{background:var(--bad-soft);color:var(--bad)}

/* ---- 首页看板（问候 + 四卡 + 各科进度 + 优先补练，替代旧“今天该复习N题”横幅）---- */
.dash{margin:12px 14px 0}
.dash-hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,#2f6bed,#5b8df8);color:#fff;box-shadow:0 6px 16px rgba(47,107,237,.22);cursor:pointer}
.dash-hero.urgent{background:linear-gradient(135deg,#e5484d,#f2703f);box-shadow:0 6px 16px rgba(229,72,77,.22)}
.dash-hero.calm{background:linear-gradient(135deg,#0e9f6e,#2bb98a);box-shadow:0 6px 16px rgba(14,159,110,.2)}
.dash-hero .t{font-size:16px;font-weight:700;line-height:1.3}
.dash-hero .s{font-size:12px;opacity:.9;margin-top:3px;line-height:1.5}
.dash-hero .btn{background:rgba(255,255,255,.94);color:var(--pri-d);padding:9px 14px;font-size:14px;flex:none}
.dash-hero.urgent .btn{color:var(--bad)}
.dash-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.dash-cards .c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.dash-cards .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.dash-cards .k{font-size:11px;color:var(--muted);margin-top:3px}
.dash-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:12px}
.dash-h{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.dash-prow{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
.dash-prow + .dash-prow{border-top:1px solid var(--line)}
.dash-prow .badge{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--pri-soft);color:var(--pri-d)}
.dash-prow .badge.od{background:var(--bad-soft);color:var(--bad-ink)}
.dash-prow .subj{flex:none;font-size:12px;color:var(--muted)}
.dash-prow .tx{font-size:13px;color:var(--ink2)}
.dash-pempty{padding:10px 2px;font-size:13px;color:var(--muted)}
.dash-foot{display:flex;justify-content:flex-end;margin-top:10px}
.linklike{background:none;border:0;color:var(--pri);font-size:13px;padding:6px 2px;cursor:pointer}
.dash-foldrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer}
.dash-mini{font-size:12px;color:var(--muted);flex:none}
/* 看板分组容器：手机端透明（不产生盒子），宽屏才成为真正的两栏 */
.dash-body{display:contents}
.dash-main,.dash-side{display:contents}
/* 各科进度：方形小卡并列（手机端两列小卡，替代原单行进度条） */
.dash-subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dash-scard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.dash-scard .sc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dash-scard .sc-nm{font-size:13px;font-weight:700;color:var(--ink2)}
.dash-scard .sc-pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dash-scard .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-bottom:5px}
.dash-scard .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--pri-d))}
.dash-scard .sc-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dash-scard:active{background:var(--pri-soft)}
/* 看板内嵌日历：直接铺在卡片下面，不用点开 */
.dash-cal{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:12px}
/* 看板右上角二维码卡（电脑上扫手机用；手机端看自己无意义，窄屏隐藏） */
.dash-qr{display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;grid-column:1/-1}
.dash-qr img{width:76px;height:76px;border-radius:6px;flex:none}
.dash-qr .t{font-size:13px;font-weight:700;color:var(--ink2)}
.dash-qr .s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;word-break:break-all}
.dash-qr .s b{color:var(--pri-d)}
/* ---- 复习日历（弹层里的月网格）---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.cal-head b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:11px;color:var(--faint);padding:4px 0}
.cal-cell{min-height:42px;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.cal-cell.has{background:var(--pri-soft);font-weight:700}
.cal-cell.today{outline:2px solid var(--pri);outline-offset:-2px}
.cal-cell.past{opacity:.4}
.cal-cell .n{font-size:11px;font-weight:800;color:var(--pri);line-height:1.2}

/* 首页顶部的「有没保存完的识别结果」横幅（误触离开页面后从这里找回） */
.draft-banner{display:flex;align-items:center;gap:8px;margin:12px 14px 0;padding:13px 14px;
  border-radius:14px;background:linear-gradient(135deg,#f0a020,#f7c948);color:#3d2c00;
  box-shadow:0 4px 14px rgba(240,160,32,.28)}
.draft-banner .t{font-size:16px;font-weight:700;line-height:1.25}
.draft-banner .s{font-size:12px;opacity:.85;margin-top:3px;line-height:1.4}
.draft-banner .btn{background:var(--card);color:#8a5b00;padding:9px 12px;font-size:14px;flex:none}
.draft-banner .btn.give{background:rgba(255,255,255,.6);color:#6b4a00;padding:9px 10px}

/* ---------- 设置页 ---------- */
.preset{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);margin-bottom:8px}
.preset.on{border-color:var(--pri-line);background:var(--soft)}
.preset .t{font-weight:600;font-size:15px}
.preset .s{font-size:12px;color:var(--muted);margin-top:2px}
.preset .u{font-size:11px;color:var(--faint);word-break:break-all;margin-top:4px}
.notice{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.55}
.notice.info{background:var(--pri-soft);color:#1c3f8f}
.notice.warn{background:var(--warn-soft);color:var(--warn-ink)}

/* ---------- 听力音频 ---------- */
.audiobox{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--pri-soft);box-shadow:var(--shadow)}
.audiobox textarea{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:12.5px;line-height:1.55;font-family:inherit;resize:vertical;color:var(--text)}
.audiobox textarea:focus{outline:none;border-color:var(--pri)}
.btn.small{padding:7px 12px;font-size:12.5px;border-radius:9px}

/* ---------- 一图多题（整页识别） ---------- */
.bstat{margin:12px 14px 0;padding:12px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.bstat .btop{display:flex;gap:12px;align-items:flex-start}
.bstat .bthumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2)}
.blist{padding-top:10px}

.qcard{margin:0 14px 10px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;border-left:4px solid var(--line)}
.qcard.wrong{border-left-color:var(--bad)}
.qcard.right{border-left-color:var(--ok)}
.qcard.partial{border-left-color:var(--warn)}
.qcard .hd{display:flex;align-items:center;gap:8px;padding:11px 12px 0}
.qcard .no{width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--muted2);font-size:13px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.qcard .bd{padding:8px 12px 12px}
.qcard .qt{font-size:15px;line-height:1.52;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.qcard .qt.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pick{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;
  padding:4px 11px;font-size:13px;font-weight:600}
.pick.on{background:var(--pri);border-color:var(--pri);color:#fff}

.ansbox{margin-top:9px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ansbox .ln{display:flex;gap:8px;padding:7px 10px;font-size:14px;line-height:1.5}
.ansbox .ln+.ln{border-top:1px solid var(--line)}
.ansbox .k{flex:none;width:58px;color:var(--muted);font-size:13px;padding-top:1px}
.ansbox .v{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.ansbox .ln.bad{background:var(--bad-soft)}
.ansbox .ln.bad .v{color:var(--bad-ink)}
.ansbox .ln.ok{background:var(--ok-soft)}
.ansbox .ln.ok .v{color:var(--ok-ink);font-weight:600}

.qfoot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{border:1.5px solid var(--pri-line);background:var(--card);color:var(--pri-d);border-radius:10px;
  padding:7px 12px;font-size:14px;font-weight:600}
.mini.pri{background:var(--pri-soft);border-color:var(--pri-line)}
.mini[disabled]{opacity:.6;pointer-events:none}
.qexp{margin-top:10px;padding:11px 12px;border-radius:10px;background:var(--soft);border:1px dashed #d3e0f8;
  font-size:15px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.qexp.sim{background:var(--note-bg);border-color:var(--note-line);margin-top:8px}
.spin.sm{width:18px;height:18px;border-width:2px;margin:0 auto 8px}

.savebar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));z-index:20;display:flex;
  gap:8px;align-items:center;margin-top:8px;padding:10px 14px;
  background:var(--head-bg);backdrop-filter:blur(8px);border-top:1px solid var(--line)}

/* ---------- 其它 ---------- */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);z-index:90;
  background:rgba(24,32,44,.94);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;
  opacity:0;transition:.22s;max-width:82vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 原图查看器：全屏浮层，自己管缩放与平移。
   旧写法是「整图塞进屏幕」，跨页拼出来的题图又高又窄（实测 1200x6436），
   一塞就只剩一百来像素宽的细缝，放大也糊 —— 所以改成按宽度铺满 + 可缩放。 */
#modal{position:fixed;inset:0;height:100vh;height:100dvh;z-index:80;background:rgba(8,13,20,.97);overflow:hidden;
  touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
#modal.hidden{display:none !important}
.vstage{position:absolute;inset:0;overflow:hidden}
#vImg{position:absolute;left:0;top:0;transform-origin:50% 50%;display:block;
  max-width:none;max-height:none;-webkit-user-drag:none;user-select:none}
.vtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;
  justify-content:space-between;gap:10px;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}
.vtop .vbtn{pointer-events:auto}
.vmeta{color:rgba(255,255,255,.78);font-size:12px;background:rgba(255,255,255,.14);
  border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
.vbar{position:absolute;left:50%;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;
  bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.13);border-radius:14px;padding:6px 8px;max-width:calc(100% - 16px)}
.vbtn{border:0;background:rgba(255,255,255,.16);color:#fff;font-size:14.5px;font-family:inherit;
  min-width:44px;height:44px;border-radius:11px;padding:0 10px}
.vbtn:active{background:rgba(255,255,255,.36)}
.vpct{color:#fff;font-size:12.5px;min-width:50px;text-align:center;
  font-variant-numeric:tabular-nums}
.vhint{position:absolute;left:14px;right:14px;pointer-events:none;color:#ffd9a8;font-size:12.5px;
  line-height:1.5;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.9);
  bottom:calc(env(safe-area-inset-bottom) + 74px)}
.sheet{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px}

/* 电脑上打开时收窄成手机宽度，别拉满屏 */
@media (min-width:760px){
  #main{max-width:560px;margin:0 auto}
  #topbar{padding-left:calc(50% - 266px);padding-right:calc(50% - 266px)}
  #tabbar button{flex:0 1 200px}
  #tabbar{justify-content:center}
  #toast{bottom:110px}

  /* ---------- 平板 / 大屏自适应：看原图的页面放宽、窗口加高 ----------
     手机一屏本来就窄，保持原样即可；760px 以上（平板、电脑）把「详情」「复习」
     两页的列放宽到接近整屏 —— 窗口太窄时，一张竖版卷子照片塞进去只剩几十像素宽，
     怎么放大都看不清。放开的是**装照片的列**，正文仍收在好读的行长里（660px）。
     顶栏跟着对齐：min(47vw,500px) 正好是 #main.wide 宽度的一半。 */
  #main.wide{max-width:min(94vw,1000px)}
  body.wide #topbar{
    padding-left:calc(50% - min(47vw,500px));
    padding-right:calc(50% - min(47vw,500px))}
  #main.wide>.pad,#main.wide .sec,#main.wide .answer,
  #main.wide .progress,#main.wide .review-card .q{
    max-width:660px;margin-left:auto;margin-right:auto}
  /* 窗口高度也放开：原来的 max-height:360px 在平板上只占屏幕一小条 */
  .pbox{height:min(58vh,620px);height:min(58dvh,620px);
    min-height:320px;max-height:none;border-radius:14px}
}
/* 超窄屏：把百分比读数藏起来，别把工具条挤到换行 */
@media (max-width:370px){
  .pbox [data-pbpct]{display:none}
}

/* ---- 宽屏桌面看板（≥1000px：电脑窗口/大屏才生效；手机平板扫码竖版不受影响）----
   看板从单列改成两列网格：问候/四卡/底部横跨两列，各科进度与优先补练并排。
   列表页正文仍收窄到好读的行长，只有工具条区跟着看板对齐。
   注意：必须放在 760px 断点之后——同优先级规则后写的覆盖先写的，
   否则 #main 的 560px 会盖掉这里的 1080px。 */
@media (min-width:1000px){
  #main{max-width:1080px}
  body:not(.wide) #topbar{padding-left:calc(50% - 526px);padding-right:calc(50% - 526px)}
  .dash{max-width:none}
  .dash-hero{padding:20px 22px;border-radius:16px}
  .dash-hero .t{font-size:22px}
  .dash-hero .s{font-size:14px}
  .dash-cards{gap:14px;margin-top:14px}
  .dash-cards .c{padding:16px 6px;border-radius:14px}
  .dash-cards .v{font-size:28px}
  .dash-cards .k{font-size:12px}
  .dash-sec{margin-top:14px;padding:14px 16px;border-radius:14px}
  .dash-h{font-size:14px}
  /* 版面：hero 横贯整行；其下两栏——左主信息，右扫码+日历+收起钮。
     align-items:stretch 让右栏拉伸到与左栏同高（日历下的收起钮贴住底边） */
  .dash-body{display:grid;grid-template-columns:1.55fr 1fr;column-gap:16px;align-items:stretch}
  .dash-main,.dash-side{display:block;min-width:0}
  /* 两栏各自吃满同高（stretch 的 max）：左栏补练框、右栏日历卡分别 flex:1，
     这样「优先补练框底边」与「日历卡底边」严格平齐 */
  .dash-main{display:flex;flex-direction:column}
  .dash-main>.dash-sec:last-of-type{flex:1}
  .dash-side{display:flex;flex-direction:column}
  .dash-side .dash-cal{margin-top:10px;flex:1;display:flex;flex-direction:column}
  .dash-side .dash-cal .cal-grid{flex:1}
  .dash-prow .tx{font-size:13.5px}
  /* 各科进度方卡：宽屏四张一排（恰好 4 科） */
  .dash-subjgrid{grid-template-columns:repeat(4,1fr);gap:10px}
  .dash-scard{background:var(--card);border-radius:11px;padding:11px 12px}
  .dash-scard .sc-nm{font-size:14px}
  .dash-scard .bar{height:7px}
  /* 二维码卡：紧凑横排在右栏顶部 */
  .dash-qr{display:flex;margin-top:14px}
  .dash-qr img{width:84px;height:84px}
  .dash-qr .t{font-size:12.5px}
  .dash-qr .s{font-size:11.5px}
  /* 列表工具条/筛选/题目列表：收在 760px 居中，别拉满 1080px 不好读 */
  .toolbar,.tabs,.dash + .pad,#listWrap{max-width:760px;margin-left:auto;margin-right:auto}
  .tabs{max-width:790px}
  /* 统计 / 设置 / 录入（非 wide 的普通页）：正文一律收在 760px 居中，
     和列表一个观感——宽屏是「看板独享两列」，其余页面只是居中放大 */
  #main>.pad,#main>.sec{max-width:760px;margin-left:auto;margin-right:auto}
  #main>.center{max-width:760px}
}

function normalizeTag(s) {
  const t = String(s == null ? '' : s).trim().replace(/^[#＃]+/, '').replace(/[。．.、，,;；:：]+$/, '').trim();
  if (!t) return '';
  if (ALL_TAGS.indexOf(t) >= 0) return t;
  if (TAG_ALIAS[t]) return TAG_ALIAS[t];
  // 模型偶尔写成「计算粗心（进位错）」这种带括注的，剥掉括注再试一次
  const bare = t.replace(/[（(【\[].*?[)）】\]]/g, '').trim();
  if (bare && bare !== t) return normalizeTag(bare);

  for (const std of ALL_TAGS) if (t.indexOf(std) >= 0) return std;

})();
function reasonFromTags(tags) {
  const arr = Array.isArray(tags) ? tags : splitTagInput(tags);
  for (const t of arr) if (TAG_TO_REASON[t]) return TAG_TO_REASON[t];
  return '';
}
function splitTagInput(s) {
  return String(s == null ? '' : s).split(/[,，、;；/|\n\r]+/).map(x => x.trim()).filter(Boolean);
}
/** 取题目的标签数组：优先用服务端给的 tags，其次解析 reason_tags 串，最后退回老的主错因 */
function tagsOf(m) {
  if (!m) return [];
  if (Array.isArray(m.tags)) return m.tags.slice();
  const arr = splitTagInput(m.reason_tags);
  if (arr.length) return arr;
  return (m.error_reason && m.error_reason !== '无') ? [m.error_reason] : [];
}

/* ---------------- 按「复习次数（练过几次）」筛题 ---------------- */
/* 档位代号必须和服务端 RC_PRESETS 一致：0=没练过 1=一次 2=两次 3+=三次及以上 */
const RC_PRESETS = [
  ['', '不限'],
  ['0', '没练过'],
  ['1', '1 次'],
  ['2', '2 次'],
  ['3+', '3 次以上']
];
const RC_RANGE = { '0': [0, 0], '1': [1, 1], '2': [2, 2], '3+': [3, null] };

/** 一个输入框里的数字 → 非负整数，认不出（空的 / 乱写 / 负数）返回 null。 */
function rcNum(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return null;
  const n = parseInt(s, 10);
  return (isFinite(n) && n >= 0) ? n : null;
}
/** 用户填了「精确区间」吗（只要有一个框是有效数字就算）。 */
function rcHasRange(f) {
  return !!(f && (rcNum(f.rcMin) !== null || rcNum(f.rcMax) !== null));
}

/** 把条件解析成 [下限, 上限]（null = 不封顶）。★ 区间优先于档位，与服务端同口径。 */
function rcRange(f) {
  let lo = null, hi = null;
  if (rcHasRange(f)) {
    /* 只要区间里有一个有效数，就整个覆盖档位 —— 否则 rc=0（0~0）配 rcMin=3
       会被拼成「0~3 次」，而用户的意思明明是「3 次以上」 */
    lo = rcNum(f.rcMin);
    hi = rcNum(f.rcMax);
  } else if (f && RC_RANGE[f.rc]) {
    lo = RC_RANGE[f.rc][0];
    hi = RC_RANGE[f.rc][1];
  }
  if (lo !== null && hi !== null && lo > hi) { const t = lo; lo = hi; hi = t; }
  return [lo, hi];
}

/** 复习次数条件 → 请求参数。没筛就返回空对象。
 *  传的都是字符串 —— Store.list 拼 querystring 时会丢掉 falsy 值，数字 0 会被吃掉。 */
function rcParams(f) {
  const out = {};
  if (!f) return out;
  const r = rcRange(f);
  if (r[0] === null && r[1] === null) return out;
  if (rcHasRange(f)) {
    if (r[0] !== null) out.rc_min = String(r[0]);
    if (r[1] !== null) out.rc_max = String(r[1]);
  } else {
    out.rc = f.rc;
  }
  return out;
}

/** 复习次数条件的一句话说明（筛选按钮上显示用）。没筛返回空串。 */
function rcLabel(f) {
  if (!f) return '';
  const r = rcRange(f);
  if (r[0] === null && r[1] === null) return '';
  if (!rcHasRange(f)) {
    const hit = RC_PRESETS.filter(x => x[0] === f.rc)[0];
    return hit ? hit[1] : '';
  }
  if (r[0] !== null && r[1] !== null) return '练过 ' + r[0] + '～' + r[1] + ' 次';
  return r[0] !== null ? '练过 ' + r[0] + ' 次以上' : '练过 ' + r[1] + ' 次以内';
}

/** 复习次数筛选控件：一排档位按钮 + 一行「精确区间」（两个数字框） */
function rcFilterHTML(prefix, f) {
  f = f || {};
  /* ★ 区间生效时不属于任何一个档位 → 一个都不高亮。
     （不能因为 f.rc 是空串就把「不限」点亮 —— 那看着像根本没筛，实际筛了） */
  const cur = rcHasRange(f) ? null : (f.rc || '');
  return '<div class="seg" id="' + prefix + 'Rc">'
    + RC_PRESETS.map(x => '<button data-val="' + esc(x[0]) + '" class="'
      + (cur !== null && cur === x[0] ? 'on' : '') + '">' + esc(x[1]) + '</button>').join('')
    + '</div>'
    + '<div class="rcrange">'
    + '<span>练过</span>'
    + '<input type="number" min="0" step="1" inputmode="numeric" id="' + prefix + 'RcMin" value="' + esc(f.rcMin || '') + '" placeholder="最少">'
    + '<span>～</span>'
    + '<input type="number" min="0" step="1" inputmode="numeric" id="' + prefix + 'RcMax" value="' + esc(f.rcMax || '') + '" placeholder="最多">'
    + '<span>次</span>'
    + '</div>';
}

/** 绑定复习次数筛选控件。
 *  getF 返回筛选条件对象（会被就地修改）；onChange 在条件真的变了之后调用。
 *  ★ 档位与区间互斥：点档位就清空区间，在区间框里打字就清掉档位，免得两个条件打架。 */
function bindRcFilter(prefix, getF, onChange) {
  const seg = $('#' + prefix + 'Rc');
  /* 按当前状态重画高亮。★ 区间生效时一个档位都不高亮（「不限」也不亮），
     否则用户填了区间还看到「不限」亮着，会以为条件没生效。 */
  const paintSeg = () => {
    if (!seg) return;
    const f = getF();
    const cur = rcHasRange(f) ? null : (f.rc || '');
    $$('button', seg).forEach(x => x.classList.toggle('on', cur !== null && x.dataset.val === cur));
  };
  if (seg) seg.onclick = (ev) => {
    const b = ev.target.closest('button[data-val]');
    if (!b) return;
    const f = getF();
    f.rc = b.dataset.val;
    f.rcMin = ''; f.rcMax = '';          // 档位与区间互斥
    const lo = $('#' + prefix + 'RcMin'), hi = $('#' + prefix + 'RcMax');
    if (lo) lo.value = '';
    if (hi) hi.value = '';
    paintSeg();
    if (onChange) onChange();
  };
  [['Min', 'rcMin'], ['Max', 'rcMax']].forEach(pair => {
    const el = $('#' + prefix + 'Rc' + pair[0]);
    if (!el) return;
    /* 打字过程只同步状态，不做查询（否则每敲一位就查一次）；
       真正触发查询/重画交给 change（失焦或回车）。 */
    el.oninput = () => {
      const f = getF();
      f[pair[1]] = String(el.value || '').trim();
      f.rc = '';                          // 反方向也一样：填了区间就清掉档位
      paintSeg();
    };
    el.onchange = () => { if (onChange) onChange(); };
  });
}

/* ---------------- 工具函数 ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtMD = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<b>$1</b>');
const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
function fmtDate(t) {
  if (!t) return '';
  const d = new Date(String(t).replace(/-/g, '/'));
  if (isNaN(d.getTime())) return String(t).slice(0, 10);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return (sameYear ? '' : d.getFullYear() + '-') + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
/** 带时分的时间：今天识别的结果就写「今天 20:15」，看着比一串日期亲切 */
function fmtDateTime(t) {
  if (!t) return '';
  const d = new Date(String(t).replace(/-/g, '/'));
  if (isNaN(d.getTime())) return String(t).slice(0, 16);
  const now = new Date();
  const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) {
    return '今天 ' + hm;
  }
  return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '-')
    + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + hm;
}

function imgSaveOpts() {
  return Store.mode === 'server'
