/** 发给模型前把 data URL 缩到 AI_MAX_SIDE；本来就不大、或已是服务端相对路径，直接透传 */
function shrinkForAI(url, maxSide, quality) {
  maxSide = maxSide || AI_MAX_SIDE;
  quality = (quality == null) ? AI_QUALITY : quality;
  if (typeof url !== 'string' || url.indexOf('data:') !== 0) return Promise.resolve(url);
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(url);            // 缩图失败就用原图，别把识别搞挂
    img.onload = () => {
      const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
      const sc = Math.min(1, maxSide / Math.max(w0, h0));
      if (!w0 || !h0 || sc >= 1) { resolve(url); return; }
      const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try { resolve(cv.toDataURL('image/jpeg', quality)); } catch (e) { resolve(url); }
    };
    img.src = url;
  });
}

/** 压缩图片：长边限制 + JPEG 质量，控制上传体积 */
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1600; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取图片失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片解析失败'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------- 听力音频（AI 不认识音频，所以先转成文字再用） ---------------- */
const AUDIO_MAX_MB = 20;              // 与服务端 MAX_AUDIO_MB 对齐（留点余量）

/** 把音频文件读成 data URL，并顺带量出时长（拿不到时长也不算失败） */
function readAudioFile(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('没选到音频文件')); return; }
    if (file.size > AUDIO_MAX_MB * 1024 * 1024) {
      reject(new Error('音频有 ' + (file.size / 1048576).toFixed(1) + ' MB，超过 ' + AUDIO_MAX_MB
        + ' MB 上限，截短一点再传（听力一般 3～5 分钟就够）'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取音频失败'));
    reader.onload = () => {
      const url = reader.result;
      const out = { url: url, name: file.name || '听力音频', size: file.size, duration: 0 };
      const a = document.createElement('audio');
      a.preload = 'metadata';
      a.onloadedmetadata = () => resolve(Object.assign(out, { duration: a.duration || 0 }));
      a.onerror = () => resolve(out);          // 某些格式量不出时长，照样能用
      a.src = url;
      setTimeout(() => resolve(out), 2500);    // 兜底：迟迟没有 metadata 就直接返回
    };
    reader.readAsDataURL(file);
  });
}

function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function fmtSize(bytes) {
  const mb = (bytes || 0) / 1048576;
  return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round((bytes || 0) / 1024) + ' KB';
}

/** 转写：优先走服务端 /api/asr（服务端会带上配置里的 Key）；本地模式则浏览器直连云端 */
async function asrTranscribe(dataUrl) {
  if (Store.mode === 'server') {
    const r = await Store._api('asr', { method: 'POST', body: JSON.stringify({ audio: dataUrl }) });
    return (r.text || '').trim();
  }
  // 本地直连模式：需要设置里填了 ASR 地址与 Key
  const cfg = Store.cfg || {};
  const base = (cfg.asr_base_url || '').replace(/\/$/, '');
  const key = cfg.asr_api_key || cfg.api_key || '';
  if (!base || !key) throw new Error('浏览器本地模式要转写听力音频，请先到「设置」页填「语音转文字」的接口地址和 Key');
  const blob = await (await fetch(dataUrl)).blob();
  const ext = (blob.type.indexOf('wav') >= 0) ? 'wav' : 'mp3';
  const fd = new FormData();
  fd.append('model', cfg.asr_model || 'FunAudioLLM/SenseVoiceSmall');
  fd.append('file', blob, 'listening.' + ext);
  const r = await fetch(base + '/audio/transcriptions', {
    method: 'POST', headers: { Authorization: 'Bearer ' + key }, body: fd
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.error && (j.error.message || j.error.code)) || ('转写接口返回 ' + r.status));
  return ((j && j.text) || '').trim();
}

function parseJSONLoose(text) {
  if (!text) throw new Error('模型没有返回内容');
  let s = String(text).trim();
  s = s.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e) {
    // 常见容错：去掉尾随逗号
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, '$1')); }
    catch (e2) { throw new Error('模型返回的不是合法 JSON，可重试一次'); }
  }
}

/** 扫出文本里所有「括号配平」的对象片段（含嵌套），字符串里的括号不算 */
function scanJsonObjects(s) {
  const out = [];
  const stack = [];
  let inStr = false, escp = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) {
      if (escp) escp = false;
      else if (c === '\\') escp = true;
      else if (c === '"') inStr = false;
      continue;
    }
    if (c === '"') { inStr = true; continue; }
    if (c === '{') stack.push(i);
    else if (c === '}') {
      if (stack.length) out.push(s.slice(stack.pop(), i + 1));
    }
  }
  return out;
}

function tryParseLoose(frag) {
  try { return JSON.parse(frag); } catch (e) { /* 继续 */ }
  try { return JSON.parse(frag.replace(/,\s*([}\]])/g, '$1')); } catch (e) { return null; }
}

/**
 * 解析「一图多题」的返回结果。
 * 模型偶尔会因为 max_tokens 用尽把 JSON 截断（最后一道题写到一半），
 * 这时候不能整单丢弃——把已经写完整的那几道题抠出来照样能用。
 */
function parseQuestionsLoose(text) {
  if (!text) throw new Error('模型没有返回内容');
  let s = String(text).trim();
  s = s.replace(/^```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = s.indexOf('{');
  if (a > 0) s = s.slice(a);

  /* 1) 先按完整 JSON 试 */
  const whole = tryParseLoose(s);
  if (whole && typeof whole === 'object' && !Array.isArray(whole)) {
    if (Array.isArray(whole.questions) || whole.question_text) return whole;
  }

  /* 2) 截断了 → 逐个抠出完整的题目对象 */
  const picked = [];
  scanJsonObjects(s).forEach(frag => {
    const o = tryParseLoose(frag);
    if (!o || typeof o !== 'object' || Array.isArray(o)) return;
    if (!o.question_text) return;       // 只要题
    if (o.questions) return;            // 外层大对象不要
    picked.push(o);
  });
  if (picked.length) {
    const sub = /"subject"\s*:\s*"([^"]*)"/.exec(s);
    const src = /"source_type"\s*:\s*"([^"]*)"/.exec(s);
    const chp = /"chapter"\s*:\s*"([^"]*)"/.exec(s);
    return {
      subject: sub ? sub[1] : '',
      source_type: src ? src[1] : '',
      chapter: chp ? chp[1] : '',
      questions: picked,
      _recovered: true
    };
  }
  throw new Error('模型返回的不是合法 JSON，可重试一次');
}

function normalizeSubject(s) {
  const t = String(s || '');
  for (const x of SUBJECTS) if (t.indexOf(x) >= 0) return x;
  if (/math/i.test(t)) return '数学';
  if (/chinese/i.test(t)) return '语文';
  if (/english/i.test(t)) return '英语';
  if (/science/i.test(t)) return '科学';
  return '未分类';
}
function normalizeReason(s) {
  /* 兼容用：把任意字符串折算成六选一里的一个（只在处理老数据时可能用到） */
  const t = String(s || '');
  for (const x of REASONS) if (t.indexOf(x) >= 0) return x;
  return '无';
}
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text); return true;
    }
  } catch (e) { /* 继续走兜底 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* ---------------- 间隔复习：艾宾浩斯遗忘曲线 ---------------- */
/* 这张表必须和后端 server.py 的 SPACED_INTERVALS 保持一致；
   本地模式（localStorage）没有服务端算，就靠这里补齐同样的行为。 */
const SPACED_INTERVALS = { 0: 0, 1: 1, 2: 2, 3: 4, 4: 7, 5: 15 };
const SPACED_LABELS = {
  0: '今天再来一遍', 1: '明天复习', 2: '2 天后复习',
  3: '4 天后复习', 4: '7 天后复习', 5: '15 天后抽查（已掌握）'
};

/** 解析时间串：兼容服务端的 "2026-09-10 23:14:17" 和本地模式的 ISO 串 */
function parseTS(t) {
  if (!t) return null;
  const s = String(t).trim();
  if (!s) return null;
  // 补上 T 之后按本地时间解析（ES2015 起带 T 无时区 = 本地时间），跨浏览器一致
  const d = new Date(s.indexOf('T') > 0 ? s : s.replace(' ', 'T'));
  return isNaN(d.getTime()) ? null : d;
}

/** 算出一道题「下次该什么时候复习」，与后端 compute_schedule 同规则 */
function scheduleOf(m) {
  m = m || {};
  const mastery = Math.max(0, Math.min(5, Number(m.mastery || 0)));
  const days = SPACED_INTERVALS[mastery];
  const base = (m.review_count ? parseTS(m.last_reviewed_at) : null) || parseTS(m.created_at) || new Date();
  const due = new Date(base.getTime() + days * 864e5);
  const deltaMs = due.getTime() - Date.now();
  const eps = 1000; // 1 秒容差，吸掉浮点/时钟误差
  const dueInDays = deltaMs <= eps
    ? -Math.floor((-deltaMs) / 864e5 + 1e-9)
    : Math.ceil(deltaMs / 864e5 - 1e-9);
  return {
    next_due_at: due,
    due_in_days: dueInDays,
    is_due: deltaMs <= eps,
    interval_days: days,
    interval_label: SPACED_LABELS[mastery],
    overdue_days: Math.max(0, -dueInDays)
  };
}

/** 把「还有几天到期」说成人话 */
function dueText(info) {
  if (!info) return '';
  if (info.is_due) {
    if (info.overdue_days >= 1) return '已到期 ' + info.overdue_days + ' 天';
    return '今天到期';
  }
  if (info.due_in_days <= 0) return '今天到期';
  if (info.due_in_days === 1) return '明天复习';
  return info.due_in_days + ' 天后复习';
}

/* ---------------- 存储层：服务端 SQLite / 本地浏览器 ---------------- */
const LS_DB = 'ctb_db_v1', LS_CFG = 'ctb_cfg_v1', LS_DRAFT = 'ctb_draft_v1';

const Store = {
  mode: 'local',
  cfg: { provider: 'siliconflow', base_url: PRESETS[0].base, model: PRESETS[0].model, api_key: '', proxy: '' },

  async init() {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch('./api/health', { cache: 'no-store', signal: ctl.signal });
      clearTimeout(timer);
      if (r.ok) {
        const j = await r.json();
        if (j && j.ok) {
          this.mode = 'server'; this.info = j;
          try { await this.config(); } catch (e) {}   // 开机即拉配置（预算、模型等），不进设置页也能生效
          return;
        }
      }
    } catch (e) { /* 离线模式 */ }
    this.mode = 'local';
    try { const c = JSON.parse(localStorage.getItem(LS_CFG) || 'null'); if (c) this.cfg = Object.assign(this.cfg, c); } catch (e) {}
  },

  /* ---- 本地模式小工具 ---- */
  _ls() {
    try {
      const d = JSON.parse(localStorage.getItem(LS_DB) || 'null');
      if (d && d.mistakes) return d;
    } catch (e) {}
    return { seq: 1, rid: 1, mistakes: [], reviews: [] };
  },
  _save(db) { localStorage.setItem(LS_DB, JSON.stringify(db)); },

  /* ---- 未保存的识别结果（草稿）----
     识别完、还没点「存入错题本」前先把结果暂存：误触返回、切页签、刷新、
     甚至手机把标签页杀掉，回来都能接着整理（首页会出现「继续整理」横幅）。
     服务端模式：结果存 data/draft.json，原图落 data/images/（draft- 前缀），
                点「存入错题本」时原图**原样转正**，不重复占空间。
     本地模式：只有 localStorage 5MB，装不下照片 base64 —— 丢图保题目文字，
                恢复时会明确提示「图片没保存，需要重新拍一张」。 */
  async getDraft() {
    if (this.mode === 'server') return (await this._api('draft')).draft || null;
    try { return JSON.parse(localStorage.getItem(LS_DRAFT) || 'null'); } catch (e) { return null; }
  },
  async saveDraft(d) {
    if (this.mode === 'server') {
      const r = await this._api('draft', { method: 'POST', body: JSON.stringify(d) });
      return r.draft || null;          // ★ 必须把服务端那份返回来：调用方要靠它把 data URL 换成路径
    }
    try {
      const n = (d.photos || []).length;
      localStorage.setItem(LS_DRAFT, JSON.stringify(Object.assign({}, d, { photos: [], photos_lost: n })));
    } catch (e) { /* 配额满就放弃暂存，绝不能影响主流程 */ }
    return null;
  },
  async clearDraft(withImages) {
    if (this.mode === 'server') {
      const r = await this._api('draft' + (withImages ? '?images=1' : ''), { method: 'DELETE' });
      return r.removed_images || 0;
    }
    try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
    return 0;
  },

  async _api(path, opts) {
    const res = await fetch('./api/' + path, Object.assign({
      headers: { 'Content-Type': 'application/json' }
    }, opts || {}));
    let j = null;
    try { j = await res.json(); } catch (e) {}
    if (!res.ok || !j || j.ok === false) throw new Error((j && j.error) || ('请求失败 ' + res.status));
    return j;
  },

  /* ---- 错题 CRUD ---- */
  async list(f) {
    f = f || {};
    if (this.mode === 'server') {
      const qs = new URLSearchParams();
      Object.keys(f).forEach(k => { if (f[k]) qs.set(k, f[k]); });
      return (await this._api('mistakes?' + qs.toString())).items;
    }
    let arr = this._ls().mistakes.filter(m => !m.deleted);
    if (f.subject && f.subject !== '全部') arr = arr.filter(m => m.subject === f.subject);
    if (f.q) {
      const q = String(f.q).toLowerCase();
      /* 与服务端 list_mistakes 同一份字段清单：干净原题与孩子答案也纳入搜索 */
      arr = arr.filter(m => [m.question_text, m.clean_text, m.knowledge_point, m.chapter,
        m.explanation, m.error_reason, m.reason_tags, m.student_answer]
        .some(x => String(x || '').toLowerCase().indexOf(q) >= 0));
    }
    if (f.error_reason && f.error_reason !== '全部') arr = arr.filter(m => m.error_reason === f.error_reason);
    if (f.tags) {
      const want = Array.isArray(f.tags) ? f.tags : splitTagInput(f.tags);
      if (want.length) arr = arr.filter(m => tagsOf(m).some(t => want.indexOf(t) >= 0));
    }
    /* 复习次数（练过几次）：档位 rc 与区间 rc_min/rc_max 都支持，口径同服务端 */
    const rcR = rcRange(f);
    if (rcR[0] !== null || rcR[1] !== null) {
      arr = arr.filter(m => {
        const c = Number(m.review_count || 0);
        return (rcR[0] === null || c >= rcR[0]) && (rcR[1] === null || c <= rcR[1]);
      });
    }
    if (f.low) arr = arr.filter(m => (m.mastery || 0) < 3);
    if (f.unmastered) arr = arr.filter(m => (m.mastery || 0) < 5);
    if (f.weak) arr = arr.filter(m => (m.mastery || 0) < 5 && !(m.review_count));
    if (f.due) arr = arr.filter(m => scheduleOf(m).is_due);
    arr.sort((a, b) => f.sort === 'mastery' ? (a.mastery - b.mastery || b.id - a.id)
      : f.sort === 'review' ? ((a.review_count || 0) - (b.review_count || 0) || b.id - a.id)
        : f.sort === 'due' ? (scheduleOf(a).next_due_at - scheduleOf(b).next_due_at || a.id - b.id)
          : f.sort === 'old' ? a.id - b.id : b.id - a.id);
    return arr;
  },

  async get(id) {
    id = Number(id);
    if (this.mode === 'server') return (await this._api('mistakes/' + id)).item;
    const m = this._ls().mistakes.find(x => x.id === id);
    if (!m) throw new Error('错题不存在');
    m.reviews = this._ls().reviews.filter(r => r.mistake_id === id).sort((a, b) => b.id - a.id);
    return m;
  },

  async create(payload) {
    if (this.mode === 'server') return (await this._api('mistakes', { method: 'POST', body: JSON.stringify(payload) })).item;
    const db = this._ls();
    const now = new Date().toISOString();
    const m = Object.assign({
      subject: '未分类', chapter: '', knowledge_point: '', error_reason: '', reason_tags: '',
      question_image: '', question_text: '', clean_text: '', clean_at: '',
      student_answer: '', correct_answer: '',
      explanation: '', similar_question: '', check_result: '', is_correct: 'unknown',
      mastery: 0, source_type: '作业', review_count: 0, last_reviewed_at: '',
      audio_url: '', listening_text: '',
      created_at: now, updated_at: now, deleted: 0
    }, payload, { id: db.seq++ });
    db.mistakes.push(m); this._save(db);
    return m;
  },

  /** 一图多题：批量新建；sharedImage 是整页原图、sharedAudio 是整卷听力音频，服务端各只落盘一次 */
  async createMany(list, sharedImage, sharedAudio) {
    list = (list || []).filter(Boolean);
    if (!list.length) return 0;
    if (this.mode === 'server') {
      const r = await this._api('mistakes/batch', {
        method: 'POST',
        body: JSON.stringify({
          items: list, shared_image: sharedImage || '', audio_url: sharedAudio || ''
        })
      });
      return r.created || (r.items || []).length;
    }
    const db = this._ls();
    const now = new Date().toISOString();
    const img = sharedImage || '';
    const made = list.map(p => Object.assign({
      subject: '未分类', chapter: '', knowledge_point: '', error_reason: '', reason_tags: '',
      question_image: img, question_text: '', clean_text: '', clean_at: '',
      student_answer: '', correct_answer: '',
      explanation: '', similar_question: '', check_result: '', is_correct: 'unknown',
      mastery: 0, source_type: '作业', review_count: 0, last_reviewed_at: '',
      audio_url: sharedAudio || '', listening_text: '',
      created_at: now, updated_at: now, deleted: 0
    }, p, { id: db.seq++ }));
    made.forEach(m => db.mistakes.push(m));
    try { this._save(db); } catch (e) {
      /* 浏览器本地空间不足（一页原图存 N 份很容易撑爆 5MB）→ 先丢图片，再丢音频，只留文字 */
      made.forEach(m => { m.question_image = ''; });
      try {
        this._save(db);
        toast('浏览器本地空间不足，本次只保存了文字、没附原图', 3600);
      } catch (e2) {
        made.forEach(m => { m.audio_url = ''; });
        try {
          this._save(db);
          toast('浏览器本地空间不足，本次没附原图和听力音频', 3600);
        } catch (e3) {
          made.forEach(m => { db.mistakes.pop(); });
          throw new Error('浏览器本地空间已满，请到「设置」导出备份后清理，或改用服务端模式');
        }
      }
    }
    return made.length;
  },

  async update(id, patch) {
    id = Number(id);
    if (this.mode === 'server') return (await this._api('mistakes/' + id, { method: 'PUT', body: JSON.stringify(patch) })).item;
    const db = this._ls();
    const m = db.mistakes.find(x => x.id === id);
    if (!m) throw new Error('错题不存在');
    Object.assign(m, patch, { updated_at: new Date().toISOString() });
    this._save(db);
    return m;
  },

  async remove(id) {
    id = Number(id);
    if (this.mode === 'server') { await this._api('mistakes/' + id, { method: 'DELETE' }); return; }
    const db = this._ls();
    const m = db.mistakes.find(x => x.id === id);
    if (m) { m.deleted = 1; this._save(db); }
  },

  async review(id, isCorrect, note) {
    id = Number(id);
    if (this.mode === 'server') {
      return await this._api('mistakes/' + id + '/review', {
        method: 'POST', body: JSON.stringify({ is_correct: !!isCorrect, note: note || '' })
      });
    }
    const db = this._ls();
    const m = db.mistakes.find(x => x.id === id);
    if (!m) throw new Error('错题不存在');
    const before = m.mastery || 0;
    const after = isCorrect ? Math.min(5, before + 1) : 0;
    const rec = {
      id: db.rid++, mistake_id: id, reviewed_at: new Date().toISOString(),
      is_correct: isCorrect ? 1 : 0, note: note || ''
    };
    db.reviews.push(rec);
    m.mastery = after; m.review_count = (m.review_count || 0) + 1;
    m.last_reviewed_at = rec.reviewed_at; m.updated_at = rec.reviewed_at;
    this._save(db);
    const sch = scheduleOf(m);
    return {
      record: rec, mastery: after, mastery_before: before, correct: !!isCorrect,
      next_due_at: sch.next_due_at.toISOString(), due_in_days: sch.due_in_days,
      interval_days: sch.interval_days, interval_label: sch.interval_label
    };
  },

  /** 真正取统计的地方；外部请用 stats()，它会顺手刷新角标 */
  async statsRaw() {
    if (this.mode === 'server') return (await this._api('stats')).stats;
    const arr = this._ls().mistakes.filter(m => !m.deleted);
    const bySubject = SUBJECTS.map(s => {
      const ms = arr.filter(m => m.subject === s);
      return { subject: s, n: ms.length, mastered: ms.filter(m => (m.mastery || 0) >= 5).length };
    });
    const reasonMap = {}, tagMap = {};
    arr.forEach(m => { if (m.error_reason) reasonMap[m.error_reason] = (reasonMap[m.error_reason] || 0) + 1; });
    /* 标签是复选的，一道题会落进好几个标签（和服务端 stats 的口径一致） */
    arr.forEach(m => tagsOf(m).forEach(t => { tagMap[t] = (tagMap[t] || 0) + 1; }));
    const kpMap = {};
    arr.forEach(m => String(m.knowledge_point || '').split(/[,，、;；/|]+/).filter(Boolean)
      .forEach(k => { kpMap[k.trim()] = (kpMap[k.trim()] || 0) + 1; }));
    const pool = arr.filter(m => (m.mastery || 0) < 5);   // 复习池：还没掌握的
    const duePool = pool.filter(m => scheduleOf(m).is_due);
    const future = pool.filter(m => !scheduleOf(m).is_due)
      .map(m => scheduleOf(m).next_due_at).sort((a, b) => a - b);

    // 最该补的知识点：未掌握的题里出现最多、平均掌握度最低的
    const weakMap = {};
    pool.forEach(m => String(m.knowledge_point || '').split(/[,，、;；/|]+/).filter(Boolean)
      .forEach(k => {
        const key = k.trim();
        const d = weakMap[key] || (weakMap[key] = { n: 0, sum: 0 });
        d.n++; d.sum += Number(m.mastery || 0);
      }));
    const weakKp = Object.keys(weakMap)
      .map(k => ({ kp: k, n: weakMap[k].n, avg_mastery: Math.round(weakMap[k].sum / weakMap[k].n * 10) / 10 }))
      .sort((a, b) => (b.n - a.n) || (a.avg_mastery - b.avg_mastery)).slice(0, 5);

    // 本周小结（近 7 天）
    const cutoff = Date.now() - 7 * 864e5;
    const wkReviews = this._ls().reviews.filter(r => {
      const d = parseTS(r.reviewed_at);
      return d && d.getTime() >= cutoff;
    });
    const wkCorrect = wkReviews.filter(r => Number(r.is_correct)).length;

    // 看板三件套：连续天数 / 优先补练 / 到期日分布（与服务端 stats 同口径）
    const fmtDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const daySet = {};
    this._ls().reviews.forEach(r => { const d = parseTS(r.reviewed_at); if (d) daySet[fmtDay(d)] = 1; });
    let streakDays = 0;
    {
      const d = new Date();
      if (!daySet[fmtDay(d)]) d.setDate(d.getDate() - 1);   // 今天还没练不打断，从昨天起算
      while (daySet[fmtDay(d)]) { streakDays++; d.setDate(d.getDate() - 1); }
    }
    const topDue = duePool.slice()
      .sort((a, b) => scheduleOf(a).next_due_at - scheduleOf(b).next_due_at)
      .slice(0, 3).map(m => {
        const pv = String(m.clean_text || m.question_text || '').replace(/\s+/g, ' ').trim();
        return { id: m.id, subject: m.subject || '未分类',
          overdue: Math.max(0, scheduleOf(m).overdue_days || 0),
          preview: pv.length > 40 ? pv.slice(0, 38) + '…' : pv };
      });
    const todayKey = fmtDay(new Date());
    const dueDates = {};
    pool.forEach(m => {
      const s = scheduleOf(m);
      const k = s.is_due ? todayKey : fmtDay(s.next_due_at);  // 过期的全滚进今天
      dueDates[k] = (dueDates[k] || 0) + 1;
    });

    return {
      total: arr.length,
      mastered: arr.filter(m => (m.mastery || 0) >= 5).length,
      fresh: arr.filter(m => !m.review_count).length,
      review_count: this._ls().reviews.length,
      by_subject: bySubject,
      by_reason: Object.keys(reasonMap).map(k => ({ reason: k, n: reasonMap[k] })).sort((a, b) => b.n - a.n),
      by_tag: Object.keys(tagMap).map(k => ({ tag: k, n: tagMap[k] }))
        .sort((a, b) => b.n - a.n || (a.tag < b.tag ? -1 : 1)).slice(0, 30),
      by_kp: Object.keys(kpMap).map(k => ({ kp: k, n: kpMap[k] })).sort((a, b) => b.n - a.n).slice(0, 20),
      last7: arr.filter(m => {
        const d = parseTS(m.created_at);
        return d && (Date.now() - d.getTime()) < 7 * 864e5;
      }).length,
      due_count: duePool.length,
      next_due_at: future.length ? future[0].toISOString() : null,
      by_mastery: arr.reduce((o, m) => {
        const k = Math.max(0, Math.min(5, Number(m.mastery || 0)));
        o[k] = (o[k] || 0) + 1; return o;
      }, {}),
      /* 4 次以上并进 "3" 档，跟筛选档位「3 次以上」对齐（服务端同口径） */
      by_review_count: arr.reduce((o, m) => {
        const k = Math.max(0, Number(m.review_count || 0));
        const key = k >= 3 ? '3' : String(k);
        o[key] = (o[key] || 0) + 1; return o;
      }, { 0: 0, 1: 0, 2: 0, 3: 0 }),
      overdue_max: duePool.reduce((mx, m) => Math.max(mx, scheduleOf(m).overdue_days), 0),
      streak_days: streakDays,
      top_due: topDue,
      due_dates: dueDates,
      weak_kp: weakKp,
      week: {
        reviewed: wkReviews.length,
        correct: wkCorrect,
        accuracy: wkReviews.length ? Math.round(wkCorrect * 100 / wkReviews.length) : 0,
        new: arr.filter(m => {
          const d = parseTS(m.created_at);
          return d && d.getTime() >= cutoff;
        }).length,
        active_days: new Set(wkReviews.map(r => String(r.reviewed_at).slice(0, 10))).size
      },
      intervals: SPACED_INTERVALS,
      interval_labels: SPACED_LABELS
    };
  },

  /** 对外的统计入口：统一缓存到 S.stats，并刷新复习 tab 上的到期角标 */
  async stats() {
    const st = await this.statsRaw();
    S.stats = st;
    paintDueBadge(st.due_count || 0);
    return st;
  },

  async config() {
    if (this.mode === 'server') {
      const c = (await this._api('config')).config;
      this.cfg = Object.assign({ api_key: '' }, c, { api_key: '' , api_key_set: c.api_key_set });
      return c;
    }
    return Object.assign({ api_key_set: !!this.cfg.api_key }, this.cfg);
  },
  async saveConfig(patch) {
    if (this.mode === 'server') {
      const saved = (await this._api('config', { method: 'POST', body: JSON.stringify(patch) })).config;
      this.cfg = Object.assign(this.cfg, saved, { api_key: '' });   // 同步内存，保存后立刻生效（不用刷新页面）
      return saved;
    }
    this.cfg = Object.assign(this.cfg, patch);
    if (!patch.api_key && this.cfg.api_key) this.cfg.api_key = this.cfg.api_key;
    localStorage.setItem(LS_CFG, JSON.stringify(this.cfg));
    return Object.assign({ api_key_set: !!this.cfg.api_key }, this.cfg);
  },

  async exportAll() {
    if (this.mode === 'server') return (await this._api('export')).data;
    const db = this._ls();
    return { version: '1.0', exported_at: new Date().toISOString(), mistakes: db.mistakes, review_records: db.reviews };
  },
  async importAll(data) {
    if (this.mode === 'server') return (await this._api('import', { method: 'POST', body: JSON.stringify(data) })).imported;
    const db = this._ls();
    const arr = data.mistakes || [];
    arr.forEach(m => {
      const item = Object.assign({}, m);
      item.id = db.seq++;
      db.mistakes.push(item);
    });
    this._save(db);
    return arr.length;
  },

  /* ---- 模型调用：设置页可拉取账号可用模型，避免模型下线后写死报错 ---- */
  async models() {
    if (this.mode === 'server') return (await this._api('models')).items;
    const base = (this.cfg.base_url || '').replace(/\/$/, '');
    const r = await fetch(base + '/models', { headers: { Authorization: 'Bearer ' + (this.cfg.api_key || '') } });
    if (!r.ok) throw new Error('拉取失败 HTTP ' + r.status);
    const j = await r.json();
    return (j.data || []).map(m => m.id);
  }
};

/* ---------------- AI 调用 ---------------- */
function buildUserText(mode, subjectHint, extra, nImg, listeningText) {
  let t = '';
  if ((nImg || 1) > 1) {
    t = '用户一次发来了 ' + nImg + ' 张照片，它们是**同一道题的连续部分**（试卷跨页或题目被拍开），'
      + '请按照片出现顺序拼接成一道完整的题，再继续处理。';
  }
  if (mode === 'check') t += '请检查这张作业照片：先看清题目，判断学生的作答是对还是错，再给出讲解和错因分析。';
  else t += '请识别并讲解这张照片里的题目。如果图中没有学生的作答，is_correct 填 "unknown"。';
  t += listeningBlock(listeningText);
  if (subjectHint && subjectHint !== '全部') t += '\n学科提示：' + subjectHint;
  if (extra) t += '\n学生/家长补充说明：' + extra;
  return t;
}

/** 听力原文块：有音频就把转写文字带上，没有就明确要求跳过听力题 */
function listeningBlock(listeningText) {
  const text = (listeningText || '').trim();
  if (text) {
    return '\n\n【本次已提供听力音频，以下是音频转写出的原文】\n' + text
      + '\n（以上是听力录音的文字内容，请把它当作学生实际听到的音频，据此判断听力题的作答对错。）';
  }
  return '\n\n【注意：本次没有提供听力音频】照片里如果有需要听录音才能作答的听力题，'
    + '请一律把 is_correct 填 "unknown"、check_result 填 "未提供听力音频，未检查"，不要猜它对不对。';
}

/** 统一的模型对话入口：服务端转发 / 浏览器直连，两条路走同一份消息结构。
 *  effort：思考强度（'' = 不干预 / 'low' / 'minimal' / 'none'）。
 *  推理模型的思考过程也算进 max_tokens，页数一多就会把预算吃光、正文一个字都出不来，
 *  所以整卷识别时主动降到 low；服务端还会再兜一层（见 server.py 的 call_llm）。 */
async function llmChat(messages, maxTokens, effort) {
  /* 设置页的「Token 预算」是下限：用户调大后，任何调用都不低于这个值 */
  const userBudget = +((Store.cfg || {}).budget) > 0 ? +(Store.cfg.budget) : 0;
  const mt = Math.max(maxTokens || 2200, userBudget);
  const extra = effort ? { reasoning_effort: effort } : {};
  if (Store.mode === 'server') {
    return (await Store._api('llm', {
      method: 'POST',
      body: JSON.stringify(Object.assign({ messages: messages, max_tokens: mt }, extra))
    })).content;
  }
  if (!Store.cfg.api_key) throw new Error('请先到「设置」页填写 API Key（当前是浏览器本地模式）');
  const base = (Store.cfg.base_url || '').replace(/\/$/, '');
  const r = await fetch(base + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + Store.cfg.api_key },
    body: JSON.stringify(Object.assign({
      model: Store.cfg.model, messages: messages,
      temperature: 0.2, max_tokens: mt
    }, extra))
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.error && (j.error.message || j.error.code)) || ('接口返回 ' + r.status));
  const msg = j && j.choices && j.choices[0] && j.choices[0].message;
  const out = msg && typeof msg.content === 'string' ? msg.content.trim() : '';
  if (!out) throw new Error('模型只返回了思考过程、没给出答案（推理模型 token 预算不足或偶发空回复），请重试或调大预算');
  return out;
}

/* ---------------- 干净原题（抹掉手写、不带答案） ----------------
   复习时要把「原题」还给孩子：照片上有他上次写的答案，看照片等于抄答案；
   光靠识别的 question_text 也不保险（填空里可能混进了他填的内容）。
   所以这里再读一遍原图，让模型**只抄印刷体题干**，结果存进 clean_text。 */

/* 后端版本守卫 —— 干净原题要在库里多存两列（clean_text / clean_at），
   1.11.0 之前的服务端没有这两列。这种「前端已升级、黑色窗口还开着旧程序」的
   窗口期最坑：点提取，模型照跑（钱照花），结果写进库里却静默丢掉，还不报错。
   所以在最前面就拦住，一次模型请求都不发。 */
const CLEAN_NEED_VER = '1.11.0';
function verAtLeast(v, need) {
  const a = String(v || '').split('.').map(n => parseInt(n, 10) || 0);
  const b = String(need || '').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] || 0, y = b[i] || 0;
    if (x !== y) return x > y;
  }
  return true;                      // 完全相等也算够用
}
function cleanSupported() {
  if (Store.mode !== 'server') return true;        // 本地模式想存什么存什么，不受限
  return verAtLeast(Store.info && Store.info.version, CLEAN_NEED_VER);
}
/** 不支持就抛这个错；带 stopCleanBatch 标记，批量循环见标记立刻收工，
   免得对着 86 道题挨个失败刷屏。 */
function cleanUnsupportedError() {
  const v = (Store.info && Store.info.version) || '未知';
  const e = new Error('服务端还是旧版（' + v + '），没有存放「干净原题」的位置。'
    + '请关掉黑色窗口、重新双击「启动错题本.bat」后再试 —— 这次没有消耗模型费用。');
  e.stopCleanBatch = true;
  return e;
}

/** 把库里的原图读成 data URL —— 只有 data URL 才能再发给模型看。
 *  服务端模式下库里存的是 images/xxx.jpg 这种相对路径，本地模式下本来就是 data URL。 */
function imgToDataURL(url) {
  const u = String(url || '');
  if (!u) return Promise.reject(new Error('这道题没有原图'));
  if (u.indexOf('data:') === 0) return Promise.resolve(u);
  /* 库里的路径是 images/xxx.jpg 这种相对写法：补成根路径，
     这样不论页面挂在根目录还是子目录，都取得到同一张图 */
  const abs = /^(blob:|https?:|\/)/i.test(u) ? u : '/' + u.replace(/^\.?\//, '');
  return fetch(abs)
    .then(r => { if (!r.ok) throw new Error('原图读取失败（HTTP ' + r.status + '）'); return r.blob(); })
    .then(b => new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error('原图解码失败'));
      fr.readAsDataURL(b);
    }));
}

/* 超长图（跨页拼接 / 长截图）不能直接缩到 1600 长边 —— 实测 1200×6436 缩完只剩 298px 宽、
   1041×13442 只剩 124px 宽，字全糊了。所以先按纵向切段，每段单独缩，再一起发给模型。 */
const CLEAN_SLICE_SIDE = 1600;      // 每段的长边上限（与 AI_MAX_SIDE 同口径）
const CLEAN_SLICE_OVERLAP = 120;    // 段间重叠，免得正好从一行中间切断
const CLEAN_TALL_RATIO = 1.6;       // 高 > 宽×1.6 才算「超长」，普通竖拍照片不切

function imgInfoOf(dataUrl) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth || im.width, h: im.naturalHeight || im.height, img: im });
    im.onerror = () => rej(new Error('图片解码失败'));
    im.src = dataUrl;
  });
}

function drawDataURL(img, sy, sh, maxSide, quality) {
  const sc = Math.min(1, maxSide / Math.max(img.naturalWidth || 1, sh));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round((img.naturalWidth || 1) * sc));
  cv.height = Math.max(1, Math.round(sh * sc));
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, sy, img.naturalWidth, sh, 0, 0, cv.width, cv.height);
  try { return cv.toDataURL('image/jpeg', quality); } catch (e) { return ''; }
}

/** 一张原图 → 发给模型的 1 张或多张图。超长图纵切，其余按老口径缩到 AI_MAX_SIDE */
async function sliceForAI(url) {
  let info = null;
  try { info = await imgInfoOf(url); } catch (e) { return [url]; }   // 解码不了就原样交出去
  const w = info.w, h = info.h;
  if (!w || !h) return [url];
  if (!(h > CLEAN_SLICE_SIDE && h > w * CLEAN_TALL_RATIO)) return [await shrinkForAI(url)];
  const step = CLEAN_SLICE_SIDE - CLEAN_SLICE_OVERLAP;
  const parts = [];
  for (let top = 0; top < h; top += step) {
    const sh = Math.min(h, top + CLEAN_SLICE_SIDE) - top;
    const u = drawDataURL(info.img, top, sh, CLEAN_SLICE_SIDE, AI_QUALITY);
    if (u) parts.push(u);
    if (top + sh >= h) break;
  }
  return parts.length ? parts : [url];
}

/** 提取干净原题时发给模型的说明文字。
 *  ★ 整卷识别出来的题会共用同一张整页照片，不点名就会把整页内容抄进来 ——
 *    所以把这道题已有的识别文本当**定位线索**一起发过去，让它只抄这一道。 */
function cleanUserText(n, sliced, qtext) {
  const head = sliced && n > 1
    ? '下面这 ' + n + ' 张图是**同一份卷子的连续内容**：超长的那张已按纵向切成几段（段间有少量重叠），'
      + '也可能另有整页照片。请按顺序拼起来当作一整份卷子看。'
    : (n > 1
      ? '这 ' + n + ' 张照片是同一道题（或同一份卷子）按顺序排列的连续页面，请合起来抄。'
      : '请抄录这张照片上的题目。');
  const base = head + '严格按系统提示的要求：忽略所有手写笔迹、不要任何答案、题目要完整，篇章题整篇保留。';
  const q = String(qtext || '').trim();
  if (!q) return base;                 // 还没识别出过文字：只好让它抄整页
  return base + '\n【这次只要一道题】这张卷子上可能印着好几道题，**只抄下面这一道**，其余一律不要：\n'
    + '----\n' + q + '\n----\n'
    + '上面这段是之前识别出来的同一道题，请靠**题号 + 开头文字**认出是哪一道；以它为准，'
    + '把这道题在纸面上的完整原文抄出来（题干上的题头、说明、分栏标题如果属于它，也一起抄）。'
    + '如果它有跨页的部分，也要合起来抄全。不要输出任何说明性文字。';
}

/** 让模型把这道题的原图重抄一遍，返回干净题目文本（纯文本，不落库） */
async function extractClean(m) {
  if (!cleanSupported()) throw cleanUnsupportedError();   // 旧后端：先拦下来，不花钱
  const paths = splitImgs(m && m.question_image);
  if (!paths.length) throw new Error('这道题没有原图，没法提取干净原题');
  const imgs = [];
  let sliced = false;
  for (const p of paths) {                     // 串行读，别一下并发开 6 个请求
    const parts = await sliceForAI(await imgToDataURL(p));
    if (parts.length > 1) sliced = true;       // 超长图被切过
    imgs.push.apply(imgs, parts);
  }
  const content = imgs.map(u => ({ type: 'image_url', image_url: { url: u } }));
  content.push({ type: 'text', text: cleanUserText(imgs.length, sliced, m && m.question_text) });
  const messages = [
    { role: 'system', content: CLEAN_PROMPT },
    { role: 'user', content: content }
  ];
  const base = imgs.length <= 1 ? 4000
    : Math.min(8000 + (imgs.length - 2) * 3000, AI_BATCH_MAX_TOKENS);
  let txt = String(await llmChat(messages, base, batchEffort(imgs.length)) || '').trim();
  /* 模型偶尔还是套一层 ``` 代码块，剥掉；正文本身一个字都不动 */
  txt = txt.replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '').trim();
  return txt;
}

/** 提取并保存干净原题（m 是错题对象）；成功后就地更新 m，返回文本 */
async function saveClean(m) {
  const txt = await extractClean(m);
  if (!txt) throw new Error('模型没返回内容，请重试一次');
  const item = await Store.update(m.id, { clean_text: txt });
  m.clean_text = (item && item.clean_text) || txt;
  if (S.detail && Number(S.detail.id) === Number(m.id)) S.detail.clean_text = m.clean_text;
  return m.clean_text;
}

/** 这道题复习时该显示的题目文字：优先用干净原题，其次退回识别文本 */
function cleanOrText(m) {
  return String((m && m.clean_text) || '').trim() || String((m && m.question_text) || '');
}

/* ================= 错处定位：复习时只盯着错的地方看 =================
   一道阅读/对话大题底下一串小题，孩子只错了两三个，复习却要整篇重看一遍，
   时间全花在已经会了的题上。这里把「错的是哪几个小题」取出来，在题面和答案里
   把对应的小题加粗，还能一键把答对的小题收起来（篇章原文永远保留，不然没法做题）。

   ★ 数据来源有两层：
     ① 新数据：check_result 末尾带【错处：2(1),2(3),5】标记（2026-10-10 起要求模型写），最准；
     ② 老数据：没有标记，就从「第1、4、7小题计算错误」这类人话里猜。
   猜不出来就什么都不加粗 —— 宁可不标，也绝不能标错（标错比不标更耽误时间）。
*/
const WQ_TAIL_RE = /(?:^|\n)[ \t]*【错处[:：]([^】]*)】[ \t]*$/;
const RE_L1 = /^\s*(?:[（(]\s*[T F✓✗×√]{0,3}\s*[）)])?\s*(\d{1,2})\s*[\.、．](?!\d)/;   // 行首「2.」「2、」，也认判断题的「(  ) 1.」（0.45 这种小数不算）
const RE_L2 = /^\s*[（(]\s*(\d{1,2})\s*[）)]/;       // 行首「(3)」「（3）」
const RE_ANY2 = /[（(]\s*(\d{1,2})\s*[）)]/g;        // 行内任意位置的「(3)」

/** check_result → { text: 剥掉标记的结论, items: 错处数组 或 null（这份数据没有标记） } */
function splitWrongMark(raw) {
  const s = String(raw == null ? '' : raw);
  const m = s.match(WQ_TAIL_RE);
  if (!m) return { text: s.trim(), items: null };
  return { text: s.slice(0, m.index).trim(), items: parseWrongList(m[1]) };
}

/** 给用户看的检查结论：哪儿都不该出现那行机器标记 */
function checkText(raw) { return splitWrongMark(raw).text; }

/** 【错处：…】括号里的清单 → 数组；「无」→ []；「全部」→ ['*'] */
function parseWrongList(s) {
  const t = String(s || '').trim().replace(/[。．.]\s*$/, '');
  if (!t) return [];
  if (/^(无|没有|无错|全对|均对|均正确|全部正确)$/.test(t)) return [];
  if (/^(全部|全错|都错|整题|所有|所有小题)$/.test(t)) return ['*'];
  return t.split(/[,，、;；\s]+/).map(x => x.trim()).filter(Boolean).slice(0, 30);
}

/** 老数据兜底：从人话里猜出错的小题号（宁可少猜，不能猜错） */
function guessWrongItems(raw) {
  const t = String(raw || '');
  if (!t) return [];
  if (/^(未提供听力音频|未检查)/.test(t)) return [];
  if (/(全都|全部|整题|整道题|所有小题|每一小题|几个小题都)[^。；;！？]{0,8}错|全错|都做错/.test(t)) return ['*'];
  const out = [];
  let m;
  /* ①「第1小题(2)(3)空」→ 1(2)、1(3) */
  const re1 = /第\s*(\d{1,2})\s*小题\s*((?:[（(]\s*\d{1,2}\s*[）)])+)/g;
  while ((m = re1.exec(t))) (m[2].match(/\d{1,2}/g) || []).forEach(k => out.push(m[1] + '(' + k + ')'));
  /* ②「(1)小题」「（2）空」→ (1)、(2) */
  const re2 = /[（(]\s*(\d{1,2})\s*[）)]\s*(?:小?题|空|问)/g;
  while ((m = re2.exec(t))) out.push('(' + m[1] + ')');
  /* ③「第1、4、7小题计算错误」→ 1、4、7（后面紧跟「正确/对」的那一组不算） */
  const re3 = /第\s*((?:\d{1,2}\s*[、,，和及]?\s*)+)\s*(?:小?题|空|问)/g;
  while ((m = re3.exec(t))) {
    const tail = t.slice(re3.lastIndex, re3.lastIndex + 8);
    if (/^(都|均|全)?\s*(正确|对|无误|没错|没问题|做对)/.test(tail)) continue;
    (m[1].match(/\d{1,2}/g) || []).forEach(n => out.push(n));
  }
  if (/最后\s*(一)?\s*(小?题|空|问|个)/.test(t)) out.push('#last');
  const seen = {};
  return out.filter(x => (seen[x] ? false : (seen[x] = 1))).slice(0, 20);
}

/** 这道题错在哪儿：优先用标记；没有标记就从结论里猜 */
function wrongItemsOf(m) {
  const r = splitWrongMark(m && m.check_result);
  return { items: (r.items === null ? guessWrongItems(r.text) : r.items), exact: r.items !== null };
}

/** 一个编号是否命中错处清单（大题编号命中时，它底下的小题也算） */
function segHit(key, list) {
  if (!key) return false;
  if (list.indexOf(key) >= 0) return true;
  const p = key.indexOf('(');
  if (p > 0 && list.indexOf(key.slice(0, p)) >= 0) return true;
  return list.some(x => x !== '*' && x.indexOf(key + '(') === 0);
}

/** 把题面按「小题单元」切开：一级 2. / 二级 (3)；没有小题号的行归到当前单元 */
function scanUnits(text) {
  const units = [];
  let b1 = '', b2 = '', cur = null;
  String(text || '').split('\n').forEach(ln => {
    const m1 = ln.match(RE_L1);
    const m2 = m1 ? null : ln.match(RE_L2);
    if (m1 || m2) {
      if (m1) { b1 = m1[1]; b2 = ''; } else { b2 = m2[1]; }
      cur = {
        b1: b1, b2: b2, lines: [],
        key: b1 ? (b2 ? b1 + '(' + b2 + ')' : b1) : (b2 ? '(' + b2 + ')' : '')
      };
      units.push(cur);
    } else if (!cur) {
      cur = { b1: '', b2: '', key: '', lines: [] };
      units.push(cur);
    }
    cur.lines.push(ln);
  });
  return units;
}

/** 某一行是否命中错处（表格题「一格一行」时，靠行内出现的 (3) 命中） */
function wqLineHit(u, ln, list, all, hasL2) {
  if (all) return !!u.b1;
  if (u.key && list.indexOf(u.key) >= 0) return true;
  /* ★ 只有「大题题干」才因为底下某个小题错了而一起加粗。
     没有小题号的大题（例如一整块口算/表格）不能整块点亮 —— 否则会把答对的行也加粗。 */
  if (u.b1 && !u.b2 && hasL2[u.b1]
      && list.some(x => x !== '*' && x.indexOf(u.b1 + '(') === 0)) return true;
  if (u.b1 && u.b2 && list.indexOf(u.b1) >= 0) return true;   // 整个大题都错
  if (u.b1) {
    RE_ANY2.lastIndex = 0;
    let m;
    while ((m = RE_ANY2.exec(ln))) {
      if (list.indexOf(u.b1 + '(' + m[1] + ')') >= 0) return true;
    }
  }
  return false;
}

/** 题面：命中错处的小题加粗；返回 { html, hits, hideable } */
function renderQMarked(src, list, all) {
  const units = scanUnits(src);
  if (!units.length) return { html: esc(src), hits: 0, hideable: false };
  const hasL2 = {};
  units.forEach(u => { if (u.b1 && u.b2) hasL2[u.b1] = true; });

  let hits = 0;
  units.forEach(u => {
    u.lines = u.lines.map(t => ({ t: t, hit: wqLineHit(u, t, list, all, hasL2) }));
    hits += u.lines.filter(x => x.hit).length;
  });
  if (!hits) return { html: esc(src), hits: 0, hideable: false };

  /* 「只看错的部分」要收起哪些：没命中、且底下也没有命中的小题 ——
     篇章原文/标题永远留着；大题的题干在小题还有命中时也留着（不然错的题也看不懂）。 */
  let hideable = false;
  units.forEach(u => {
    if (!u.b1 && !u.b2) { u.hid = false; return; }
    const anyHit = u.lines.some(x => x.hit);
    let childHit = false;
    if (u.b1 && !u.b2 && hasL2[u.b1]) {
      childHit = units.some(v => v.b1 === u.b1 && v.b2 && v.lines.some(x => x.hit));
    }
    u.hid = !anyHit && !childHit;
    if (u.hid) hideable = true;
  });

  /* 每个单元自己带结尾换行，收起该单元时换行跟着走，剩下的行不会挤到一起 */
  let out = '', n = 0;
  const total = units.reduce((s, u) => s + u.lines.length, 0);
  units.forEach(u => {
    out += '<span class="squnit' + (u.hid ? ' hid' : '') + '">';
    u.lines.forEach(x => {
      n++;
      out += x.hit ? '<span class="wq">' + esc(x.t) + '</span>' : esc(x.t);
      if (n < total) out += '\n';
    });
    out += '</span>';
  });
  return { html: out, hits: hits, hideable: hideable };
}

/** 按正则把文本切成「项」；切不出两项就返回 [] */
function cutBy(src, re, keyFn) {
  const marks = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(src))) {
    /* 行内编号前面那个空格/分隔符归上一项，别吞进这一项的开头 ——
       否则段首多一个空格，判断和显示都别扭；这样切完拼回去和原文一字不差 */
    const lead = (m[0].match(/^[\s\u3000；;，,]*/) || [''])[0].length;
    marks.push({ key: keyFn(m), i: m.index + lead });
  }
  if (marks.length < 2) return [];
  const segs = [];
  if (marks[0].i > 0) segs.push({ key: '', text: src.slice(0, marks[0].i) });
  marks.forEach((mk, k) => {
    const end = (k + 1 < marks.length) ? marks[k + 1].i : src.length;
    segs.push({ key: mk.key, text: src.slice(mk.i, end) });
  });
  return segs;
}

/** 答案切项：先认「1. 2. 3.」，再认「(1)(2)」，都没有就按逗号/分号切 */
function splitAnsSegs(src) {
  let segs = cutBy(src, /(?:^|[\s\u3000；;，,])(\d{1,2})\s*[\.、．](?!\d)/g, m => m[1]);
  if (segs.length < 2) segs = cutBy(src, /[（(]\s*(\d{1,2})\s*[）)]/g, m => '(' + m[1] + ')');
  if (segs.length >= 2) {
    /* 一级项里还带 (1)(2)(3) 的再切成子项 —— 这样「错的是 2(1)」能精确到子项 */
    const out = [];
    segs.forEach(s => {
      if (!s.key) { out.push(s); return; }
      const subs = cutBy(s.text, /[（(]\s*(\d{1,2})\s*[）)]/g, m => m[1]);
      if (subs.length < 2) { out.push(s); return; }
      out.push({ key: s.key, text: subs[0].text });
      subs.slice(1).forEach(sub => out.push({ key: s.key + '(' + sub.key + ')', text: sub.text }));
    });
    return out.filter(s => s.text.trim() !== '');
  }
  let idx = 1, buf = '';
  const parts = [];
  String(src).split(/([，,；;])/).forEach(p => {
    if (/^[，,；;]$/.test(p)) { parts.push({ key: String(idx++), text: buf + p }); buf = ''; }
    else buf += p;
  });
  if (buf.trim() !== '') parts.push({ key: String(idx), text: buf });
  return parts.length >= 2 ? parts : [];
}

/** 答案：命中错处的答案项加粗；返回 { html, hits, hideable } */
function renderAMarked(src, list, all) {
  const segs = splitAnsSegs(src);
  if (segs.length < 2) return { html: fmtMD(src), hits: 0, hideable: false };
  const lastKey = segs[segs.length - 1].key;
  let hits = 0;
  segs.forEach(s => {
    s.hit = all ? true : (segHit(s.key, list) || (list.indexOf('#last') >= 0 && s.key === lastKey));
    if (s.hit) hits++;
  });
  if (!hits) return { html: fmtMD(src), hits: 0, hideable: false };
  let out = '', hideable = false;
  segs.forEach(s => {
    const hid = !s.hit;
    if (hid) hideable = true;
    /* ★ 只有命中的项才套 wq —— 不然「显示全部」时整条答案全是粗体，等于没标 */
    out += '<span class="squnit' + (hid ? ' hid' : '') + '">'
      + (s.hit ? '<span class="wq">' + fmtMD(s.text) + '</span>' : fmtMD(s.text))
      + '</span>';
  });
  return { html: out, hits: hits, hideable: hideable };
}

/**
 * 渲染题面/答案：命中的小题加粗。
 * @param {string} text  原文
 * @param {Array}  items wrongItemsOf(m).items
 * @param {string} kind  'q' 题面（保留换行） | 'a' 答案（常常是一整行）
 * @returns {{html:string, hits:number, hideable:boolean}}
 */
function renderWrongMarked(text, items, kind) {
  const src = String(text == null ? '' : text);
  const list = (Array.isArray(items) ? items : []).filter(Boolean);
  if (!src || !list.length) {
    return { html: (kind === 'a' ? fmtMD(src) : esc(src)), hits: 0, hideable: false };
  }
  const all = list.indexOf('*') >= 0;
  return kind === 'a' ? renderAMarked(src, list, all) : renderQMarked(src, list, all);
}


/** 单题识别：imageUrls 是数组——同一道题跨页/整卷时可以传最多 6 张，按顺序拼接 */
async function aiAnalyze(imageUrls, mode, subjectHint, extra, listeningText) {
  /* 库里存的是高清图，发给模型前统一缩到 AI_MAX_SIDE：
     识别质量与 token 花费跟之前一致，不会因为「存得更清」而变贵 */
  const raw = Array.isArray(imageUrls) ? imageUrls : [imageUrls];
  const imgs = await Promise.all(raw.map(u => shrinkForAI(u)));
  const content = imgs.map(u => ({ type: 'image_url', image_url: { url: u } }));
  content.push({ type: 'text', text: buildUserText(mode, subjectHint, extra, imgs.length, listeningText) });
  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    { role: 'user', content: content }
  ];
  /* 推理模型的思考也耗预算，且随图数明显增长（实测 1 图约 340、2 图约 3000）——
     预算按图数递增：单图 10000（除讲解外还要多写一份干净原题 clean_text）、
     多图 10000 起步，封顶 AI_BATCH_MAX_TOKENS，避免整卷 6 页被思考过程吃光。
     带了听力原文时再多给一点（原文本身要占 prompt，且听力题判断更费思考）。 */
  const base = imgs.length <= 1 ? 10000 : Math.min(10000 + (imgs.length - 2) * 3000, AI_BATCH_MAX_TOKENS);
  const budget = (listeningText || '').trim() ? Math.min(base + 3000, AI_BATCH_MAX_TOKENS + 3000) : base;
  return parseJSONLoose(await llmChat(messages, budget, batchEffort(imgs.length)));
}

/* ---------------- AI：整页/整卷多题 ---------------- */
function buildBatchText(subjectHint, extra, nImg, listeningText) {
  let t = '';
  if ((nImg || 1) > 1) {
    t = '用户一次发来了 ' + nImg + ' 张照片，它们是**同一份作业/试卷按顺序排列的连续 ' + nImg + ' 页**（可能正好是整卷的正反面）。'
      + '请按页顺序把每一页的题目都识别出来，从第 1 页到最后一页逐题列全，不要只识别第一页。\n'
      + '如果一道题跨页（题干或作答被切开），把它拼成一道完整的题再列。\n';
  }
  t += '请把' + ((nImg || 1) > 1 ? '这些' : '这张') + '作业照片上的题目逐题识别出来：做对的、做错的、空着没做的都要列。'
    + '逐题给出正确答案，并判断学生的作答对错；做错的要说清错在哪。';
  t += listeningBlock(listeningText);
  if ((nImg || 1) > 1) t += '\n题目编号请全局连续（不要每页都从 1 开始）。'
    + '\nsubject（学科）和 chapter（章节）按页数最多的那一科/那一章填写，不要因为个别页不同就填「未分类」。';
  if (subjectHint && subjectHint !== '全部') t += '\n学科提示：' + subjectHint;
  if (extra) t += '\n学生/家长补充说明：' + extra;
  return t;
}

function normalizeBatch(a) {
  const raw = Array.isArray(a.questions) ? a.questions : (a.question_text ? [a] : []);
  const items = [];
  raw.forEach(q => {
    if (!q || typeof q !== 'object') return;
    const text = String(q.question_text || '').trim();
    if (!text) return;
    const ic = ['right', 'wrong', 'partial', 'unknown'].indexOf(q.is_correct) >= 0 ? q.is_correct : 'unknown';
    const kps = Array.isArray(q.knowledge_points)
      ? q.knowledge_points.filter(Boolean).map(String)
      : String(q.knowledge_points || '').split(/[,，、;；/|]+/).filter(Boolean);
    items.push({
      index: items.length + 1,
      question_text: text,
      /* 干净原题：同一次检查里顺手整理出来的「无手写、无答案、篇章整篇」那一份。
         模型偶尔不给（老模型 / 偶发漏字段），那就留空 —— 保存照常，
         之后还能在结果页、详情页、设置页或复习页任一入口补上。 */
      clean_text: String(q.clean_text || '').trim(),
      student_answer: String(q.student_answer || '').trim(),
      correct_answer: String(q.correct_answer || '').trim(),
      is_correct: ic,
      check_result: String(q.check_result || '').trim(),
      knowledge_points: kps,
      /* 做对的题不给错因标签；其余的把模型给的标签归一化到清单里的标准词 */
      reason_tags: ic === 'right' ? [] : normalizeTags(q.reason_tags),
      explanation: String(q.explanation || '').trim(),
      similar_question: String(q.similar_question || '').trim(),
      expBusy: false, open: false,
      /* 默认勾选：做错和半对的先勾上，做对的/没作答的留给用户自己决定 */
      save: ic === 'wrong' || ic === 'partial'
    });
  });
  if (!items.length) throw new Error('没从照片里认出题目，把整页拍清楚些再试一次');
  const sb = normalizeSubject(a.subject);
  const declared = Math.max(0, parseInt(a.question_count, 10) || 0);
  return {
    subject: sb,
    source_type: SOURCES.indexOf(a.source_type) >= 0 ? a.source_type : '作业',
    chapter: String(a.chapter || '').trim() === '未分类' ? '' : String(a.chapter || '').trim(),
    items: items,
    declared: declared,
    missing: Math.max(0, declared - items.length),
    recovered: !!a._recovered
  };
}

/** 整页/整卷多题识别：imageDataUrls 可以是单张，也可以是同一份卷子的连续多页（最多 6 张） */
async function aiAnalyzeBatch(imageDataUrls, subjectHint, extra, listeningText) {
  const raw = Array.isArray(imageDataUrls) ? imageDataUrls.filter(Boolean) : [imageDataUrls];
  const imgs = await Promise.all(raw.map(u => shrinkForAI(u)));
  const content = imgs.map(u => ({ type: 'image_url', image_url: { url: u } }));
  content.push({ type: 'text', text: buildBatchText(subjectHint, extra, imgs.length, listeningText) });
  const messages = [
    { role: 'system', content: BATCH_PROMPT },
    { role: 'user', content: content }
  ];
  /* 一页就可能十几道题，输出量大；每题还要多写一份「干净原题」（clean_text），
     比只出题目文字时明显更长，所以单页预算从 10000 提到 15000。
     多页时**推理模型的思考 token 还会随图数暴涨**，而且思考也占 max_tokens ——
     实测同一批 6 页整卷：
       · 预算 24000 + 完整思考 → 思考吃掉 23999，正文 0 字符，直接失败（老孙遇到的就是这个）
       · 预算 24000 + 降档思考 → 正文 1.4 万字符，15 秒出结果
     所以按图数递增给预算、并且一律降思考强度（见 batchEffort 的注释）。
     单页从 15000 提到 22000：每题都要多写一份「干净原题」，输出明显更长。
     封顶仍是 AI_BATCH_MAX_TOKENS 32000 —— 这是实测模型吃得下的上限，不再往上抬。 */
  const base = imgs.length <= 1 ? 22000 : Math.min(22000 + (imgs.length - 1) * 6000, AI_BATCH_MAX_TOKENS);
  const budget = (listeningText || '').trim() ? Math.min(base + 3000, AI_BATCH_MAX_TOKENS + 3000) : base;
  return normalizeBatch(parseQuestionsLoose(await llmChat(messages, budget, batchEffort(imgs.length))));
}

/** 按需讲解：只发题目文本，不再重传图片 */
async function aiExplainOne(item, subject) {
  const lines = ['【科目】' + (subject || '未分类')];
  lines.push('【题目】' + item.question_text);
  if (item.student_answer) lines.push('【学生写的答案】' + item.student_answer);
  else lines.push('【学生写的答案】这道题学生没有作答');
  if (item.correct_answer) lines.push('【参考答案】' + item.correct_answer);
  lines.push('【判定】' + ((VERDICT[item.is_correct] || VERDICT.unknown).label));
  const messages = [
    { role: 'system', content: EXPLAIN_PROMPT },
    { role: 'user', content: lines.join('\n') }
  ];
  /* 按需讲解是纯文本问答，推理模型思考 + 讲解给到 3000 */
  return parseJSONLoose(await llmChat(messages, 3000));
}

/* ---------------- 全局状态与路由 ---------------- */
const S = {
  view: 'list',
  param: null,          // 当前页面的参数（如详情页的错题 id），返回时用它还原
  stack: [],
  listFilter: {
    subject: '全部', q: '', group: 'none', onlyLow: false,
    tags: [], tagOpen: false,
    rc: '', rcMin: '', rcMax: '', rcOpen: false      // 复习次数（练过几次）筛选
  },
  cap: null,
  batch: null,
  draft: undefined,     // 上次没保存完的识别结果：undefined=还没查过，null=查过没有
  detail: null,
  detailTagOpen: false,     // 详情页的标签选择器是否展开
  rev: null,
  stats: null,
  settings: null
};

/* ---------------- 外观主题（跟随系统 / 浅色 / 深色） ----------------
   head 里那段防闪脚本负责「打开时定好深浅」；这里负责「切设置、系统变深浅时跟着变」。
   只切 html 的 data-theme 属性，全部配色都靠 CSS 变量自动换。 */
let themeMode = 'auto';
try { themeMode = localStorage.getItem('ctb_theme') || 'auto'; } catch (e) {}

function applyTheme(mode) {
  const dark = mode === 'dark' || (mode === 'auto' && window.matchMedia
    && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  /* 状态栏 / 地址栏颜色跟着走（PWA 加到主屏幕后可见） */
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#171e29' : '#2f6bed');
}
function setThemeMode(mode) {
  themeMode = mode;
  try { localStorage.setItem('ctb_theme', mode); } catch (e) {}
  applyTheme(mode);
}
applyTheme(themeMode);
/* 跟随系统模式下，系统切深浅色时实时跟（监听器不支持就退化为启动时定一次） */
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (themeMode === 'auto') applyTheme('auto');
  });
} catch (e) {}

function setTitle(t, sub) {
  $('#tbTitle').innerHTML = esc(t) + (sub ? '<span class="tb-sub">' + esc(sub) + '</span>' : '');
}
function go(view, param, replace) {
  speakStop();   // 离开当前页时把还在播的「读题」停掉
  /* 离开识别结果页之前先把草稿落盘（发出去就走，不等回来）：
     用户误触返回键 / 点了别的页签 / 侧滑退出时，辛苦识别几十秒的结果不会白费 */
  if (S.view === 'batch' && view !== 'batch') Draft.push(true);
  if (!replace && S.view && S.view !== view) S.stack.push({ view: S.view, param: S.param || null });
  S.param = param || null;      // 记住本页参数：返回上一页时要原样还原（否则「同类题→原题详情」会丢题）
  // 「回到首页」类的跳转（replace + list）就是回到干净起点：清空返回栈。
  // 否则删掉一道题 / 放弃录入再回到列表后，按返回还会退回到那个已经不存在的页面。
  if (replace && view === 'list') S.stack.length = 0;
  if (!replace) { try { history.pushState({ v: view }, ''); } catch (e) {} }   // 手机上按系统返回键/侧滑也能回上一页
  if (view === 'list') { S.view = 'list'; renderList(); }
  else if (view === 'capture') { S.view = 'capture'; openCapture(param); }
  else if (view === 'batch') { S.view = 'batch'; renderBatch(); }
  else if (view === 'detail') { S.view = 'detail'; renderDetail(param); }
  else if (view === 'review') { S.view = 'review'; renderReview(); }
  else if (view === 'settings') { S.view = 'settings'; renderSettings(); }
  else if (view === 'stats') { S.view = 'stats'; renderStats(); }
  else if (view === 'drill') { S.view = 'drill'; renderDrill(param && param.id, param && param.byReason); }
  window.scrollTo(0, 0);
  syncTab();
  updateBackBar();
  /* 页面切换的轻量过渡：淡入 + 轻微上移，160ms，纯装饰。
     动画结束自动归位（transform:none），不会影响原图窗口「缩放不动下方内容」的行为。 */
  const mainEl = document.getElementById('main');
  if (mainEl) { mainEl.classList.remove('pagein'); void mainEl.offsetWidth; mainEl.classList.add('pagein'); }
}

/** 顶栏按钮随页面切换：非首页才显示「←」；当前页对应的入口不再重复出现 */
function updateBackBar() {
  const bk = document.getElementById('btnBack');
  if (bk) bk.classList.toggle('hidden', S.view === 'list');
  const st = document.getElementById('btnStats');
  if (st) st.classList.toggle('hidden', S.view === 'stats');
  const se = document.getElementById('btnSettings');
  if (se) se.classList.toggle('hidden', S.view === 'settings');
}

/** 返回上一页；没有上一页就回首页 */
function goBack() {
  let p = S.stack.pop();
  // 栈里可能残留「与当前同一页」的记录（保存后 replace 跳转等情况），跳过它们
  while (p && p.view === S.view && S.stack.length) p = S.stack.pop();
  if (p && p.view !== S.view) go(p.view, p.param, true);
  else go('list', null, true);
}

/* ---------------- 未保存的识别结果（草稿）----------------
   为什么要有它：AI 识别一次要几十秒，结果页里还可能有已经展开过的讲解、改过的勾选。
   此时只要误触一下返回键 / 点个别的页签 / 刷新，之前全白费，只能重拍重识别。
   现在识别一完成就自动暂存，离开页面也能从首页横幅一键找回；
   点「存入错题本」后自动清除（原图同时转正成错题原图，不重复占空间）。 */
const Draft = {
  _t: null,               // 防抖计时器

  /** 从当前识别结果抽一份可序列化的快照；没结果 / 还在识别中就返回 null */
  snapshot() {
    const b = S.batch;
    if (!b || b.busy || b.error || !b.items || !b.items.length) return null;
    const pages = (b.photos && b.photos.length) ? b.photos : (b.image ? [b.image] : []);
    return {
      subject: b.subject, chapter: b.chapter, source_type: b.source_type,
      extra: b.extra || '', listeningText: b.listeningText || '', asrNote: b.asrNote || '',
      declared: b.declared || 0, missing: b.missing || 0, recovered: !!b.recovered,
      photos: pages, audio: b.audio || '',
      items: b.items.map(x => ({
        index: Number(x.index) || 0,       // 题号（卡片左上角那个）
        question_text: x.question_text || '',
        /* 干净原题也要进草稿：识别一次就要几十秒，找回来时它必须还在 */
        clean_text: x.clean_text || '',
        student_answer: x.student_answer || '',
        correct_answer: x.correct_answer || '', explanation: x.explanation || '',
        similar_question: x.similar_question || '', check_result: x.check_result || '',
        is_correct: x.is_correct || 'unknown', reason_tags: x.reason_tags || [],
        knowledge_points: x.knowledge_points || [], save: !!x.save, open: !!x.open
      }))
    };
  },

  /** 存草稿。now=true 立刻存（刚识别完 / 正要离开页面时用）；否则 1.2 秒防抖，省得每次勾选都写盘 */
  push(now) {
    if (this._t) { clearTimeout(this._t); this._t = null; }
    if (now) { this._flush(); return; }
    this._t = setTimeout(() => { this._t = null; this._flush(); }, 1200);
  },

  _flush() {
    const snap = this.snapshot();
    if (!snap) return null;
    const p = Store.saveDraft(snap).then(d => {
      if (!d) return;
      S.draft = d;
      this._adopt(d);
    }).catch(() => {});   // 暂存失败不打扰用户：主流程（看结果、存错题）不受影响
    this._p = p;          // 留个句柄，测试与「离开前确保存完」都能等它
    return p;
  },

  /** 页面马上要走了（切后台 / 被系统回收 / 关闭）时的最后一存。
      这种时刻普通 fetch 会被浏览器直接掐掉，必须用 sendBeacon 才发得出去。 */
  beacon() {
    const snap = this.snapshot();
    if (!snap) return;
    if (Store.mode !== 'server' || !navigator.sendBeacon) { this._flush(); return; }
    try {
      navigator.sendBeacon('./api/draft',
        new Blob([JSON.stringify(snap)], { type: 'application/json' }));
    } catch (e) { this._flush(); }
  },

  /** 第一次暂存成功后，服务端已经拿到原图了 —— 把内存里的 data URL 换成路径。
      这样后面的防抖暂存不会再反复上传几 MB 的 base64，保存错题时也用的是同一张图。 */
  _adopt(d) {
    const b = S.batch;
    if (!b || !d || !d.photos || !d.photos.length) return;
    const cur = (b.photos && b.photos.length) ? b.photos : (b.image ? [b.image] : []);
    if (!cur.length) return;
    // 只在「内存里还是 data URL」时才替换，避免把用户刚重拍的新照片盖掉
    if (!cur.every(u => String(u).indexOf('data:') === 0)) return;
    b.photos = d.photos.slice();
    b.image = b.photos[0] || '';
    if (b.audio && String(b.audio).indexOf('data:') === 0 && d.audio) b.audio = d.audio;
  },

  /** 把草稿恢复到识别结果页 */
  restore(d) {
    d = d || S.draft;
    if (!d || !d.items || !d.items.length) { toast('这份存档里没有题目'); return; }
    const photos = (d.photos_ok && d.photos_ok.length) ? d.photos_ok : (d.photos || []);
    /* 题号兜底：老草稿没有 index 字段时按顺序补上，免得卡片左上角显示 0 / undefined */
    (d.items || []).forEach((x, i) => { if (!x.index) x.index = i + 1; });
    S.batch = {
      image: photos[0] || '', photos: photos, busy: false, filter: 'all',
      subject: d.subject || '未分类', source_type: d.source_type || '作业',
      chapter: d.chapter || '', items: d.items, error: '', saving: false,
      recovered: !!d.recovered, declared: d.declared || 0, missing: d.missing || 0,
      audio: d.audio || null, audioName: d.audio ? '已存听力音频' : '', audioSize: 0,
      audioDuration: 0, listeningText: d.listeningText || '', asrNote: d.asrNote || '',
      extra: d.extra || ''
    };
    go('batch', null, true);
    const lost = (d.photos_lost || (d.missing_photos || []).length || 0);
    toast('已找回上次的识别结果（' + d.items.length + ' 题）'
      + (lost ? '；' + lost + ' 张原图没存下来，题目文字还在，可重新拍一张' : ''), 3800);
  },

  /** 用户主动「放弃」：草稿和它带来的原图一起清掉（已被错题引用的图服务端会保护，不会被误删）
      keepPage=true 时只清掉+重画首页横幅，不跳页 */
  async discard(keepPage) {
    if (!confirm('放弃这份识别结果？题目和这次拍的原图都会被删掉，不能恢复。')) return;
    try { await Store.clearDraft(true); } catch (e) {}
    S.draft = null;
    S.batch = null;
    toast('已放弃，可以重新拍一张');
    if (keepPage) { paintDraftBanner(); return; }
    go('list', null, true);
  },

  /** 存入错题本成功后调用：只清草稿，**不删图** —— 那些图此刻已经是错题原图了 */
  async done() {
    if (this._t) { clearTimeout(this._t); this._t = null; }
    S.draft = null;
    try { await Store.clearDraft(false); } catch (e) {}
  }
};

function syncTab() {
  $$('#tabbar button').forEach(b => {
    const n = b.dataset.nav;
    b.classList.toggle('on', S.view === n
      || (n === 'list' && (S.view === 'detail' || S.view === 'settings' || S.view === 'stats' || S.view === 'drill'))
      || (n === 'capture' && S.view === 'batch'));
  });
  syncWide();
}

/* 哪些页在平板/大屏上要放宽列宽 —— 只有「要看清照片」的两页。
   其余页面（列表、录入、统计、设置）保持 560px，阅读行长和原来一样。
   实际放大多少由 CSS 的 #main.wide 决定，这里只负责打标记。 */
function syncWide() {
  const wide = (S.view === 'detail' || S.view === 'review');
  const m = document.getElementById('main');
  if (m) m.classList.toggle('wide', wide);

/** 复习 tab 上的「今天到期 N 题」小红点 */

/** 首页顶部的到期横幅：有该练的题才出现，没有就完全不占位置 */
/* ---------------- 首页看板：今天复习什么、学得怎么样 ----------------
   替代原来只有一句「今天该复习 N 题」的横幅。数据全部来自 S.stats
   （服务端 stats 一次给齐：连续天数 / 优先补练 top3 / 到期日分布 / 各科掌握数）。
   情绪化设计：按时段问好，鼓励语每天轮换一句；最久的题给个「先去见见它」的说法，
   不用催促的口吻。 */
const LS_DASH_FOLD = 'ctb_dash_fold';
const ENC_POOL = [
  '把每一道错题，变成下一次的底气',
  '错题弄懂一道，就赢一道',
  '慢慢来，比较快——弄懂比刷过更重要',
  '每天清一点，考试稳一点',
  '坚持复习的你，真的很了不起',
  '不怕做错，就怕错过弄懂的机会'
];
function encLine() { return ENC_POOL[Math.floor(Date.now() / 864e5) % ENC_POOL.length]; }
function greetWord() {
  const h = new Date().getHours();
  if (h < 5) return '夜深了';
  if (h < 9) return '早上好';
  if (h < 12) return '上午好';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  return '晚上好';
}
function dashHero(st) {
  const due = Number(st.due_count) || 0;
  const od = Number(st.overdue_max) || 0;
  if (!Number(st.total)) return { t: greetWord() + '！错题本准备好了', s: '拍下第一道错题，AI 帮你检查讲解再归档 📷', tone: 'calm' };
  if (due > 0) {
    const sub = od >= 3 ? '最久的一道等了 ' + od + ' 天，先去见见它吧'
      : (od >= 1 ? '有几题过期了，趁热补一补' : '按遗忘曲线，今天该练这些');
    return { t: greetWord() + '！今天有 ' + due + ' 题要复习', s: sub, tone: od >= 3 ? 'urgent' : '' };
  }
  return { t: greetWord() + '！今天没有到期的题', s: '都练完了 ✓ ' + encLine(), tone: 'calm' };
}
function dashCard(v, k, pre) {
  return '<div class="c"><div class="v">' + (pre || '') + v + '</div><div class="k">' + k + '</div></div>';
}
function dashboardHTML() {
  const st = S.stats;
  if (!st) return '';                       // stats 还在路上：回来后 paintDashboard 会补上
  const due = Number(st.due_count) || 0, total = Number(st.total) || 0;
  const mastered = Number(st.mastered) || 0, streak = Number(st.streak_days) || 0;
  const hero = dashHero(st);
  const folded = localStorage.getItem(LS_DASH_FOLD) === '1';

  /* 折叠态：一行横条，核心数字还在，点一下展开 */
  if (folded) {
    return '<div class="dash"><div class="dash-foldrow" id="dashExpand" role="button">'
      + '<span class="grow ellipsis"><b>' + esc(hero.t) + '</b></span>'
      + (total ? '<span class="dash-mini">' + (due ? '待复习 <b>' + due + '</b> 题' : '今天无到期 ✓') + '</span>' : '')
      + (streak >= 2 ? '<span class="dash-mini">🔥' + streak + ' 天</span>' : '')
      + '<span class="faint tiny">展开 ▼</span></div></div>';
  }

  let h = '<div class="dash">';

  /* hero 横贯整行（宽屏也是一行），下面的两栏从四卡开始 */
  h += '<div class="dash-hero ' + hero.tone + '" id="dashHero">'
    + '<div class="grow"><div class="t">' + esc(hero.t) + '</div><div class="s">' + esc(hero.s) + '</div></div>'
    + (total ? '<button class="btn" id="dashGo">去复习</button>' : '')
    + '</div>';

  /* hero 之下的两栏：.dash-body 左右分栏（宽屏），手机端透明还原单列 */
  h += '<div class="dash-body"><div class="dash-main">';

  /* 四张数字卡空库也照常显示（数值为 0）——分享版/新装首次打开不缺块 */
  h += '<div class="dash-cards">'
    + dashCard(total, '错题总数') + dashCard(due, '今天待复习')
    + dashCard(mastered, '已掌握') + dashCard(streak, '连续天数', streak >= 2 ? '🔥' : '')
    + '</div>';

  /* 各科进度：服务端返回全部学科（含 0 题的），空库也是四科 0%，照常可点 */
  const subs = (st.by_subject || []);
  if (subs.length) {
    h += '<div class="dash-sec"><div class="dash-h">各科进度 <span class="tiny faint">点学科看该科错题</span></div>'
      + '<div class="dash-subjgrid">'
      + subs.map(s => {
        const n = Number(s.n) || 0, m = Number(s.mastered) || 0;
        const pct = n ? Math.round(m * 100 / n) : 0;
        return '<div class="dash-scard" data-dsub="' + esc(s.subject) + '" title="查看' + esc(s.subject) + '错题">'
          + '<div class="sc-h"><span class="sc-nm">' + esc(s.subject) + '</span>'
          + '<span class="sc-pct">' + pct + '%</span></div>'
          + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
          + '<div class="sc-n">掌 ' + m + ' / ' + n + '</div></div>';
      }).join('') + '</div></div>';
  }

  const prio = st.top_due || [];
  h += '<div class="dash-sec"><div class="dash-h">⏰ 优先补练 <span class="tiny faint">点题目直接看讲解</span></div>'
    + (prio.length
      ? prio.map(p => '<div class="dash-prow" data-pid="' + p.id + '" title="点击打开这道题的讲解">'
        + '<span class="badge' + (p.overdue >= 1 ? ' od' : '') + '">' + (p.overdue >= 1 ? '逾期' + p.overdue + '天' : '今日') + '</span>'
        + '<span class="subj">' + esc(p.subject) + '</span>'
        + '<span class="tx ellipsis">' + esc(p.preview) + '</span></div>').join('')
      : '<div class="dash-pempty">' + (total
        ? '暂无到期题目，复习安排得刚刚好 ✓'
        : '还没有错题。点下方「录题」拍第一道题，或先在设置页导入数据。') + '</div>')
    + '</div>';

  h += '</div>';   /* /dash-main */

  /* 右栏：二维码 + 日历上下叠放（日历 flex 吃满，底边与左侧补练框平齐） */
  h += '<div class="dash-side">';
  if (Store.mode === 'server') {
    h += '<div class="dash-qr"><img src="./api/qrcode" alt="手机扫码打开错题本">'
      + '<div class="grow"><div class="t">📱 手机 / 平板扫码</div>'
      + '<div class="s">扫左侧二维码，手机浏览器用<b>竖版界面</b>访问同一份数据。<br>'
      + '手机和电脑连同一个网络即可，数据不出门。</div></div></div>';
  }
  if (!CAL_YM) { const now = new Date(); CAL_YM = { y: now.getFullYear(), m: now.getMonth() }; }
  h += '<div class="dash-cal" id="dashCalBox">' + calHTML(true) + '</div>';
  h += '</div>';   /* /dash-side */
  h += '</div>';   /* /dash-body */

  /* 收起钮横贯两栏底部（放 body 外面：留在 side 里会把日历底边顶得不齐） */
  h += '<div class="dash-foot">'
    + '<button class="linklike" id="dashFold">收起看板 ▲</button></div>';

  h += '</div>';   /* /dash */
  return h;
}
function bindDashboard() {
  /* 注意：局部变量不能叫 go —— 会把全局路由函数 go(view,param) 遮蔽掉，
     下面委托里 go('detail',…) 就会变成调一个 DOM 按钮（TypeError）。 */
  const heroEl = $('#dashHero'), goBtn = $('#dashGo'),
    foldEl = $('#dashFold'), expEl = $('#dashExpand');
  if (goBtn) goBtn.onclick = (ev) => { ev.stopPropagation(); startTodayReview(); };
  if (heroEl) heroEl.onclick = () => { if ((Number(S.stats && S.stats.due_count) || 0) > 0) startTodayReview(); };
  if (foldEl) foldEl.onclick = () => { localStorage.setItem(LS_DASH_FOLD, '1'); paintDashboard(); };
  if (expEl) expEl.onclick = () => { localStorage.removeItem(LS_DASH_FOLD); paintDashboard(); };
  /* 学科行 / 优先补练行用**事件委托**绑在 #dashSlot 上：
     paintDashboard 会整块换 innerHTML（stats 刷新、翻月重绘都可能发生），
     逐行 onclick 会被换掉 —— 之前「优先补练点不开」就是被换的时机踩中的。
     委托到容器上，换多少次都还在。 */
  const slot = $('#dashSlot');
  if (slot && !slot.dataset.delegated) {
    slot.dataset.delegated = '1';
    slot.onclick = (ev) => {
      const prow = ev.target.closest('.dash-prow');
      if (prow) { go('detail', Number(prow.dataset.pid)); return; }
      const srow = ev.target.closest('.dash-scard');
      if (srow) { S.listFilter.subject = srow.dataset.dsub; renderList(); }
    };
  }
  bindCalInline();
}
/** 只重画看板（stats 刷新 / 折叠切换时，不用整页重渲染） */
function paintDashboard() {
  const slot = $('#dashSlot');
  if (!slot) return;
  slot.innerHTML = dashboardHTML();
  bindDashboard();
}

/* ---------------- 复习日历（内嵌在看板里）----------------
   数据用 S.stats.due_dates（今天起的到期分布，过期的题都滚进「今天」这一格，
   和复习页口径一致）。翻月只是换显示，不重新请求数据。
   inline=true 时是看板里的内嵌形态：没有「关闭」按钮，翻月原地重绘。 */
let CAL_YM = null;
function calFmtDay(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function calHTML(inline) {
  const dd = (S.stats && S.stats.due_dates) || {};
  const todayKey = calFmtDay(new Date());
  const y = CAL_YM.y, m = CAL_YM.m;                 // m 从 0 起
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // 周一开头
  const days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  let monthN = 0, peakD = 0, peakN = 0;
  for (let d = 1; d <= days; d++) {
    const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const n = Number(dd[key]) || 0;
    if (n) { monthN += n; if (n > peakN) { peakN = n; peakD = d; } }
    const past = key < todayKey;
    cells += '<div class="cal-cell' + (n ? ' has' : '') + (key === todayKey ? ' today' : '') + (past ? ' past' : '') + '">'
      + '<span class="d">' + d + '</span>' + (n ? '<span class="n">' + n + '</span>' : '') + '</div>';
  }
  const streak = Number(S.stats && S.stats.streak_days) || 0;
  return '<div class="cal-head">'
    + '<button class="btn gray small" id="calPrev">◀</button>'
    + '<b class="cal-title">📅 ' + y + ' 年 ' + (m + 1) + ' 月复习安排</b>'
    + '<button class="btn gray small" id="calNext">▶</button></div>'
    + '<div class="cal-grid">'
    + ['一', '二', '三', '四', '五', '六', '日'].map(w => '<div class="cal-wd">' + w + '</div>').join('')
    + cells + '</div>'
    + '<div class="tiny muted mt8">本月共 <b>' + monthN + '</b> 题待复习'
    + (peakN ? ' · 最忙 ' + peakD + ' 日（' + peakN + ' 题）' : '')
    + (streak >= 2 ? ' · 已连续复习 <b>' + streak + '</b> 天 🔥' : '')
    + '<br>按当前掌握进度预估；过期的题都算在今天。</div>'
    + (inline ? '' : '<div class="row mt12" style="gap:10px"><button class="btn grow" id="calGo">去复习今天的</button>'
      + '<button class="btn gray" id="calClose">关闭</button></div>');
}
/** 内嵌日历的翻月：原地只重绘 .dash-cal 这一块 */
function bindCalInline() {
  const p = $('#calPrev'), nx = $('#calNext');
  const repaint = () => {
