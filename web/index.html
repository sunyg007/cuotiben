}
/** 同 sec，但 text 已经是渲染好的 HTML（用于「错处加粗」那种带标记的正文） */
function secHTML(title, html) {
  return '<div class="sec"><h3>' + title + '</h3><div class="txt">' + html + '</div></div>';
}

/* 详情页的「干净原题」区块 —— 复习时看的、不含答案的那一份。
   原图照旧留在最上面，想核对笔迹随时能看；这里给的是能直接拿去做的题目。 */
function cleanBlockHTML(m) {
  const clean = String(m.clean_text || '').trim();
  const hasImg = splitImgs(m.question_image).length > 0;
  let h = '<div class="sec"><h3>📖 干净原题'
    + '<span class="badge ok" style="font-weight:400;margin-left:6px">已去掉手写 · 不含答案</span>'
    + '</h3>';
  if (clean) {
    /* 上次错的那几个小题加粗（和复习页同一套逻辑）—— 翻详情时也不用从头再看一遍 */
    h += '<div class="txt" style="white-space:pre-wrap">'
      + renderWrongMarked(clean, wrongItemsOf(m).items, 'q').html + '</div>'
      + '<div class="row wrap mt8" style="gap:8px">'
      + '<button class="btn ghost small" id="dtCleanAgain">🔄 重新提取</button>'
      + '<button class="btn ghost small" id="dtCleanEdit">✏️ 手动改</button>'
      + (m.clean_at ? '<span class="tiny faint" style="align-self:center">提取于 '
        + esc(fmtDate(m.clean_at)) + '</span>' : '')
      + '</div>'
      + '<div id="dtCleanEditBox" style="display:none" class="mt8">'
      + '<textarea id="dtCleanTa" rows="10" style="width:100%;box-sizing:border-box;'
      + 'border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;'
      + 'line-height:1.75;background:#fff;color:#2a3543"></textarea>'
      + '<div class="row mt8" style="gap:8px"><button class="btn small" id="dtCleanSave">保存</button>'
      + '<button class="btn gray small" id="dtCleanCancel">取消</button></div></div>';
  } else {
    h += '<div class="tiny muted">' + (hasImg
      ? '还没整理出干净原题。提取时会重读一遍照片，只抄印刷体的题目 —— 孩子上次写的答案不会带进来，'
        + '复习时不开图片也能直接做题（阅读这类大题的短文和全部小题会整篇保留）。'
        + '<br>提示：以后新拍的题在「检查」那一步就会一起整理好，不用再点这里。'
      : '这道题没有原图，没法自动提取；可以在下面「题目」里手动补一份干净原题。') + '</div>'
      + (hasImg ? '<button class="btn small mt8" id="dtCleanGo">📖 提取干净原题</button>' : '');
  }
  return h + '</div>';
}

function bindCleanBlock(m) {
  const go = $('#dtCleanGo'), again = $('#dtCleanAgain');
  const run = async (btn) => {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = '读取照片并提取中…（约 10 秒）';
    try {
      await saveClean(m);
      toast('干净原题已提取 ✓');
      if (S.view === 'detail') renderDetail(m.id);
    } catch (e) {
      toast('提取失败：' + e.message, 3800);
      btn.disabled = false;
      btn.textContent = old;
    }
  };
  if (go) go.onclick = () => run(go);
  if (again) again.onclick = () => run(again);
  const eb = $('#dtCleanEdit');
  if (eb) eb.onclick = () => {
    const box = $('#dtCleanEditBox');
    if (!box) return;
    box.style.display = 'block';
    const ta = $('#dtCleanTa');
    if (ta) { ta.value = String(m.clean_text || ''); ta.focus(); }
  };
  const cc = $('#dtCleanCancel');
  if (cc) cc.onclick = () => { const b = $('#dtCleanEditBox'); if (b) b.style.display = 'none'; };
  const sv = $('#dtCleanSave');
  if (sv) sv.onclick = async () => {
    const ta = $('#dtCleanTa');
    const txt = ta ? String(ta.value || '').trim() : '';
    sv.disabled = true;
    sv.textContent = '保存中…';
    try {
      await Store.update(m.id, { clean_text: txt });
      m.clean_text = txt;
      toast('已保存 ✓');
      if (S.view === 'detail') renderDetail(m.id);
    } catch (e) {
      toast('保存失败：' + e.message, 3600);
      sv.disabled = false;
      sv.textContent = '保存';
    }
  };
}

/* ---------------- 视图：同类训练（按知识点现出几道题） ---------------- */
const DRILL_PROMPT = `你是位经验丰富的小学老师，正在给学生出「同类巩固题」。要求：
1. 出 4 道与原题同类型、难度相当的题目（数字换新，情境可变）。
2. 每道题给出正确答案和一两句话的解析（讲清思路或易错点）。
3. 题目要能独立读懂，不要出现"上图""第几页"这类引用。
4. 只输出 JSON，不要多余文字：{"drills":[{"question_text":"题目","answer":"答案","explanation":"解析"}]}`;

/* 按错因出题（针对版）：核心错因 5 标签 + 语法时态的题走这套——
   出题时明确「这道题要专门治什么错」，变式题直击孩子的薄弱方式，
   并给每道题一句「防错提醒」，复习比泛泛的同类题更有针对性。 */
const DRILL_BY_REASON_PROMPT = `你是位经验丰富的小学老师，正在给一个学生出「纠错专项练习题」。
这个学生刚在原题上犯错，**错因已经诊断出来了**。要求：
1. 出 4 道与原题同类型、难度相当的变式题（数字换新，情境可变），
   **每一道都要针对性地练这个错因**——让孩子用正确的方式重新走一遍容易栽跟头的地方。
2. 不同错因的出题侧重点：
   · 概念不清 → 变着花样考同一个概念/公式，让孩子把概念用对；
   · 方法不会 → 拆解成递进的步骤题，第一问给台阶，逐步爬到原题难度；
   · 知识点遗忘 → 带一点回忆提示的变式，让孩子把忘掉的知识捡回来；
   · 审题不清 → 题目里故意埋一两个容易漏看的条件（单位、隐含前提、多问），考孩子读题细不细；
   · 计算粗心 → 数字设计得容易踩坑（进位退位、小数点、约分），逼孩子认真算；
   · 语法时态 → 换情境换主语考同一个语法点，时间标志词要变。
3. 每道题的解析最后加一句「⚠️ 防错提醒」：点出这道题最容易错在哪一步、提醒孩子注意什么。
4. 题目要能独立读懂，不要出现"上图""第几页"这类引用。
5. 只输出 JSON，不要多余文字：{"drills":[{"question_text":"题目","answer":"答案","explanation":"解析"}]}`;

/* 这些错因标签的题，「按错因出举一反三」比泛泛的同类题更有针对性 */
const REASON_DRILL_TAGS = ['概念不清', '方法不会', '知识点遗忘', '审题不清', '计算粗心', '语法时态'];

/** 生成同类训练题：纯文本调用，不重传照片。
    带错因（byReason=true）时用针对性提示词——原题命中核心错因/语法时态标签的题走这条路。 */
async function aiDrill(m, byReason) {
  const kps = String(m.knowledge_point || '').split(/[,，、;；/|]+/).map(s => s.trim()).filter(Boolean);
  const tg = tagsOf(m);
  const lines = ['【科目】' + (m.subject || '未分类'),
    '【原题】' + (cleanOrText(m) || '（原题没有文字记录，请按知识点出题）')];
  if (m.correct_answer) lines.push('【原题答案】' + m.correct_answer);
  if (tg.length) lines.push('【学生的错因】' + tg.join('、'));
  lines.push('【知识点】' + (kps.length ? kps.join('、') : '（请从原题里自己提炼）'));
  if (m.chapter) lines.push('【章节】' + m.chapter);
  const messages = [
    { role: 'system', content: byReason ? DRILL_BY_REASON_PROMPT : DRILL_PROMPT },
    { role: 'user', content: lines.join('\n') }
  ];
  const a = parseJSONLoose(await llmChat(messages, 6000));
  const arr = Array.isArray(a.drills) ? a.drills : (Array.isArray(a) ? a : []);
  const items = arr.map(x => ({
    question_text: String((x && (x.question_text || x.question)) || '').trim(),
    answer: String((x && (x.answer || x.correct_answer)) || '').trim(),
    explanation: String((x && x.explanation) || '').trim(),
    open: false, saved: false, saving: false
  })).filter(x => x.question_text);
  if (!items.length) throw new Error('没生成出题目，点「再来一组」重试一次');
  return items;
}

async function renderDrill(id, byReason) {
  const seq = (renderDrill._seq = (renderDrill._seq || 0) + 1);
  setTitle(byReason ? '错因专项训练' : '同类训练', '');
  $('#main').innerHTML = '<div class="pad center muted">读取中…</div>';
  let m;
  try { m = await Store.get(id); }
  catch (e) { if (S.view === 'drill' && renderDrill._seq === seq) { toast(e.message); go('list', null, true); } return; }
  if (S.view !== 'drill' || renderDrill._seq !== seq) return;
  S.drill = { id: id, m: m, busy: false, items: [], error: '', byReason: !!byReason };
  paintDrill();
  drillStart();                       // 进页面就自动出一组
}

function paintDrill() {
  const d = S.drill;
  if (!d || S.view !== 'drill') return;
  const m = d.m;
  const kps = String(m.knowledge_point || '').split(/[,，、;；/|]+/).map(s => s.trim()).filter(Boolean);
  let h = '<div class="sec"><h3>📌 原题</h3><div class="txt">'
    + esc((cleanOrText(m) || '（无文字记录）').slice(0, 160))
    + (cleanOrText(m).length > 160 ? '…' : '') + '</div>'
    + (d.byReason && tagsOf(m).length
      ? '<div class="chips mt8">' + tagsOf(m).map(t => '<span class="chip">错因 · ' + esc(t) + '</span>').join('') + '</div>'
      : (kps.length ? '<div class="chips mt8">' + kps.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div>' : ''))
    + '</div>';

  if (d.busy) {
    h += '<div class="loading"><div class="spin"></div><div style="font-weight:600">'
      + (d.byReason ? 'AI 正在按错因出纠错专项题…' : 'AI 正在按知识点出题…') + '</div>'
      + '<div class="tiny muted mt8">推理模型要先想一想，约 10～40 秒</div></div>';
  } else if (d.error) {
    h += '<div class="pad"><div class="notice warn">' + esc(d.error) + '</div>'
      + '<button class="btn block mt8" id="dDrillAgain">🔄 再来一组</button></div>';
  } else if (d.items.length) {
    h += '<div class="sec"><h3>✍️ ' + (d.byReason ? '纠错专项练习 ' : '同类练习 ') + d.items.length + ' 道</h3>'
      + '<div class="tiny muted">' + (d.byReason ? '每道都针对「' + (tagsOf(m)[0] || '该错因') + '」设计，做完看防错提醒' : '先让孩子自己做，再对答案') + '</div></div>';
    d.items.forEach((it, i) => {
      h += '<div class="sec"><h3>第 ' + (i + 1) + ' 题</h3><div class="txt">' + esc(it.question_text) + '</div>';
      if (it.open) {
        h += '<div class="ansbox" style="margin:0 14px 10px">'
          + '<div class="ln ok"><span class="k">答案</span><span class="v">' + esc(it.answer || '（模型没给，可重出一组）') + '</span></div>'
          + (it.explanation ? '<div class="ln"><span class="k">解析</span><span class="v">' + esc(it.explanation) + '</span></div>' : '')
          + '</div>';
      }
      h += '<div class="row" style="gap:8px;padding:0 14px 12px">'
        + '<button class="btn gray grow" data-dopen="' + i + '">' + (it.open ? '🙈 收起答案' : '👀 看答案') + '</button>'
        + (it.saved
          ? '<button class="btn gray" disabled>✓ 已入错题本</button>'
          : '<button class="btn ghost" data-dsave="' + i + '"' + (it.saving ? ' disabled' : '') + '>➕ 做错了就存入</button>')
        + '</div></div>';
    });
    h += '<div class="actions"><button class="btn ghost block" id="dDrillAgain">🔄 换一组</button></div>';
  }
  h += '<div class="pad tiny faint center">训练题由 AI 现场生成，答案请家长把关</div>';
  $('#main').innerHTML = h;

  $$('#main [data-dopen]').forEach(b => b.onclick = () => {
    d.items[Number(b.dataset.dopen)].open = !d.items[Number(b.dataset.dopen)].open;
    paintDrill();
  });
  $$('#main [data-dsave]').forEach(b => b.onclick = () => drillSaveOne(Number(b.dataset.dsave)));
  const again = $('#dDrillAgain');
  if (again) again.onclick = drillStart;
}

async function drillStart() {
  const d = S.drill;
  if (!d || d.busy) return;
  d.busy = true; d.error = ''; d.items = [];
  paintDrill();
  try {
    const items = await aiDrill(d.m, d.byReason);
    if (S.drill !== d) return;                    // 用户已经离开/换题，丢弃
    d.items = items;
    d.busy = false;
  } catch (e) {
    if (S.drill !== d) return;
    d.busy = false;
    d.error = e.message || '生成失败';
  }
  if (S.view !== 'drill') { S.view = 'drill'; syncTab(); }   // 生成慢，回来时把页面拿到前台
  paintDrill();
}

async function drillSaveOne(i) {
  const d = S.drill;
  const it = d && d.items[i];
  if (!it || it.saved || it.saving) return;
  it.saving = true; paintDrill();
  try {
    await Store.create({
      subject: d.m.subject || '未分类', chapter: d.m.chapter || '',
      knowledge_point: d.m.knowledge_point || '', reason_tags: [], error_reason: '',
      /* 同类练习题是拿来练的（还没做，谈不上错因），所以不带标签 */
      question_text: it.question_text, student_answer: '', correct_answer: it.answer,
      explanation: it.explanation, similar_question: '', check_result: '',
      is_correct: 'unknown', mastery: 0, source_type: '练习', question_image: ''
    });
    it.saved = true; it.saving = false;
    S.stats = await Store.stats();
    toast('已存入错题本（来源：练习）✓');
  } catch (e) {
    it.saving = false;
    toast('保存失败：' + e.message, 3200);
  }
  paintDrill();
}

/* ---------------- 原图查看器：缩放 / 平移 / 旋转 ----------------
   复习时要放大看清小字。旧版把整张图缩进屏幕：跨页拼出来的题图又高又窄
   （实测 1200x6436），塞进去只剩一百来像素宽，怎么放都看不清。
   现在：又高又窄的图默认「按宽度铺满 + 上下拖动」，并支持双指捏合 / 双击 / 滚轮缩放。 */
const V = {
  open: false, src: '', natW: 0, natH: 0,
  rot: 0,          // 0 / 90 / 180 / 270
  zoom: 1,         // 相对「基准适配」的倍数
  width: false,    // true=按宽度铺满；false=整图显示
  px: 0, py: 0     // 图片中心相对屏幕中心的偏移（CSS 像素）
};
const V_MIN = 0.2, V_MAX = 10;
const V_TALL = 1.55;        // 高宽比超过它（跨页拼图）就默认按宽度铺满
const V_LOWRES = 1500;      // 宽度小于它 = 早期压缩版，放大必然糊

function vEls() {
  return { stage: $('#vStage'), img: $('#vImg'), pct: $('#vPct'), meta: $('#vMeta'), hint: $('#vHint') };
}
/** 旋转 90/270 时有效宽高互换 */
function vEff() {
  const swap = V.rot % 180 !== 0;
  return { w: swap ? V.natH : V.natW, h: swap ? V.natW : V.natH };
}
function vStageSize() {
  const s = $('#vStage');
  const w = (s && s.clientWidth) || window.innerWidth;
  const h = (s && s.clientHeight) || window.innerHeight;
  return { w: Math.max(1, w), h: Math.max(1, h) };
}
/** 把当前缩放/位移/旋转画到屏幕上 */
function vDraw() {
  const e = vEls();
  if (!e.img || !V.natW || !V.natH) return;
  const st = vStageSize(), eff = vEff();
  /* 基准适配：整图显示 = 长短边都放得下；按宽度铺满 = 横向撑满，纵向可拖 */
  const base = V.width
    ? st.w / eff.w
    : Math.min(st.w / eff.w, st.h / eff.h);
  const scale = base * V.zoom;                       // 原始像素 → CSS 像素
  const dw = V.natW * scale, dh = V.natH * scale;
  const rbW = (V.rot % 180 !== 0) ? dh : dw;
  const rbH = (V.rot % 180 !== 0) ? dw : dh;
  /* 钳住位移：比屏幕小的方向居中，比屏幕大的方向别拖出边界 */
  const maxX = Math.max(0, (rbW - st.w) / 2), maxY = Math.max(0, (rbH - st.h) / 2);
  V.px = Math.max(-maxX, Math.min(maxX, V.px));
  V.py = Math.max(-maxY, Math.min(maxY, V.py));
  e.img.style.width = dw + 'px';
  e.img.style.height = dh + 'px';
  e.img.style.transform = 'translate(' + (st.w / 2 - dw / 2 + V.px) + 'px,'
    + (st.h / 2 - dh / 2 + V.py) + 'px) rotate(' + V.rot + 'deg)';
  if (e.pct) e.pct.textContent = Math.round(scale * 100) + '%';
  if (e.meta) e.meta.textContent = V.natW + 'x' + V.natH + (V.rot ? ' 已转 ' + V.rot + '°' : '');
}
/** 以屏幕上某点为锚缩放：该点下的内容保持不动（ax/ay 是相对屏幕中心的偏移） */
function vZoomAt(factor, ax, ay) {
  const old = V.zoom;
  const z = Math.max(V_MIN, Math.min(V_MAX, old * factor));
  if (z === old) return;
  const k = z / old;
  V.px = ax - (ax - V.px) * k;
  V.py = ay - (ay - V.py) * k;
  V.zoom = z;
  vDraw();
}
function zoomImage(src) {
  if (!src) return;
  const m = $('#modal'), e = vEls();
  if (!m || !e.img) return;
  m.className = '';
  V.open = true; V.src = src; V.rot = 0; V.zoom = 1; V.width = false;
  V.px = 0; V.py = 0; V.natW = 0; V.natH = 0;
  document.body.style.overflow = 'hidden';
  /* 让手机的系统返回键先关大图（和页面返回栈分开） */
  try { history.pushState({ v: '__viewer' }, ''); } catch (err) {}
  if (e.hint) e.hint.textContent = '';
  if (e.pct) e.pct.textContent = '—';
  if (e.meta) e.meta.textContent = '';
  e.img.style.width = ''; e.img.style.height = ''; e.img.style.transform = '';
  let fired = false;
  const done = () => {
    if (fired) return;
    fired = true;
    V.natW = e.img.naturalWidth || 0;
    V.natH = e.img.naturalHeight || 0;
    if (!V.natW || !V.natH) {        // 原图丢了也别给个黑屏，说清怎么办
      if (e.hint) e.hint.textContent = '这张原图打不开了（文件可能已丢失）。可以点「编辑」重新拍一张。';
      if (e.pct) e.pct.textContent = '—';
      return;
    }
    V.width = (V.natH / V.natW) > V_TALL;
    vDraw();
    if (e.hint && V.natW < V_LOWRES) {
      e.hint.textContent = '这张存的是早期压缩版（宽 ' + V.natW + 'px），放到很大还是会糊；'
        + '想彻底看清可以点「编辑」重拍一张。';
    }
  };
  e.img.onload = done;
  e.img.onerror = done;
  e.img.src = src;
  if (e.img.complete) done();        // 命中缓存时 load 可能已经错过了
}
function closeViewer() {
  if (!V.open) return;
  V.open = false;
  const m = $('#modal'), e = vEls();
  if (m) m.className = 'hidden';
  if (e.img) { e.img.onload = null; e.img.onerror = null; e.img.removeAttribute('src'); }
  V.src = ''; V.natW = 0; V.natH = 0;
  document.body.style.overflow = '';
}
function bindViewer() {
  const m = $('#modal');
  if (!m) return;
  const e = vEls();
  $('#vClose').onclick = closeViewer;
  $('#vOut').onclick = () => vZoomAt(1 / 1.4, 0, 0);
  $('#vIn').onclick = () => vZoomAt(1.4, 0, 0);
  $('#vWidth').onclick = () => { V.width = true; V.zoom = 1; V.px = 0; V.py = 0; vDraw(); };
  $('#vFit').onclick = () => { V.width = false; V.zoom = 1; V.px = 0; V.py = 0; vDraw(); };
  $('#vRot').onclick = () => { V.rot = (V.rot + 90) % 360; V.px = 0; V.py = 0; vDraw(); };

  /* 光标/手指相对屏幕中心的坐标（用于锚点缩放） */
  const localPt = (ev) => {
    const r = (e.stage || m).getBoundingClientRect();
    return { x: ev.clientX - (r.left + r.width / 2), y: ev.clientY - (r.top + r.height / 2) };
  };
  const pts = new Map();
  let drag = null, pinch = null, downTarget = null;
  let lastTap = 0, lastXY = null;

  /* 点在按钮上时不参与拖动，否则会把按钮的点击吞掉 */
  const onBar = (t) => !!(t && t.closest && t.closest('button'));

  m.addEventListener('pointerdown', (ev) => {
    if (!V.open || onBar(ev.target)) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    try { m.setPointerCapture(ev.pointerId); } catch (err) {}
    const p = localPt(ev);
    pts.set(ev.pointerId, p);
    if (pts.size === 1) {
      downTarget = ev.target;
      drag = { px: V.px, py: V.py, x: p.x, y: p.y, moved: 0 };
      pinch = null;
    } else if (pts.size === 2) {
      const a = Array.from(pts.values());
      drag = null;
      pinch = {
        d: Math.max(1, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)),
        mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2,
        zoom: V.zoom, px: V.px, py: V.py
      };
    }
    ev.preventDefault();
  }, { passive: false });

  m.addEventListener('pointermove', (ev) => {
    if (!V.open || !pts.has(ev.pointerId)) return;
    const p = localPt(ev);
    pts.set(ev.pointerId, p);
    if (pts.size === 1 && drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      V.px = drag.px + dx; V.py = drag.py + dy;
      vDraw();
    } else if (pts.size === 2 && pinch) {
      const a = Array.from(pts.values());
      const d = Math.max(1, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y));
      const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
      const z = Math.max(V_MIN, Math.min(V_MAX, pinch.zoom * d / pinch.d));
      const k = z / pinch.zoom;
      V.px = mx - (pinch.mx - pinch.px) * k;
      V.py = my - (pinch.my - pinch.py) * k;
      V.zoom = z;
      vDraw();
    }
    ev.preventDefault();
  }, { passive: false });

  const drop = (ev) => {
    if (!pts.has(ev.pointerId)) return;
    const p = pts.get(ev.pointerId);
    pts.delete(ev.pointerId);
    if (pts.size === 1) {                      // 还留着一根手指：重新作为拖动基准
      const only = Array.from(pts.values())[0];
      drag = { px: V.px, py: V.py, x: only.x, y: only.y, moved: 99 };
      pinch = null;
      return;
    }
    pinch = null;
    const dragged = !drag || drag.moved > 8;
    const tgt = downTarget;
    drag = null; downTarget = null;
    if (dragged) return;                       // 拖过就不算「点一下」
    const now = Date.now();
    const near = lastXY && Math.hypot(p.x - lastXY.x, p.y - lastXY.y) < 44;
    if (now - lastTap < 330 && near) {         // 双击 / 双点：在「适应」与 2.5 倍之间切换
      lastTap = 0; lastXY = null;
      if (V.zoom > 1.2) { V.zoom = 1; V.px = 0; V.py = 0; }
      else { V.zoom = 2.5; V.px = p.x * (1 - 2.5); V.py = p.y * (1 - 2.5); }
      vDraw();
      return;
    }
    lastTap = now; lastXY = p;
    /* 单击图片以外的空白 → 关闭（图片上单击不关，免得误触） */
    if (tgt !== e.img && e.img && !(tgt && tgt.closest && tgt.closest('.vbar,.vtop'))) closeViewer();
  };
  m.addEventListener('pointerup', drop);
  m.addEventListener('pointercancel', drop);

  m.addEventListener('wheel', (ev) => {
    if (!V.open) return;
    ev.preventDefault();
    const p = localPt(ev);
    vZoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, { passive: false });

  window.addEventListener('keydown', (ev) => {
    if (!V.open) return;
    const k = ev.key;
    if (k === 'Escape') { closeViewer(); }
    else if (k === '+' || k === '=') { vZoomAt(1.25, 0, 0); }
    else if (k === '-' || k === '_') { vZoomAt(1 / 1.25, 0, 0); }
    else if (k === '0') { V.width = false; V.zoom = 1; V.px = 0; V.py = 0; vDraw(); }
    else if (k === 'w' || k === 'W') { V.width = true; V.zoom = 1; V.px = 0; V.py = 0; vDraw(); }
    else if (k === 'r' || k === 'R') { V.rot = (V.rot + 90) % 360; V.px = 0; V.py = 0; vDraw(); }
    else if (k === 'ArrowLeft') { V.px += 60; vDraw(); }
    else if (k === 'ArrowRight') { V.px -= 60; vDraw(); }
    else if (k === 'ArrowUp') { V.py += 60; vDraw(); }
    else if (k === 'ArrowDown') { V.py -= 60; vDraw(); }
    else return;
    ev.preventDefault();
  });

  const reflow = () => { if (V.open) vDraw(); };
  window.addEventListener('resize', reflow);
  window.addEventListener('orientationchange', () => setTimeout(reflow, 260));
}

/* ---------------- 原图窗口：内嵌在错题上方，一张一张看 + 独立缩放 ----------------
   和上面的全屏看图器（V）是两套东西，各管一段：
   · V 是弹上去的全屏 modal，解决「这一张我要看得很大」
   · 这里是嵌在错题上方的一块窗口：尺寸写死、图在里面平移缩放，
     放大缩小时只有窗口里的画面在变，**下面的题目和答案纹丝不动**
     （以前直接给 img 设宽度，一放大就把整页布局撑开、下面内容全被顶走）。
   窗口状态按 key 记在 PB 里，同一道题重新渲染（如点「显示答案」）后缩放和页码不丢。
---------------------------------------------------------------------------------- */
const PB_MIN = 0.4, PB_MAX = 12, PB_DBL = 2.6;
const PB_TALL = 1.55;   // 高宽比超过它（跨页拼出来的长图）默认「按宽度铺满」，与全屏查看器 V_TALL 同口径
const PB = {};        // key -> { i, z, x, y, rot, width, manual }
const PB_DRAW = {};   // key -> 重绘函数（窗口尺寸变化时统一叫一次）

/** question_image 可能是单张，也可能是多张（用 | 连起来，跨页/整卷题） */
function splitImgs(s) {
  return String(s == null ? '' : s).split('|').map(x => x.trim()).filter(Boolean);
}
/** 只要第一张：列表缩略图、打印这类单图场合 */
function firstImg(s) { return splitImgs(s)[0] || ''; }

/* ---------------- 错因标签：选择器（录入页 / 整页校对 / 详情页共用） ----------------
   交互：点分类标题展开/收起该组（一行两个下拉，4 组只占两行），点标签选中/取消（复选）。
   选中的标签在最上面单独排一行，随时能点掉。清单里没有的，最下面自己写（回车即添加）。 */
const TAGUI = { open: {} };              // open[prefix:gi]=组是否展开（默认全收起）

/** 选择器外框 + 内容（prefix 用来区分同一页上的多个选择器，必须唯一） */
function tagPickerBox(prefix, selected) {
  return '<div class="tagpick" data-taghost="' + esc(prefix) + '">'
    + tagPickerInner(prefix, selected) + '</div>';
}

function tagPickerInner(prefix, selected) {
  /* 旧标签映射成新清单的名字（漏题→马虎粗心这种）；映射不了的（自定义标签）原样保留。
     不能直接 normalizeTags —— 它会把清单外的词整个丢掉，自定义标签就再也显示不出来了。 */
  const sel = (Array.isArray(selected) ? selected.slice() : splitTagInput(selected))
    .map(t => TAG_ALIAS[t] || t)
    .filter((t, i, a) => t && a.indexOf(t) === i);
  let h = '<div class="tagsel' + (sel.length ? '' : ' empty') + '">'
    + (sel.length
      ? sel.map(t => '<span class="chip" data-tagoff="' + esc(t) + '">' + esc(t) + '<i>×</i></span>').join('')
        + '<button class="mini" data-tagclear="1">清空</button>'
      : '<span class="tiny faint">点分类展开后点标签，可以多选</span>')
    + '</div>';
  /* 4 个分类做成「一行两个」的下拉块（grid 两列），默认全收起：
     20 个标签 4 组，展开一组就一小条，整块高度可控、几秒选完。 */
  h += '<div class="taggrid">';
  TAG_GROUPS.forEach((g, gi) => {
    const open = !!TAGUI.open[prefix + ':' + gi];
    const cnt = g[1].filter(t => sel.indexOf(t) >= 0).length;
    h += '<div class="tagg' + (open ? ' open' : '') + '">'
      + '<div class="tagg-h" data-tgg="' + gi + '"><span class="arw">▸</span>' + esc(g[0])
      + (cnt ? '<span class="cnt">' + cnt + '</span>' : '') + '</div>'
      + '<div class="tagg-b">'
      + g[1].map(t => '<span class="chip' + (sel.indexOf(t) >= 0 ? ' on' : '') + '" data-tagon="'
        + esc(t) + '">' + esc(t) + '</span>').join('')
      + '</div></div>';
  });
  h += '</div>';
  const custom = sel.filter(t => ALL_TAGS.indexOf(t) < 0);
  h += '<div class="tagcustom"><input type="text" maxlength="16" data-tagin="' + esc(prefix) + '"'
    + ' placeholder="' + (custom.length ? '自定义：' + esc(custom.join('、')) + '（回车再加一个）'
      : '清单里没有的在这里自己写，回车添加') + '"></div>';
  return h;
}

/**
 * 绑定选择器。getSel/setSel 由调用方提供（状态存在哪由调用方决定）。
 * onChange 传了就在改动后回调（调用方整体重绘）；不传就只重绘选择器自身。
 */
function bindTagPicker(prefix, getSel, setSel, onChange) {
  const host = document.querySelector('[data-taghost="' + prefix + '"]');
  if (!host) return;
  const repaint = () => { host.innerHTML = tagPickerInner(prefix, getSel()); };
  /* 先局部重画，再通知外部 —— 外部要整体重绘的话会连它一起换掉，不冲突；
     不传 onChange 时（详情页那种）就靠这一次局部重画把选中状态刷新 */
  const commit = (fn) => { fn(); repaint(); if (onChange) onChange(); };
  host.onclick = (ev) => {
    const off = ev.target.closest('[data-tagoff]');
    if (off) { const t = off.dataset.tagoff; commit(() => setSel(getSel().filter(x => x !== t))); return; }
    if (ev.target.closest('[data-tagclear]')) { commit(() => setSel([])); return; }
    const th = ev.target.closest('.tagg-h');
    if (th) {
      const gi = Number(th.dataset.tgg);
      TAGUI.open[prefix + ':' + gi] = !TAGUI.open[prefix + ':' + gi];
      repaint(); if (onChange) onChange();
      return;
    }
    const on = ev.target.closest('[data-tagon]');
    if (on) {
      const t = on.dataset.tagon;
      const cur = getSel();
      commit(() => setSel(cur.indexOf(t) >= 0 ? cur.filter(x => x !== t) : cur.concat([t])));
    }
  };
  host.onkeydown = (ev) => {
    const inp = ev.target.closest('[data-tagin]');
    if (!inp || ev.key !== 'Enter') return;
    ev.preventDefault();
    const t = String(inp.value || '').trim().replace(/^[#＃]+/, '').slice(0, 16);
    if (!t) return;
    const cur = getSel();
    if (cur.indexOf(t) >= 0) { inp.value = ''; return; }
    inp.value = '';
    commit(() => setSel(cur.concat([t])));
  };
}

/** 在卡片 / 详情页里展示标签（只读的小药丸） */
function tagChipsHTML(tags, emptyText) {
  const arr = Array.isArray(tags) ? tags : splitTagInput(tags);
  if (!arr.length) return emptyText ? '<span class="tiny faint">' + esc(emptyText) + '</span>' : '';
  return arr.map(t => '<span class="chip">' + esc(t) + '</span>').join('');
}

/** 详情页顶部那排徽章（学科 / 来源 / 错因标签 / 判定）。改完标签要原地重画，所以单独抽出来 */
function detailBadgesHTML(m, tags) {
  const v = VERDICT[m.is_correct] || VERDICT.unknown;
  const rc = Number(m.review_count || 0);
  return '<span class="badge">' + esc(m.subject || '未分类') + '</span>'
    + '<span class="badge k">' + esc(m.source_type || '作业') + '</span>'
    + '<span class="badge k">🔁 练过 ' + rc + ' 次</span>'
    + (tags || []).map(t => '<span class="badge bad">' + esc(t) + '</span>').join('')
    + '<span class="badge ' + (m.is_correct === 'wrong' ? 'bad' : m.is_correct === 'right' ? 'ok' : 'k') + '">'
    + v.ico + ' ' + v.label + '</span>';
}

/* 详情页直接改标签：连点几下不该发一串请求，攒 500ms 合并成一次 */
let _tagSaveT = null;
function tagSaveSoon(id) {
  if (_tagSaveT) clearTimeout(_tagSaveT);
  _tagSaveT = setTimeout(async () => {
    _tagSaveT = null;
    const tags = (S.detail && S.detail.tags) || [];
    try {
      await Store.update(id, { reason_tags: tags.join('，') });
      toast('标签已保存 ✓', 1400);
    } catch (e) { toast('标签保存失败：' + e.message, 3000); }
  }, 500);
}

/** 复习页里每道题各用一个窗口 key：翻到别的题再翻回来，缩放位置和页码都还在 */
function pbKeyR(m) { return 'pbRev' + ((m && m.id) || 0); }

function pbState(key, n) {
  let s = PB[key];
  if (!s) s = PB[key] = { i: 0, z: 1, x: 0, y: 0, rot: 0, width: false, manual: false };
  if (s.width === undefined) s.width = false;      // 老状态（升级前建的）补默认值
  if (s.manual === undefined) s.manual = false;
  if (s.i >= n) s.i = Math.max(0, n - 1);
  return s;
}

/** 原图窗口的 HTML（paths 为空返回空串）。key 必须唯一：详情页 / 复习页各一个 */
function photoBoxHTML(paths, key) {
  const list = (paths || []).filter(Boolean);
  if (!list.length) return '';
  const s = pbState(key, list.length);
  const multi = list.length > 1;
  let h = '<div class="pbox loading" id="' + esc(key) + '">'
    + '<img alt="原题照片" data-pbimg>'
    + '<div class="pbmsg" data-pbmsg>照片读取中…</div>';
  if (multi) {
    h += '<button class="pbnav l" data-pbgo="-1" aria-label="上一页">‹</button>'
      + '<button class="pbnav r" data-pbgo="1" aria-label="下一页">›</button>'
      + '<div class="pbdots">'
      + list.map((_, k) => '<i class="' + (k === s.i ? 'on' : '') + '"></i>').join('')
      + '</div>';
  }
  h += '<div class="pbbar">'
    + '<button data-pbz="-" aria-label="缩小">−</button>'
    + '<button data-pbz="+" aria-label="放大">＋</button>'
    + '<button data-pbz="fit">适应</button>'
    + '<button data-pbz="wmode" class="' + (s.width ? 'on' : '') + '"'
    + ' aria-label="整图显示 / 按宽度铺满" title="整图显示 / 按宽度铺满（长图按宽度铺满才看得清）">宽</button>'
    + '<button data-pbz="rot" aria-label="旋转">⟳</button>'
    + '<span class="sp"></span>'
    + (multi ? '<span class="rd" data-pbpage>' + (s.i + 1) + '/' + list.length + '</span>' : '')
    + '<span class="rd" data-pbpct>100%</span>'
    + '<button data-pbz="full" aria-label="全屏查看">⛶</button>'
    + '</div>';
  if (!multi) h += '<div class="pbhint">双指捏合放大 · 按住图片拖动可看局部</div>';
  h += '</div>';
  return h;
}

/** 把原图窗口接上交互：翻页、缩放、拖动、双击、滚轮 */
function bindPhotoBox(paths, key) {
  const root = document.getElementById(key);
  const list = (paths || []).filter(Boolean);
  if (!root || !list.length) return;
  const img = root.querySelector('[data-pbimg]');
  const msg = root.querySelector('[data-pbmsg]');
  if (!img) return;
  const s = pbState(key, list.length);
  let natW = 0, natH = 0;

  const stage = () => ({ w: Math.max(1, root.clientWidth), h: Math.max(1, root.clientHeight) });
  /** 旋转 90/270 时有效宽高互换 */
  const eff = () => (s.rot % 180 !== 0) ? { w: natH, h: natW } : { w: natW, h: natH };

  function paintPage() {
    const pg = root.querySelector('[data-pbpage]');
    if (pg) pg.textContent = (s.i + 1) + '/' + list.length;
    const ds = root.querySelectorAll('.pbdots i');
    for (let k = 0; k < ds.length; k++) ds[k].classList.toggle('on', k === s.i);
  }

  /* 图上是不是有超出窗口的部分 —— 有就能拖，跟「放大了几倍」无关。
     （长图按宽度铺满时 z=1，但纵向远超窗口，这时也必须能拖，否则下半页永远看不到。） */
  let canPanX = false, canPanY = false;

  function draw() {
    if (!natW || !natH) return;
    const st = stage(), e = eff();
    /* 基准适配两种口径：
       「整图」= 长短边都塞得下（看全貌）；「按宽度」= 横向撑满、纵向拖（看清字）。
       转了 90/270 的图按宽度算会很怪，直接退回整图适应。 */
    const widthMode = s.width && (s.rot % 180 === 0);
    const base = widthMode ? st.w / e.w : Math.min(st.w / e.w, st.h / e.h);
    const k = base * s.z;   // 原始像素 → CSS 像素
    const dw = natW * k, dh = natH * k;
    const rbW = (s.rot % 180 !== 0) ? dh : dw;
    const rbH = (s.rot % 180 !== 0) ? dw : dh;
    /* 钳住位移：比窗口小的方向居中，比窗口大的方向别拖出边界 */
    const maxX = Math.max(0, (rbW - st.w) / 2), maxY = Math.max(0, (rbH - st.h) / 2);
    s.x = Math.max(-maxX, Math.min(maxX, s.x));
    s.y = Math.max(-maxY, Math.min(maxY, s.y));
    img.style.width = dw + 'px';
    img.style.height = dh + 'px';
    img.style.transform = 'translate(' + (st.w / 2 - dw / 2 + s.x) + 'px,'
      + (st.h / 2 - dh / 2 + s.y) + 'px) rotate(' + s.rot + 'deg)';
    const pct = root.querySelector('[data-pbpct]');
    if (pct) pct.textContent = Math.round(k * 100) + '%';
    const wb = root.querySelector('[data-pbz="wmode"]');
    if (wb) wb.classList.toggle('on', !!s.width);
    canPanX = rbW > st.w + 1;
    canPanY = rbH > st.h + 1;
    /* 图比窗口大 = 可以拖 = 把页面滚动让出来（否则拖图会变成滚页面）；
       反之纵向滑动留给页面滚动，我们只认横向翻页 */
    root.style.touchAction = (canPanX || canPanY) ? 'none' : 'pan-y';
    paintPage();
  }

  function load(reset) {
    natW = 0; natH = 0;
    if (reset) { s.z = 1; s.x = 0; s.y = 0; s.rot = 0; }
    root.classList.add('loading');
    if (msg) { msg.style.display = 'flex'; msg.textContent = '照片读取中…'; }
    img.style.width = ''; img.style.height = ''; img.style.transform = '';
    let fired = false;
    const done = () => {
      if (fired) return;
      fired = true;
      natW = img.naturalWidth || 0;
      natH = img.naturalHeight || 0;
      if (!natW || !natH) {      // 原图丢了也别给个黑框，说清怎么办
        root.classList.add('bad');
        root.classList.remove('loading');
        if (msg) msg.textContent = '这一页原图打不开了（文件可能已丢失）。可以点下面的「编辑」重新拍一张。';
        return;
      }
      root.classList.remove('loading', 'bad');
      /* 用户没手动选过模式 → 长图自动「按宽度铺满」，免得塞成一条看不清的细缝 */
      if (!s.manual) s.width = (natH / natW) > PB_TALL;
      if (msg) msg.style.display = 'none';
      draw();
      if (natW < V_LOWRES && !root.querySelector('.pbhint')) {
        const d = document.createElement('div');
        d.className = 'pbhint';
        d.textContent = '这张是早期压缩版（宽 ' + natW + 'px），放到很大还是会糊';
        root.appendChild(d);
      }
    };
    img.onload = done;
    img.onerror = done;
    img.src = list[s.i];
    paintPage();      // 页码/圆点跟图片加载成不成功无关，立刻更新，别等 onload
    if (img.complete && img.naturalWidth) done();   // 命中缓存时 load 可能已经错过了
  }

  /* 以窗口内某点为锚缩放：该点下的画面保持不动（ax/ay 相对窗口中心） */
  function zoomAt(factor, ax, ay) {
    const old = s.z;
    const z = Math.max(PB_MIN, Math.min(PB_MAX, old * factor));
    if (Math.abs(z - old) < 1e-6) return;
    const k = z / old;
    s.x = ax - (ax - s.x) * k;
    s.y = ay - (ay - s.y) * k;
    s.z = z;
    draw();
  }

  function go(d) {
    if (list.length < 2) return;
    s.i = (s.i + d + list.length) % list.length;
    load(true);
  }

  /* —— 工具条 / 翻页按钮 —— */
  root.querySelectorAll('[data-pbz]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const a = b.dataset.pbz;
    if (a === '-') zoomAt(1 / 1.5, 0, 0);
    else if (a === '+') zoomAt(1.5, 0, 0);
    else if (a === 'fit') { s.z = 1; s.x = 0; s.y = 0; s.rot = 0; draw(); }
    /* 切换「整图 / 按宽度」：换模式等于换个基准，缩放和旋转都归位 */
    else if (a === 'wmode') {
      s.width = !s.width; s.manual = true;
      s.z = 1; s.x = 0; s.y = 0; s.rot = 0; draw();
    }
    else if (a === 'rot') { s.rot = (s.rot + 90) % 360; s.x = 0; s.y = 0; draw(); }
    else if (a === 'full') zoomImage(list[s.i]);
  });
  root.querySelectorAll('[data-pbgo]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    go(Number(b.dataset.pbgo));
  });

  /* —— 触摸/鼠标手势 —— */
  const pts = new Map();
  let drag = null, pinch = null, swipe = null, lastTap = 0, lastXY = null;
  const localPt = (ev) => {
    const r = root.getBoundingClientRect();
    return { x: ev.clientX - (r.left + r.width / 2), y: ev.clientY - (r.top + r.height / 2) };
  };

  root.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest && ev.target.closest('button')) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    try { root.setPointerCapture(ev.pointerId); } catch (e) {}
    const p = localPt(ev);
    pts.set(ev.pointerId, p);
    if (pts.size === 1) {
      drag = { x: p.x, y: p.y, sx: s.x, sy: s.y, moved: 0, mode: null };
      pinch = null;
      swipe = { x0: p.x, y0: p.y, fired: false };
      root.classList.add('panning');
    } else if (pts.size === 2) {
      const a = Array.from(pts.values());
      drag = null; swipe = null;
      pinch = {
        d: Math.max(1, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)),
        mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2,
        z: s.z, x: s.x, y: s.y
      };
    }
  });

  root.addEventListener('pointermove', (ev) => {
    if (!pts.has(ev.pointerId)) return;
    const p = localPt(ev);
    pts.set(ev.pointerId, p);
    if (pts.size === 2 && pinch) {
      const a = Array.from(pts.values());
      const d = Math.max(1, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y));
      const z = Math.max(PB_MIN, Math.min(PB_MAX, pinch.z * d / pinch.d));
      const k = z / pinch.z;
      s.x = (a[0].x + a[1].x) / 2 - (pinch.mx - pinch.x) * k;
      s.y = (a[0].y + a[1].y) / 2 - (pinch.my - pinch.y) * k;
      s.z = z;
      draw();
      ev.preventDefault();
    } else if (pts.size === 1 && drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      /* 手势先判方向、再锁定用途，别让「想翻页」变成「拖图」或者反过来：
         横向没有可拖的余量 + 多页 → 翻页；有可拖余量 → 拖图（横竖各自判断）；
         其余交给页面自己滚动。 */
      if (!drag.mode && drag.moved > 8) {
        const ax = Math.abs(dx), ay = Math.abs(dy), horiz = ax > ay;
        if (horiz && !canPanX && list.length > 1) drag.mode = 'flip';
        else if (horiz && canPanX) drag.mode = 'pan';
        else if (!horiz && canPanY) drag.mode = 'pan';
        else drag.mode = 'none';
      }
      if (drag.mode === 'pan') {           // 图比窗口大 → 拖图看局部
        s.x = drag.sx + dx; s.y = drag.sy + dy;
        draw();
        ev.preventDefault();
      } else if (drag.mode === 'flip' && swipe && !swipe.fired) {
        const tx = p.x - swipe.x0, ty = p.y - swipe.y0;
        if (Math.abs(tx) > 46 && Math.abs(tx) > Math.abs(ty) * 1.6) {
          swipe.fired = true;
          go(tx < 0 ? 1 : -1);             // 往左滑 = 看下一张
        }
      }
    }
  }, { passive: false });

  const drop = (ev) => {
    if (!pts.has(ev.pointerId)) return;
    const p = localPt(ev);
    pts.delete(ev.pointerId);
    if (pts.size === 1) {                  // 还留着一根手指：重新作为拖动基准
      const only = Array.from(pts.values())[0];
      drag = { x: only.x, y: only.y, sx: s.x, sy: s.y, moved: 99,
               mode: (canPanX || canPanY) ? 'pan' : 'none' };
      pinch = null; swipe = null;
      return;
    }
    root.classList.remove('panning');
    pinch = null;
    const dragged = !drag || drag.moved > 8;
    drag = null; swipe = null;
    if (dragged) return;                   // 拖过就不算「点一下」
    const now = Date.now();
    const near = lastXY && Math.hypot(p.x - lastXY.x, p.y - lastXY.y) < 44;
    if (now - lastTap < 330 && near) {      // 双击：在「适应」和放大之间切换
      lastTap = 0; lastXY = null;
      if (s.z > 1.2) { s.z = 1; s.x = 0; s.y = 0; }
      else { s.z = PB_DBL; s.x = p.x * (1 - PB_DBL); s.y = p.y * (1 - PB_DBL); }
      draw();
      return;
    }
    lastTap = now; lastXY = p;
  };
  root.addEventListener('pointerup', drop);
  root.addEventListener('pointercancel', drop);

  root.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = root.getBoundingClientRect();
    zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12,
      ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2));
  }, { passive: false });

  /* 转屏 / 改窗口大小：所有还活着的原图窗口都要重算一遍（只挂一次监听） */
  PB_DRAW[key] = draw;
  if (!bindPhotoBox._wired) {
    bindPhotoBox._wired = true;
    const reflow = () => Object.keys(PB_DRAW).forEach(k => {
      if (document.getElementById(k)) { try { PB_DRAW[k](); } catch (e) {} }
    });
    window.addEventListener('resize', reflow);
    window.addEventListener('orientationchange', () => setTimeout(reflow, 260));
  }

  load(false);      // 状态是保留的，所以这里不 reset
}

/* ---------------- 视图：复习模式 ---------------- */
function renderReview() {

  if (!S.rev || !S.rev.running) {
    const f = (S.rev && S.rev.filter) || loadRevFilter();
    /* 老状态里没有复习次数这几个字段，补上默认值（内存里的 filter 对象是跨次保留的） */
    if (f.rc === undefined) f.rc = '';
    if (f.rcMin === undefined) f.rcMin = '';
    if (f.rcMax === undefined) f.rcMax = '';
    if (f.dateMode === undefined) f.dateMode = '';
    if (f.dateFrom === undefined) f.dateFrom = '';
    if (f.dateTo === undefined) f.dateTo = '';
    S.rev = {
      filter: f, running: false, queue: [], idx: 0, show: false, showImg: false, onlyWrong: false,
      right: 0, wrong: 0, done: 0, tagOpen: (S.rev && S.rev.tagOpen) || false
    };
    const fTags = f.tags || [];
    let h = '<div class="pad">'
      + '<div id="dueHero"></div>'
      + '<div class="sec"><h3>自定义复习</h3>'
      + '<div class="fld"><label>学科</label><div class="seg" id="rvSub">'

      + '</div></div>'
      + '<div class="fld"><label>抽题数量</label><div class="seg" id="rvCount">'
      + [5, 10, 20, 0].map(n => '<button data-val="' + n + '" class="' + (f.count === n ? 'on' : '') + '">' + (n === 0 ? '全部' : n + ' 题') + '</button>').join('')
      + '</div></div>'
      + '<div class="fld"><label>抽题顺序</label><div class="seg" id="rvStrategy">'

         复习才有的放矢 —— 例如今天专门治「计算粗心」 */
      + '<div class="fld"><label>只练这些错因（可多选，不选 = 全部）</label>'
      + '<button class="btn ghost block small" id="rvTagBtn">'
      + (fTags.length ? '已选 ' + fTags.length + ' 个错因标签 · 点这里改' : '🏷️ 选择错因标签')
      + '</button>'
      + (S.rev.tagOpen ? '<div class="mt8">' + tagPickerBox('rev', fTags) + '</div>' : '')
      + '</div>'
      /* 按「练过几次」抽题：刚入库还没练过的、练过两遍还不熟的，可以分开练 */
      + '<div class="fld"><label>复习次数（这道题练过几次）</label>'
      + rcFilterHTML('rv', f)
      + '<div class="tiny muted mt8" id="rvRcHint">' + esc(rvRcHint()) + '</div>'
      + '</div>'

      + '<div class="fld"><label>按录入日期（错题是什么时候记的）</label>'
      + '<div class="seg" id="rvDateSeg">'
      + [['', '不限'], ['7d', '最近 7 天'], ['30d', '最近 30 天'], ['range', '自定义区间']]
        .map(x => '<button data-val="' + x[0] + '" class="' + (f.dateMode === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('')
      + '</div>'
      + (f.dateMode === 'range'
        ? '<div class="rcrange"><span>从</span><input type="date" id="rvDateFrom" value="' + esc(f.dateFrom) + '">'
          + '<span>到</span><input type="date" id="rvDateTo" value="' + esc(f.dateTo) + '"></div>'
        : '')
      + '</div>'
      + '<button class="btn block lg mt16" id="rvStart">开始复习</button></div>'
      + '<div id="rvStat" class="pad"></div></div>';
    $('#main').innerHTML = h;
    bindSeg('rvSub', v => { S.rev.filter.subject = v; });
    bindSeg('rvCount', v => { S.rev.filter.count = Number(v); });
    bindSeg('rvStrategy', v => { S.rev.filter.strategy = v; });
    const rtb = $('#rvTagBtn');
    if (rtb) rtb.onclick = () => { S.rev.tagOpen = !S.rev.tagOpen; renderReview(); };
    bindTagPicker('rev', () => S.rev.filter.tags || [], v => { S.rev.filter.tags = v; },
      () => { const y = window.scrollY; renderReview(); window.scrollTo(0, y); });
    bindRcFilter('rv', () => S.rev.filter, () => {
      /* 只刷新那行说明，不整页重画 —— 重画会把刚点过的输入框顶掉、页面还会跳回顶部 */
      const hint = $('#rvRcHint');
      if (hint) hint.textContent = rvRcHint();
    });
    /* 录入日期档位：选「自定义区间」才出现起止两个日期框 */
    bindSeg('rvDateSeg', v => {
      S.rev.filter.dateMode = v;
      if (v !== 'range') { S.rev.filter.dateFrom = ''; S.rev.filter.dateTo = ''; }
      renderReview();
    });
    $('#rvStart').onclick = () => startReview();
    showReviewStat();
    return;
  }
  renderReviewCard();
}

function bindSeg(id, cb, rerender) {
  const seg = $('#' + id);
  if (!seg) return;
  seg.onclick = (ev) => {
    const b = ev.target.closest('button[data-val]');
    if (!b) return;
    $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    cb(b.dataset.val);
    if (rerender) renderReview();
  };
}

/** 复习页那行说明：选中的复习次数档位在全库有多少题（先按全库给个量级，开始复习时再叠加其它条件） */
function rvRcHint() {
  const f = (S.rev && S.rev.filter) || {};
  const st = S.stats || {};
  const dist = st.by_review_count || {};
  if (f.rc) {
    const n = f.rc === '3+' ? dist['3'] : dist[f.rc];
    return '这个档位全库 ' + (n || 0) + ' / ' + (st.total || 0)
      + ' 题；开始复习时还会叠加学科、错因标签等条件。';
  }
  const lo = String(f.rcMin == null ? '' : f.rcMin).trim();
  const hi = String(f.rcMax == null ? '' : f.rcMax).trim();
  if (lo || hi) {
    return '按区间精确筛：' + rcLabel(f) + '。只填「最少」就是「N 次以上」，只填「最多」就是「N 次以内」。';
  }
  return '做对一次算「练过 1 次」；刚录入还没练过的题是 0 次。留空 = 不按次数筛。';
}

/** 今天该练几题 —— 复习页最上面那张卡，也是这个功能的入口 */

async function startReview(opts) {
  opts = opts || {};
  const f = S.rev.filter;
  const dueOnly = !!opts.dueOnly;
  const strategy = dueOnly ? 'due' : (f.strategy || 'due');

  const q = { subject: f.subject, unmastered: 1 };
  if (dueOnly) q.due = 1;                 // 只要今天到期的
  if (strategy === 'due') q.sort = 'due'; // 交给后端按到期时间排序
  /* 按错因专练：只抽带这些标签的题（多个标签 = 命中任意一个就算） */
  if (f.tags && f.tags.length) q.tags = f.tags;
  /* 按复习次数（练过几次）筛：档位 rc 或精确区间 rc_min/rc_max */
  Object.assign(q, rcParams(f));
  const items = await Store.list(q);
  /* 按录入日期筛：快捷档（最近 7 / 30 天）或自定义区间，在已有结果上过滤 ——
     created_at 是 "YYYY-MM-DD HH:MM:SS" 格式，字符串比较直接成立；两端都含（闭区间） */
  let dFrom = '', dTo = '';
  if (f.dateMode === '7d') {
    const t = new Date(Date.now() - 7 * 86400000);
    dFrom = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  } else if (f.dateMode === '30d') {
    const t = new Date(Date.now() - 30 * 86400000);
    dFrom = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  } else if (f.dateMode === 'range') {
    dFrom = String(f.dateFrom || '').trim();
    dTo = String(f.dateTo || '').trim();
    /* 上下限填反了自动换过来，不给空结果 */
    if (dFrom && dTo && dFrom > dTo) { const tmp = dFrom; dFrom = dTo; dTo = tmp; }
  }
  const dateHit = (m) => {
    if (!dFrom && !dTo) return true;
    const d = String(m.created_at || '').slice(0, 10);
    if (!d) return !dFrom && !dTo ? true : false;
    return (!dFrom || d >= dFrom) && (!dTo || d <= dTo);
  };
  const filtered = (f.dateMode && dFrom + dTo) ? items.filter(dateHit) : items;
  if (!filtered.length) {
    if (f.dateMode && (dFrom || dTo)) toast('这个日期范围内没有需要复习的错题，把范围放宽试试');
    else if (rcLabel(f)) toast('这个复习次数条件下没有题，换个档位或把区间放宽试试');
    else if (dueOnly) toast('今天没有到期的题，休息一下吧 🎉');
    else toast('这个科目下没有需要复习的错题');
    return;
  }

  let arr = filtered.slice();
  if (strategy === 'due') {
    // 过期越久越靠前；同一天的按掌握度低的先来
    arr.sort((a, b) => (scheduleOf(a).next_due_at - scheduleOf(b).next_due_at)
      || (a.mastery - b.mastery) || a.id - b.id);
  } else if (strategy === 'mastery') {
    arr.sort((a, b) => (a.mastery - b.mastery) || ((a.review_count || 0) - (b.review_count || 0)) || Math.random() - .5);
  } else {
    arr.sort(() => Math.random() - .5);
  }
  if (f.count) arr = arr.slice(0, f.count);

  S.rev = Object.assign(S.rev, {
    running: true, queue: arr, idx: 0, show: false, showImg: false, onlyWrong: false,
    right: 0, wrong: 0, done: 0, record: [], dueOnly: dueOnly
  });
  saveRevFilter(f);   // 这套筛选真的抽出了题 → 记住，下次进复习页直接带出来
  renderReviewCard();
}

/* ---------------- 复习页「🔊 读题」（Web Speech API，浏览器自带、零依赖） ----------------
   只读页面上展示的题面（干净原题优先、否则识别题面），不含答案 —— 不会剧透。
   iOS 要求语音必须由用户手势触发，按钮点击本身就是手势，满足。 */
function speakSupported() { return typeof window !== 'undefined' && 'speechSynthesis' in window; }
function speakStop() {
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}
function speakQuestion(text, btn) {
  if (!speakSupported()) return;
  /* 播放中再点一次 = 停止 */
  if (btn && btn.dataset.on === '1') {
    speakStop();
    btn.dataset.on = ''; btn.textContent = '🔊 读题';
    return;
  }
  speakStop();
  const body = String(text || '').slice(0, 2000);
  const u = new SpeechSynthesisUtterance(body);
  /* 英语题用英文语音念（中文语音念英文全是怪音）。
     判定按「主体语言」：ASCII 字母占比过半就当英文题 —— 英语卷里混着的中文题头
     （如「六、根据首字母填空」）不改变主体是英文的事实。 */
  const letters = (body.match(/[A-Za-z]/g) || []).length;
  const hanzi = (body.match(/[\u4e00-\u9fff]/g) || []).length;
  const en = letters > hanzi * 2 && letters > 20;
  u.lang = en ? 'en-US' : 'zh-CN';
  u.rate = en ? 0.9 : 0.95;         // 稍慢一点，低年级孩子跟得上
  const done = () => { if (btn) { btn.dataset.on = ''; btn.textContent = '🔊 读题'; } };
  u.onend = done; u.onerror = done;
  if (btn) { btn.dataset.on = '1'; btn.textContent = '⏹ 停止'; }
  try { speechSynthesis.speak(u); } catch (e) { done(); }
}

function renderReviewCard() {
  const r = S.rev;
  if (r.idx >= r.queue.length) { renderReviewDone(); return; }
  const m = r.queue[r.idx];
  speakStop();    // 翻题时把上一题的朗读停掉，别串音
  const pct = Math.round(r.idx / r.queue.length * 100);
  setTitle('复习中', (r.idx + 1) + ' / ' + r.queue.length);
  let h = '<div class="progress mt12"><i style="width:' + pct + '%"></i></div>';
  /* ★ 错处定位：这道题上次错的是哪几个小题 —— 只加粗那几处，别在会的题上耗时间 */
  const wq = wrongItemsOf(m);
  const clean = String(m.clean_text || '').trim();
  const qsrc = clean || String(m.question_text || '');
  const qr = renderWrongMarked(qsrc, wq.items, 'q');
  h += '<div class="review-card mt12' + (r.onlyWrong ? ' onlywrong' : '') + '">';
  if (m.question_image) {
    /* 照片里带着孩子上次写的答案 —— 答案没揭晓之前不展示，否则复习就是抄答案。
       有了干净原题以后就不必再遮：题目本身就是无答案的，照片只留个入口备查。 */
    if (r.show || r.showImg) {
      h += photoBoxHTML(splitImgs(m.question_image), pbKeyR(m));
    } else if (clean) {
      h += '<div class="tiny" style="text-align:right">'
        + '<button class="btn ghost small" id="rvShowImg">📷 看原图</button></div>';
    } else {
      h += '<div class="qimg-mask"><div class="t">📷 题目照片先收起来了</div>'
        + '<div class="tiny mt8">照片里有孩子上次的作答，先让孩子自己做一遍</div>'
        + '<button class="btn gray mt12" id="rvShowImg" style="padding:9px 14px;font-size:14px">还是想看图？点这里</button></div>';
    }
  }
  const sch = scheduleOf(m);
  h += '<div class="q"><div class="row wrap" style="gap:6px;margin-bottom:8px">'
    + '<span class="badge">' + esc(m.subject || '') + '</span>'
    + (m.knowledge_point ? '<span class="badge k">' + esc(String(m.knowledge_point).slice(0, 24)) + '</span>' : '')
    /* 上次为什么错，复习时先提醒一下 */
    + tagsOf(m).slice(0, 3).map(t => '<span class="badge k">' + esc(t) + '</span>').join('')
    + '<span class="badge k">复习 ' + (m.review_count || 0) + ' 次</span>'
    + '<span class="badge ' + (sch.is_due ? 'due' : 'k') + '">' + esc(dueText(sch)) + '</span></div>'
    /* 🔊 读题：浏览器自带的语音合成，低年级孩子认字少也能自己复习。
       读的就是页面上这份题面（干净原题优先），不含答案，不剧透。 */
    + (speakSupported()
      ? '<div style="text-align:right;margin-bottom:4px">'
        + '<button class="btn ghost small" id="rvSpeak">🔊 读题</button></div>'
      : '')
    /* 点明上次错在哪几道小题（编号本身不含答案，给孩子看也不会剧透） */
    + (qr.hits && wq.items.length
      ? '<div class="tiny wqhint">🎯 上次错在：'
        + esc(wq.items.filter(x => x !== '*' && x !== '#last').join('、') || '这道题')
        + '（已加粗）'
        + (qr.hideable
          ? '<button class="btn ghost small" id="rvOnly">'
            + (r.onlyWrong ? '📖 显示全部' : '🎯 只看错的部分') + '</button>'
          : '')
        + '</div>'
      : '')
    + '<div style="white-space:pre-wrap;font-size:16px">'
    + (qr.html || '<span class="faint">（无题目文字，看图片作答）</span>')
    + '</div>'
    + (clean
      ? '<div class="tiny faint mt8">📖 干净原题 · 已去掉手写，不含答案</div>'
      : (m.question_image
        ? '<div class="mt8"><button class="btn ghost small" id="rvClean">📖 提取干净原题（去掉手写）</button></div>'
        : ''))
    + '</div>'
    /* 跳过就放在题面正下方：这道题不需要练（已经会了 / 录重了）时一眼就能看到，不用滚到底。
       旁边两个辅助动作：一看就会的题直接记一次做对；录坏了/重复的题标记删除（攒着集中处理）。 */
    + '<div class="pad" style="padding-top:0">'
    + '<button class="btn skip block" id="rvSkip">⏭ 跳过这题，练下一道</button>'
    + '<div class="row mt8" style="gap:8px">'
    + '<button class="btn ghost grow" id="rvKnown" style="font-size:14px">✓ 一看就会，记一次做对</button>'
    + '<button class="btn ghost grow" id="rvMarkDel" style="font-size:14px;color:var(--bad);border-color:var(--bad-soft)">🗑 标记删除</button>'
    + '</div></div>'
    + '</div>';

  if (!r.show) {
    h += '<div class="pad"><button class="btn block lg" id="rvShow">👀 显示答案</button></div>';
    h += '<div class="pad tiny faint center">先让孩子在本子上做一遍</div>';
  } else {
    h += '<div class="answer"><h3 style="margin:0 0 8px;font-size:14px;color:var(--pri-d)">✅ 正确答案</h3>'
      + '<div style="white-space:pre-wrap">'
      /* 答案里出错的那几项也加粗：题面上没有小题号的题（口算、短文填空）全靠这一条定位 */
      + renderWrongMarked(m.correct_answer || '（未填写）', wq.items, 'a').html
      + '</div></div>';
    if (m.explanation) h += '<div class="answer"><h3 style="margin:0 0 8px;font-size:14px;color:var(--pri-d)">💡 讲解</h3>'
      + '<div style="white-space:pre-wrap">' + fmtMD(m.explanation) + '</div></div>';
    if (m.similar_question) h += '<div class="answer"><h3 style="margin:0 0 8px;font-size:14px;color:var(--pri-d)">🔁 举一反三</h3>'
      + '<div style="white-space:pre-wrap">' + fmtMD(m.similar_question) + '</div></div>';
    h += '<div class="pad"><div class="fld"><label>备注（可选）</label>'
      + '<input type="text" id="rvNote" placeholder="例如：这次是自己做对的"></div></div>';
    h += '<div class="judge"><button class="btn danger" id="rvWrong">✗ 这次还错</button>'
      + '<button class="btn ok" id="rvRight">✓ 这次做对了</button></div>';
  }
  const curM = Math.max(0, Math.min(5, Number(m.mastery || 0)));
  const hint = curM >= 4
    ? '做对 → 掌握度 ' + curM + '→5 已掌握，退出复习池；做错 → 归零，当天重新练'
    : '做对 → 掌握度 ' + curM + '→' + (curM + 1) + '，' + SPACED_INTERVALS[curM + 1] + ' 天后复习；做错 → 归零，当天重新练';
  h += '<div class="pad">'
    + '<div class="tiny faint center">' + esc(hint) + '</div>'
    /* 电脑键盘也能复习：手机上无所谓，桌面陪读时手不用离开键盘 */
    + '<div class="tiny faint center">电脑键盘：空格 显答案 · ← 错 · → 对 · ↑ 跳过</div></div>';
  $('#main').innerHTML = h;

  $$('#main img[data-zoom]').forEach(img => img.onclick = () => zoomImage(img.dataset.zoom));
  if (m.question_image && (r.show || r.showImg)) bindPhotoBox(splitImgs(m.question_image), pbKeyR(m));
  if ($('#rvShowImg')) $('#rvShowImg').onclick = () => { r.showImg = true; renderReviewCard(); };
  if ($('#rvSpeak')) $('#rvSpeak').onclick = (ev) => speakQuestion(qsrc, ev.currentTarget);
  if ($('#rvClean')) $('#rvClean').onclick = async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    b.textContent = '读取照片并提取中…（约 10 秒）';
    try { await saveClean(m); toast('干净原题已提取 ✓'); }
    catch (e) { toast('提取失败：' + e.message, 3800); }
    renderReviewCard();          // 重新画一遍：题目区换成干净原题、遮罩也撤掉
  };
  if ($('#rvShow')) $('#rvShow').onclick = () => { r.show = true; renderReviewCard(); };
  /* 只看错的部分：把答对的小题收起来（原文和大题题干留着），一眼只剩要重点看的那几处 */
  if ($('#rvOnly')) $('#rvOnly').onclick = () => { r.onlyWrong = !r.onlyWrong; renderReviewCard(); };
  if ($('#rvRight')) $('#rvRight').onclick = () => judge(true);
  if ($('#rvWrong')) $('#rvWrong').onclick = () => judge(false);
  $('#rvSkip').onclick = () => { r.idx++; r.show = false; r.showImg = false; r.onlyWrong = false; renderReviewCard(); };
  /* 一看就会：不揭晓答案直接记一次做对 —— 掌握度 +1、按遗忘曲线推后，与判对同账 */
  $('#rvKnown').onclick = async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = '保存中…';
    try {
      const res = await Store.review(m.id, true, '（复习时一看就会，直接记对）');
      r.right++; r.done++;
      (r.record = r.record || []).push({
        id: m.id, text: m.question_text || '', ok: true,
        mastery: res.mastery, label: res.interval_label || '', days: res.interval_days
      });
      toast('已记一次做对 ✓ 掌握度 ' + res.mastery_before + ' → ' + res.mastery);
      r.idx++; r.show = false; r.showImg = false; r.onlyWrong = false;
      renderReviewCard();
      Store.stats().catch(() => {});       // 角标与「今天剩几题」同步减一
    } catch (e) {
      b.disabled = false; b.textContent = '✓ 一看就会，记一次做对';
      toast('保存失败：' + e.message, 3200);
    }
  };
  /* 标记删除：只打标记不真删 —— 攒起来之后去错题本页「集中删除」里统一处理 */
  $('#rvMarkDel').onclick = async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true; b.textContent = '已标记 ✓';
    try {
      await Store.update(m.id, { mark_delete: 1 });
      toast('已标记删除。回错题本页点「🗑 集中删除」统一处理');
      r.idx++; r.show = false; r.showImg = false; r.onlyWrong = false;
      renderReviewCard();
    } catch (e) {
      b.disabled = false; b.textContent = '🗑 标记删除';
      toast('标记失败：' + e.message, 3200);
    }
  };
}

/* 复习卡的键盘操作（桌面陪读）：空格=显答案，←/→=判错/判对，↑=跳过。
   只在复习中生效；焦点在输入框（备注）时让位给正常打字。 */
document.addEventListener('keydown', (ev) => {
  if (S.view !== 'review' || !S.rev || !S.rev.running) return;
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (V.open) return;                     // 大图开着时让位给看图器自己的快捷键
  const r = S.rev, m = r.queue && r.queue[r.idx];
  if (!m) return;
  if (ev.key === ' ') {
    ev.preventDefault();
    if (!$('#rvShow')) return;            // 答案已显示，空格不再做事
    r.show = true; renderReviewCard();
  } else if (ev.key === 'ArrowLeft' && $('#rvWrong')) {
    ev.preventDefault(); judge(false);
  } else if (ev.key === 'ArrowRight' && $('#rvRight')) {
    ev.preventDefault(); judge(true);
  } else if (ev.key === 'ArrowUp' && $('#rvSkip')) {
    ev.preventDefault();
    r.idx++; r.show = false; r.showImg = false; r.onlyWrong = false; renderReviewCard();
  }
});

async function judge(isCorrect) {
  const r = S.rev;
  const m = r.queue[r.idx];
  const note = ($('#rvNote') && $('#rvNote').value || '').trim();
  const btn = isCorrect ? $('#rvRight') : $('#rvWrong');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    const res = await Store.review(m.id, isCorrect, note);
    if (isCorrect) r.right++; else r.wrong++;
    r.done++;
    (r.record = r.record || []).push({
      id: m.id, text: m.question_text || '', ok: isCorrect,
      mastery: res.mastery, label: res.interval_label || '', days: res.interval_days
    });
    toast(isCorrect
      ? '做对 ✓ 掌握度 ' + res.mastery_before + ' → ' + res.mastery + ' · ' + (res.interval_label || '')
      : '做错 ✗ 掌握度归零 · 今天还要再练一遍');
    /* 判题的触感反馈：做对轻轻一震，做错两下重震。手机上有、电脑上没有，静默跳过 */
    try { if (navigator.vibrate) navigator.vibrate(isCorrect ? 20 : [50, 40, 50]); } catch (e) {}
  } catch (e) { toast('保存失败：' + e.message); if (btn) btn.disabled = false; return; }
  r.idx++; r.show = false; r.showImg = false; r.onlyWrong = false;
  renderReviewCard();
  // 每判一题就刷新统计和角标：不然「今天还剩几题」会一直停在开始时的数字。
  // 放在渲染之后且不 await，避免拖慢「下一题」的切换。
  Store.stats().catch(() => {});
}

async function renderReviewDone() {
  const r = S.rev;
  setTitle('复习完成', '');
  const total = r.right + r.wrong;
  const rate = total ? Math.round(r.right / total * 100) : 0;
  /* 情绪化：结算时按正确率给一句表扬/打气，满分有专句，其余池子轮换 */
  const praise = rate >= 100 ? '全对！这一轮满分通过 🏆'
    : rate >= 80 ? ['手感来了，正确率很高！', '稳稳的一轮，继续保持 💪', '错误越来越少，进步看得见 👏'][total % 3]
    : rate >= 50 ? '对了一大半，错的几道重点看看，明天再来一轮 💪'
    : '错得多不怕——现在弄懂，考试就是白捡分 📖';
  let h = '<div class="pad center mt16"><div style="font-size:48px">' + (rate >= 80 ? '🎉' : rate >= 50 ? '💪' : '📖') + '</div>'
    + '<div class="mt8" style="font-size:18px;font-weight:700">本轮完成</div>'
    + '<div class="tiny mt4" style="color:var(--muted)">' + praise + '</div>'
    + '<div class="muted mt8">共 ' + total + ' 题 · 做对 ' + r.right + ' 题 · 做错 ' + r.wrong + ' 题 · 正确率 ' + rate + '%</div>'
    + '<div class="row mt24" style="gap:10px;justify-content:center">'
    + '<button class="btn ghost" id="rvAgain">再抽一轮</button>'
    + '<button class="btn" id="rvBack">回到错题</button></div></div>'
    + '<div id="rvNext" class="pad"></div>';
  if (r.record && r.record.length) {
    h += '<div class="sec"><h3>本轮记录</h3>' + r.record.map(x =>
      '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)">'
      + '<span>' + (x.ok ? '✅' : '❌') + '</span><span class="grow tiny ellipsis">'
      + esc((x.text || '').slice(0, 28) || '（无文字）') + '</span>'
      + '<span class="tiny faint">' + esc(x.ok
        ? ('掌握度 ' + x.mastery + (x.label ? ' · ' + x.label : ''))
        : '掌握度归零') + '</span></div>').join('') + '</div>';
  }
  if (S.view !== 'review') return;        // 判完最后一题后用户可能已经点走了
  $('#main').innerHTML = h;
  $('#rvAgain').onclick = () => { S.rev.running = false; renderReview(); };
  $('#rvBack').onclick = () => { S.rev.running = false; go('list', null, true); };

  // 异步补上「接下来」：还有没有到期的，没有的话下一批什么时候来
  try {
    const st = await Store.stats();
    if (S.view !== 'review') return;
    S.stats = st;
    const box = $('#rvNext');
    if (box) {
      const due = st.due_count || 0;
      box.innerHTML = '<div class="sec" style="margin:0"><h3>⏭ 接下来</h3>'
        + (due > 0
          ? '<div class="tiny muted">今天还有 <b>' + due + '</b> 题到期，歇一会儿可以再来一轮。</div>'
          : '<div class="tiny muted">今天的到期题都练完了 🎉'
            + (st.next_due_at ? ' 下一批 ' + esc(fmtDate(st.next_due_at)) + '。' : '') + '</div>')
        + '</div>';
    }
  } catch (e) { /* 统计拿不到就不显示，不影响结算 */ }
}

/* ---------------- 视图：统计 ---------------- */
async function renderStats() {
  setTitle('统计', '');
  /* 接口没回来前先给骨架占位：三个数字卡 + 几行条的形状，比一行「统计中…」稳当 */
  $('#main').innerHTML = '<div class="pad"><div class="row" style="gap:10px">'
    + '<div class="skel card grow" style="margin:0"></div>'.repeat(3) + '</div>'
    + '<div class="sec" style="margin-top:12px">' + '<div class="skel tx"></div>'.repeat(5) + '</div></div>';
  let st;
  try {
    st = await Store.stats();
  } catch (e) {
    if (S.view !== 'stats') return;
    if (Store.mode === 'server') { $('#main').innerHTML = errorStateHTML('统计'); return; }
    throw e;
  }
  S.stats = st;
  let h = '<div class="pad"><div class="row" style="gap:10px">'
    + statBox('今天待复习', st.due_count || 0) + statBox('错题总数', st.total)
    + statBox('已掌握', st.mastered) + '</div>'
    + '<div class="row mt12" style="gap:10px">' + statBox('待复习', st.total - st.mastered)
    + statBox('从未复习', st.fresh) + statBox('累计复习', st.review_count) + '</div>'
    + '<div class="tiny muted mt8">近 7 天新增 ' + st.last7 + ' 题'
    + (st.next_due_at ? ' · 下一批复习 ' + esc(fmtDate(st.next_due_at)) : '') + '</div>'
    + weekSummaryHTML(st.week) + '</div>';
  const bm = st.by_mastery || {};
  h += barSection('掌握度分布（0 完全不会 ～ 5 已掌握）',
    [0, 1, 2, 3, 4, 5].map(k => ({ label: k + (k === 5 ? ' 已掌握' : ''), n: bm[k] || bm[String(k)] || 0 })));
  const brc = st.by_review_count || {};
  h += barSection('复习次数分布（练过几次；4 次以上并入 3 次以上）',
    [['0', '没练过'], ['1', '1 次'], ['2', '2 次'], ['3', '3 次以上']]
      .map(x => ({ label: x[1], n: brc[x[0]] || 0 })));
  h += weakKpHTML(st.weak_kp);
  h += barSection('各科错题', st.by_subject.map(x => ({ label: x.subject, n: x.n })));
  h += barSection('错因标签 TOP（一道题可以贴多个标签）',
    (st.by_tag || []).slice(0, 12).map(x => ({ label: x.tag, n: x.n })));
  h += barSection('主错因分布', st.by_reason.map(x => ({ label: x.reason, n: x.n })));
  h += barSection('高频知识点 TOP', st.by_kp.slice(0, 10).map(x => ({ label: x.kp, n: x.n })));
  if (S.view !== 'stats') return;         // 统计要等一次接口，期间可能已经切页了
  $('#main').innerHTML = h;
}
function statBox(label, n) {
  return '<div class="card grow center" style="padding:12px 6px">'
    + '<div style="font-size:22px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums">' + (n || 0) + '</div>'
    + '<div class="tiny muted">' + esc(label) + '</div></div>';
}

/** 本周小结：练了多少、对了多少、坚持了几天，再给一句人话点评 */
function weekSummaryHTML(wk) {
  if (!wk) return '';
  return '<div class="mt16" style="border-top:1px solid var(--line);padding-top:12px">'
    + '<div class="tiny muted" style="margin-bottom:8px">📅 本周（近 7 天）</div>'
    + '<div class="row wrap" style="gap:8px">'
    + '<span class="chip">复习 ' + (wk.reviewed || 0) + ' 次</span>'
    + '<span class="chip">正确率 ' + (wk.accuracy || 0) + '%</span>'
    + '<span class="chip">新收录 ' + (wk.new || 0) + ' 题</span>'
    + '<span class="chip">练了 ' + (wk.active_days || 0) + ' 天</span></div>'
    + '<div class="tiny muted mt8">' + esc(weekAdvice(wk)) + '</div></div>';
}

function weekAdvice(wk) {
  if (!wk || !wk.reviewed) return '本周还没复习过，从「今天该复习」开始吧。';
  if ((wk.active_days || 0) >= 5) return '一周练了 ' + wk.active_days + ' 天，坚持得不错。';
  if ((wk.accuracy || 0) >= 80) return '正确率挺高，说明间隔拉长也没忘，继续保持。';
  if ((wk.accuracy || 0) < 50) return '错的偏多，建议降低每日题量、把讲解再看一遍。';
  return '建议每天固定抽十分钟，比一次练很久更管用。';
}

/** 最该补的知识点：未掌握的题里出现最多、平均掌握度最低的 */
function weakKpHTML(list) {
  if (!list || !list.length) return '';
  return '<div class="sec"><h3>🎯 最该补的知识点</h3>'
    + list.map(x => '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)">'
      + '<span class="grow">' + esc(x.kp) + '</span>'
      + '<span class="tiny faint">' + x.n + ' 题 · 平均掌握度 ' + x.avg_mastery + '</span></div>').join('')
    + '<div class="tiny muted mt8">按「错的题数多、掌握度低」排的，建议优先补这几个。</div></div>';
}
function barSection(title, rows) {
  rows = (rows || []).filter(r => r.n > 0);
  if (!rows.length) return '';
  const max = Math.max.apply(null, rows.map(r => r.n)) || 1;
  return '<div class="sec"><h3>' + esc(title) + '</h3>'
    + rows.map(r => '<div style="margin-bottom:8px">'
      + '<div class="row tiny"><span class="grow">' + esc(r.label) + '</span><span class="faint">' + r.n + '</span></div>'
      + '<div style="height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:3px">'
      + '<i style="display:block;height:100%;width:' + Math.round(r.n / max * 100) + '%;background:linear-gradient(90deg,#2f6bed,#54a0ff)"></i>'
      + '</div></div>').join('') + '</div>';
}

function clProps() { return { btn: $('#dtCleanAll'), stop: $('#dtCleanStop'), prog: $('#clProg') }; }

/** 数一遍：多少题有原图、多少题已经有干净原题 */
async function cleanStats() {
  const items = await Store.list({});
  const withImg = items.filter(m => splitImgs(m.question_image).length);
  const done = withImg.filter(m => String(m.clean_text || '').trim());
  return { total: items.length, withImg: withImg.length, done: done.length,
    todo: withImg.length - done.length, items: items };
}

/** 批量提取：串行跑，跑一道存一道；随时能停，停之前已经提取好的都留着。 */
async function runCleanBatch() {
  if (S.cleanBusy) { toast('正在批量提取中，请稍候'); return; }
  if (!cleanSupported()) {                       // 旧后端：还没确认就先拦住，别让人白点一趟
    toast(cleanUnsupportedError().message, 5000);
    return;
  }
  S.cleanBusy = true;
  S.cleanStop = false;
  let todo = [];
  try {
    const all = await Store.list({});
    todo = all.filter(m => splitImgs(m.question_image).length && !String(m.clean_text || '').trim());
  } catch (e) {
    S.cleanBusy = false;
    toast('读取错题列表失败：' + e.message, 3600);
    return;
  }
  if (!todo.length) { S.cleanBusy = false; toast('带原图的题都已经有干净原题了 ✓'); return; }
  const mins = Math.max(1, Math.round(todo.length * 12 / 60));
  if (!confirm('要为 ' + todo.length + ' 道题提取干净原题吗？\n\n'
    + '每道题要调用一次大模型（按量计费），大约需要 ' + mins + ' 分钟。\n'
    + '过程中可以点「停止」，已经提取好的会保留。')) {
    S.cleanBusy = false;
    return;
  }
  const p = clProps();
  if (p.stop) p.stop.style.display = '';
  let ok = 0, fail = 0, firstErr = '';
  for (let i = 0; i < todo.length; i++) {
    if (S.cleanStop) break;
    if (p.prog) p.prog.textContent = '正在处理 ' + (i + 1) + ' / ' + todo.length
      + ' …（成功 ' + ok + '，失败 ' + fail + '）';
    try { await saveClean(todo[i]); ok++; }
    catch (e) {
      /* 后端版本不对属于「整批都做不了」，立刻收工，不要 86 道挨个失败 */
      if (e && e.stopCleanBatch) { S.cleanStop = true; fail++; if (!firstErr) firstErr = e.message; break; }
      fail++; if (!firstErr) firstErr = e.message;
    }
  }
  S.cleanBusy = false;
  S.cleanStop = false;
  toast('批量提取结束：成功 ' + ok + ' 道，失败 ' + fail + ' 道'
    + (firstErr ? '（例：' + firstErr + '）' : ''), 4600);
  renderSettings();
}

/* ---------------- 打印错题 ----------------
   打印通常是让孩子重做，直接印出「答案 + 讲解」就失去意义了 —— 所以先选版式：
   孩子版只印题号 / 学科 / 题干 / 题图（绝不印答案、讲解、对错判定），行距加大留手写空间；
   家长版 = 原来的完整版。学科可筛，不用一次把四科都打出来。 */
function printSheet() {
  const old = document.getElementById('printSheetWrap');
  if (old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'printSheetWrap';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:85;background:rgba(8,13,20,.55);'
    + 'display:flex;align-items:flex-end;justify-content:center;padding:14px';
  wrap.innerHTML = '<div class="sheet">'
    + '<h3>🖨️ 打印错题</h3>'
    + '<div class="fld"><label>版式</label><div class="seg" id="prMode">'
    + '<button data-v="kid" class="on">孩子版 · 只印题目</button>'
    + '<button data-v="parent">家长版 · 带答案讲解</button></div></div>'
    + '<div class="fld"><label>学科</label><div class="seg" id="prSub">'
    + ['全部'].concat(SUBJECTS).map((s, i) =>
        '<button data-v="' + esc(s) + '"' + (i ? '' : ' class="on"') + '>' + esc(s) + '</button>').join('')
    + '</div></div>'
    + '<div class="row" style="gap:10px;margin-top:6px">'
    + '<button class="btn grow" id="prGo">开始打印</button>'
    + '<button class="btn gray" id="prCancel">取消</button></div>'
    + '</div>';
  document.body.appendChild(wrap);
  wrap.onclick = (ev) => { if (ev.target === wrap) wrap.remove(); };
  $$('#prMode button, #prSub button').forEach(b => b.onclick = () => {
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#prCancel').onclick = () => wrap.remove();
  $('#prGo').onclick = () => {
    const mode = $('#prMode button.on').dataset.v;
    const sub = $('#prSub button.on').dataset.v;
    wrap.remove();
    printMistakes(mode, sub);
  };
}

async function printMistakes(mode, subject) {
  const kid = mode !== 'parent';
  const items = (await Store.list({})).filter(m =>
    !subject || subject === '全部' || m.subject === subject);
  if (!items.length) { toast('这个条件下还没有错题'); return; }
  const w = window.open('', '_blank');
  const html = '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">'
    + '<title>错题打印 · ' + (kid ? '孩子版' : '家长版') + '</title>'
    + '<style>body{font-family:"Microsoft YaHei",sans-serif;padding:18px;line-height:1.6}'
    + 'h1{font-size:20px}.item{border-bottom:1px dashed #bbb;padding:12px 0;page-break-inside:avoid}'
    + (kid
      ? 'img{display:block;width:88%;margin:10px auto;border:1px solid #ddd}'   /* 孩子版：题图放大独占一行，方便照着做 */
      : 'img{max-width:44%;float:right;margin-left:12px;border:1px solid #ddd}')
    + '.tag{font-size:12px;color:#555}.q{font-weight:600;margin:4px 0'
    + (kid ? ';white-space:pre-wrap;line-height:2.1' : '')                     /* 行距加大，留着写答案 */
    + '}</style></head><body>'
    + '<h1>错题打印 · ' + new Date().toLocaleDateString('zh-CN') + '（共 ' + items.length + ' 题）</h1>'
    + items.map((m, i) => '<div class="item">'
      + (m.question_image ? splitImgs(m.question_image).map(u => '<img src="' + esc(u) + '">').join('') : '')
      + '<div class="tag">#' + (i + 1) + ' 【' + esc(m.subject) + '】' + esc(m.chapter || '') + ' ' + esc(m.knowledge_point || '') + '</div>'
      + '<div class="q">' + esc(cleanOrText(m)) + '</div>'
      + (kid ? '' :   /* 孩子版：答案、讲解一律不印（对错判定本来就不印） */
        '<div>答案：' + esc(m.correct_answer || '') + '</div>'
        + '<div class="tag">讲解：' + esc(m.explanation || '') + '</div>')
      + '</div>').join('')
    + '</body></html>';
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 500);
}

/* ---------------- 图片选择与启动 ---------------- */
function bindPickers() {
  const onPick = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    if (!S.cap) S.cap = newCap();
    if (S.cap.busy) { toast('正在识别中，请等识别完成'); return; }
    toast('处理图片中…', 1200);
    try {
      const o = imgSaveOpts();
      const url = await compressImage(file, o.maxSide, o.quality);
      S.cap.photos = (S.cap.photos && S.cap.photos.length) ? S.cap.photos : [];
      if (S.cap.photos.length >= 6) { toast('最多 6 张（整张卷子正反面足够了）', 3000); return; }
      S.cap.photos.push(url);
      S.cap.image = S.cap.photos[0];
      S.cap.aiDone = false;
      go('capture', null, true);   // openCapture 不会再动 S.cap，照片能活下来
    } catch (e) { toast('图片处理失败：' + e.message); }
  };
  $('#camInput').onchange = onPick;
  $('#libInput').onchange = onPick;
  /* 听力音频：不走 compressImage，原样读进来 */
  $('#audioInput').onchange = (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';               // 清空以便重复选同一个文件
    if (!file) return;
    if (!S.cap) S.cap = newCap();
    if (S.cap.busy) { toast('正在识别中，请等识别完成'); return; }
    onAudioPicked(file);
  };
}

async function boot() {
  await Store.init();
  bindPickers();
  try { S.stats = await Store.stats(); } catch (e) {}
  /* 服务端探活：黑窗口被顺手关掉是真实场景 —— 之前页面会静默停在旧数据上，
     一点提示都没有。每 20 秒探一次（本地模式不探）：
     断开 → 顶栏下常驻横幅；恢复 → 横幅自动消失 + toast 说一声。 */
  if (Store.mode === 'server') {
    let connLost = false;
    setInterval(async () => {
      let ok = false;
      try {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 3000);
        const r = await fetch('./api/health', { cache: 'no-store', signal: ctl.signal });
        clearTimeout(t);
        ok = r.ok;
      } catch (e) { ok = false; }
      const banner = document.getElementById('connBanner');
      if (banner) {
        if (!ok && !connLost) { connLost = true; banner.classList.remove('hidden'); }
        else if (ok && connLost) { connLost = false; banner.classList.add('hidden'); toast('已重新连上服务端 ✓'); }
      }
    }, 20000);
  }
  $$('#tabbar button').forEach(b => b.onclick = () => {
    if (b.dataset.nav === 'capture') S.cap = newCap();
    go(b.dataset.nav);
  });
  $('#btnSettings').onclick = () => go('settings');
  $('#btnStats').onclick = () => go('stats');
  $('#btnBack').onclick = goBack;
  bindViewer();     // 原图查看器：缩放 / 平移 / 旋转
  // 手机系统返回键 / 边缘侧滑：正看大图就先关大图；否则栈里还有上一页就退回去；
  // 栈空了什么都不做（交给浏览器，别把用户困在页面里）
  window.addEventListener('popstate', () => {
    if (V.open) { closeViewer(); return; }
    if (S.stack.length) goBack();
  });
  /* 切到后台 / 锁屏前再补存一次草稿：手机上最常见的「丢结果」其实是切走之后
     系统把标签页回收了，光靠 popstate 兜不住。这两条必须用 sendBeacon —— 
     页面马上要被回收，普通 fetch 发不出去 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.view === 'batch') Draft.beacon();
  });
  window.addEventListener('pagehide', () => { if (S.view === 'batch') Draft.beacon(); });
  go('list', null, true);

  // 打开应用时提醒一次今天的复习任务。
  // 「每天只提醒一次」——用日期戳记着，免得家长每次切回来都被弹一次。
  const delay = Store.mode === 'local' ? 4400 : 1200;   // 本地模式先让「离线」提示说完
  setTimeout(() => {
    const n = (S.stats && S.stats.due_count) || 0;
    if (!n) return;
    let today = '';
    try { today = new Date().toDateString(); } catch (e) { return; }
    try {
      if (localStorage.getItem('ctb_due_notice') === today) return;
      localStorage.setItem('ctb_due_notice', today);
    } catch (e) { /* 无痕模式等拿不到 localStorage，那就每次都提醒 */ }
    toast('今天有 ' + n + ' 题该复习了 🔁', 3400);
  }, delay);

  if (Store.mode === 'local') {
    setTimeout(() => toast('未连上本地服务端，已切到浏览器本地模式', 2600), 900);
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
