/* ---------------- 首页的「有没保存完的识别结果」横幅 ----------------
   用途：AI 识别完但还没点「存入错题本」时，用户误触离开页面 / 刷新了，
   结果不会白丢 —— 首页进来就能看到这条横幅，一键接着整理。 */
function draftBannerHTML() {
  const d = S.draft;
  if (!d || !d.items || !d.items.length) return '';
  const picked = d.items.filter(x => x.save).length;
  const when = fmtDateTime(d.updated_at || d.created_at);
  const lost = (d.photos_lost || (d.missing_photos || []).length || 0);
  return '<div class="draft-banner" id="draftBanner">'
    + '<div class="grow"><div class="t">有 ' + d.items.length + ' 题识别好了还没保存</div>'
    + '<div class="s">' + esc(d.subject || '未分类') + (when ? ' · ' + when : '')
    + (picked ? ' · 已勾选 ' + picked + ' 题' : '')
    + (lost ? ' · ' + lost + ' 张原图没存下' : '')
    + '<br>误触离开也不会丢，点「继续整理」接着看</div></div>'
    + '<button class="btn" id="draftGo">继续整理</button>'
    + '<button class="btn give" id="draftDrop">放弃</button>'
    + '</div>';
}

function bindDraftBanner() {
  const g = $('#draftGo'), dp = $('#draftDrop');
  if (g) g.onclick = (ev) => { ev.stopPropagation(); Draft.restore(); };
  if (dp) dp.onclick = (ev) => { ev.stopPropagation(); Draft.discard(true); };
}

/** 只重画这条横幅（放弃草稿后不用整页重渲染） */
function paintDraftBanner() {
  const slot = $('#draftSlot');
  if (!slot) return;
  slot.innerHTML = draftBannerHTML();
  bindDraftBanner();
}

/* ---------------- 复习设置的记忆 ----------------
   自定义复习的学科/题量/顺序/标签/次数档，存 localStorage —— 以前只存内存，
   刷新一次就回到默认，每次都要重新点一遍。只记数据字段，函数之类的丢掉。 */
const LS_REV_FILTER = 'ctb_rev_filter';
function revFilterDefaults() {
  return { subject: '全部', count: 10, strategy: 'due', tags: [], rc: '', rcMin: '', rcMax: '',
    dateMode: '', dateFrom: '', dateTo: '' };
}
function loadRevFilter() {
  const d = revFilterDefaults();
  try {
    const saved = JSON.parse(localStorage.getItem(LS_REV_FILTER) || 'null');
    if (saved && typeof saved === 'object') {
      ['subject', 'strategy', 'rc', 'rcMin', 'rcMax', 'dateMode', 'dateFrom', 'dateTo'].forEach(k => {
        if (typeof saved[k] === 'string') d[k] = saved[k];
      });
      if (typeof saved.count === 'number' && [5, 10, 20, 0].indexOf(saved.count) >= 0) d.count = saved.count;
      if (Array.isArray(saved.tags)) d.tags = saved.tags.filter(t => typeof t === 'string').slice(0, 12);
    }
  } catch (e) { /* 存坏了就用默认 */ }
  return d;
}
function saveRevFilter(f) {
  try {
    localStorage.setItem(LS_REV_FILTER, JSON.stringify({
      subject: f.subject, count: f.count, strategy: f.strategy,
      tags: f.tags || [], rc: f.rc || '', rcMin: f.rcMin || '', rcMax: f.rcMax || '',
      dateMode: f.dateMode || '', dateFrom: f.dateFrom || '', dateTo: f.dateTo || ''
    }));
  } catch (e) { /* 无痕模式存不了就算了 */ }
}

/** 一键开始今天的复习：跳过设置页，直接进卡片 */
async function startTodayReview() {
  S.rev = {
    filter: (S.rev && S.rev.filter) || loadRevFilter(),
    running: false, queue: [], idx: 0, show: false, showImg: false,
    right: 0, wrong: 0, done: 0
  };
  S.view = 'review';
  syncTab();
  window.scrollTo(0, 0);
  await startReview({ dueOnly: true });
  // 万一刚好一题都没有（比如刚判完最后一题），退回设置页，别留个空白页
  if (!S.rev.running) renderReview();
}

/* ---------------- 视图：错题列表 ---------------- */
function masteryDots(n, reviews) {
  let h = '<div class="dots">';
  for (let i = 1; i <= 5; i++) h += '<i class="dot ' + (i <= n ? 'on' : '') + '"></i>';
  h += '</div>';
  return h;
}

async function renderList() {
  setTitle('错题本', S.stats ? '共 ' + S.stats.total + ' 题' : '');
  const f = S.listFilter;
  /* 题目列表还在路上时先铺几张骨架卡（题多、图片大时手机上会等一小会儿） */
  if (!$('#listWrap')) {
    $('#main').innerHTML = '<div class="mt8">'
      + '<div class="skel card"></div>'.repeat(4) + '</div>';
  }
  let items;
  try {
    items = await Store.list(Object.assign({
      subject: f.subject, q: f.q, low: f.onlyLow ? 1 : '',
      tags: (f.tags && f.tags.length) ? f.tags : '',
      sort: f.group === 'kp' ? 'new' : 'new'
    }, rcParams(f)));
  } catch (e) {
    // 服务端模式拉列表失败（黑窗口被关 / 网络断）：给错误态 + 重试，别让骨架屏永久停留
    if (S.view !== 'list') return;
    if (Store.mode === 'server') { $('#main').innerHTML = errorStateHTML('错题列表'); return; }
    throw e;
  }

  // 数据回来得比用户切页晚时，别把人家当前页面顶掉（列表最多 300ms，手机上更久）
  if (S.view !== 'list') return;

  /* 草稿横幅要用的数据：第一次进列表时等它一下（本地接口，几十毫秒就回来），
     之后一直用内存里的值，免得每次回首页都多一次请求 */
  if (S.draft === undefined) {
    try { S.draft = await Store.getDraft(); } catch (e) { S.draft = null; }
  }
  if (S.view !== 'list') return;    // 上面这一等，用户可能已经切走了

  let h = '<div id="draftSlot">' + draftBannerHTML() + '</div>';
  h += '<div id="dashSlot">' + dashboardHTML() + '</div>';
  h += '<div class="toolbar"><div class="search"><span aria-hidden="true">🔍</span><input id="q" placeholder="搜题目 / 知识点 / 错因" value="' + esc(f.q) + '"></div></div>';
  h += '<div class="tabs">' + ['全部'].concat(SUBJECTS).map(s =>
    '<button data-sub="' + esc(s) + '" class="' + (f.subject === s ? 'on' : '') + '">' + esc(s) + '</button>').join('') + '</div>';
  h += '<div class="tabs" style="padding-top:6px">'
    + '<button data-group="none" class="' + (f.group === 'none' ? 'on' : '') + '">列表</button>'
    + '<button data-group="kp" class="' + (f.group === 'kp' ? 'on' : '') + '">按知识点</button>'
    + '<button data-group="reason" class="' + (f.group === 'reason' ? 'on' : '') + '">按错因标签</button>'
    + '<button id="onlyLow" class="' + (f.onlyLow ? 'on' : '') + '">只看没掌握</button>'
    + '</div>';

  /* 标签筛选 + 复习次数筛选：都默认收起，免得一进首页就是一大片筛选墙 */
  const fTags = f.tags || [];
  const rcTxt = rcLabel(f);
  h += '<div class="pad" style="padding-top:2px;padding-bottom:0">'
    + '<button class="btn ghost block small" id="tagFilterBtn">🏷️ '
    + (fTags.length ? '已按标签筛选（' + fTags.length + ' 个）· 点这里改'
      : '按错因标签筛选 / 专练某一类错题')
    + '</button>'
    + (f.tagOpen ? '<div class="mt8">' + tagPickerBox('list', fTags) + '</div>' : '')
    + '<button class="btn ghost block small mt8" id="rcFilterBtn">🔁 '
    + (rcTxt ? '已按复习次数筛选（' + esc(rcTxt) + '）· 点这里改'
      : '按复习次数筛选（练过几次）')
    + '</button>'
    + (f.rcOpen ? '<div class="mt8">' + rcFilterHTML('list', f) + '</div>' : '')
    + '<button class="btn ghost block small mt8" id="markDelBtn" style="display:none"></button>'
    + '</div>';

  h += '<div id="listWrap"></div>';
  $('#main').innerHTML = h;
  $('#listWrap').innerHTML = listBodyHTML(items, f);

  const qi = $('#q');
  let t = null;
  qi.oninput = () => {
    clearTimeout(t);
    t = setTimeout(() => { S.listFilter.q = qi.value.trim(); refreshListOnly(); }, 300);
  };
  $$('#main .tabs [data-sub]').forEach(b => b.onclick = () => { S.listFilter.subject = b.dataset.sub; renderList(); });
  $$('#main .tabs [data-group]').forEach(b => b.onclick = () => { S.listFilter.group = b.dataset.group; renderList(); });
  const ol = $('#onlyLow');
  if (ol) ol.onclick = () => { S.listFilter.onlyLow = !S.listFilter.onlyLow; renderList(); };
  const tfb = $('#tagFilterBtn');
  if (tfb) tfb.onclick = () => { S.listFilter.tagOpen = !S.listFilter.tagOpen; renderList(); };
  bindTagPicker('list', () => S.listFilter.tags || [], v => { S.listFilter.tags = v; },
    () => { const y = window.scrollY; renderList().then(() => window.scrollTo(0, y)); });
  const rfb = $('#rcFilterBtn');
  if (rfb) rfb.onclick = () => { S.listFilter.rcOpen = !S.listFilter.rcOpen; renderList(); };
  bindRcFilter('list', () => S.listFilter,
    () => { const y = window.scrollY; renderList().then(() => window.scrollTo(0, y)); });
  bindItemClicks();
  bindDashboard();
  bindDraftBanner();
  paintMarkDelBtn(items);
  // 看板用的 S.stats 可能是上一次的（比如跨了一夜），后台悄悄刷一次只重画看板
  Store.stats().then(() => {
    if (S.view !== 'list') return;
    paintDashboard();
  }).catch(() => {});
}

/* ---------------- 集中删除「标记删除」的错题 ----------------
   复习时点「🗑 标记删除」只是打个标记（mark_delete=1），题还在列表里；
   攒到一定数量，回错题本页这里集中处理。删题不删图 ——
   图片要等没有任何题引用了（孤儿图）才提醒清理，且共用图绝不误删。 */
function paintMarkDelBtn(items) {
  const btn = $('#markDelBtn');
  if (!btn) return;
  const n = (items || []).filter(m => Number(m.mark_delete) === 1).length;
  if (!n) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent = '🗑 ' + n + ' 题已标记删除 · 点这里集中处理';
  btn.onclick = openMarkDelSheet;
}

function openMarkDelSheet() {
  const old = document.getElementById('markDelWrap');
  if (old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'markDelWrap';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:85;background:rgba(8,13,20,.55);'
    + 'display:flex;align-items:flex-end;justify-content:center;padding:14px';
  wrap.innerHTML = '<div class="sheet" style="max-width:520px;max-height:80vh;overflow:auto">'
    + '<h3>🗑 集中删除</h3>'
    + '<div class="tiny muted" id="mdList">正在读取标记的题…</div>'
    + '<div class="row" style="gap:10px;margin-top:12px">'
    + '<button class="btn danger grow" id="mdGo">删除选中的题</button>'
    + '<button class="btn gray" id="mdCancel">取消</button></div>'
    + '<div id="mdAfter" class="mt12"></div>'
    + '</div>';
  document.body.appendChild(wrap);
  wrap.onclick = (ev) => { if (ev.target === wrap) wrap.remove(); };
  $('#mdCancel').onclick = () => wrap.remove();

  (async () => {
    const items = (await Store.list({})).filter(m => Number(m.mark_delete) === 1);
    const box = $('#mdList');
    if (!box) return;
    if (!items.length) {
      box.innerHTML = '<div class="notice info">当前没有标记删除的题 ✓<span class="tiny">（复习时点「🗑 标记删除」的题会出现在这里）</span></div>';
      $('#mdGo').style.display = 'none';
      return;
    }
    box.innerHTML = '<div class="tiny muted" style="margin-bottom:6px">以下 ' + items.length
      + ' 题被标记删除。勾选要真删的（默认全选）：</div>'
      + items.map(m => '<label class="row" style="padding:6px 0;border-bottom:1px solid var(--line);gap:8px">'
        + '<input type="checkbox" class="mdCk" data-id="' + m.id + '" checked>'
        + '<span class="grow tiny">' + esc(String(cleanOrText(m)).slice(0, 40) || ('#' + m.id)) + '</span>'
        + '<span class="tiny faint">' + esc(m.subject || '') + '</span></label>').join('');
    $('#mdGo').onclick = async () => {
      const ids = [...wrap.querySelectorAll('.mdCk:checked')].map(c => Number(c.dataset.id));
      if (!ids.length) { toast('先勾选要删的题'); return; }
      if (!confirm('真的删除这 ' + ids.length + ' 道题吗？\n\n删的是「软删除」——数据还能从备份找回，\n但列表里不会再显示。图片不会删（见下一步提示）。')) return;
      let ok = 0, fail = 0;
      for (const id of ids) {
        try { await Store.remove(id); ok++; }
        catch (e) { fail++; }
      }
      toast('已删除 ' + ok + ' 题' + (fail ? '，失败 ' + fail + ' 题' : ''));
      // 删完盘点孤儿图：删题不删图，等图没有被任何题引用了才提醒清理
      let orphanMsg = '';
      try {
        const orphans = (await Store._api('orphan_images')).items || [];
        if (orphans.length) {
          orphanMsg = '<div class="notice warn mt12">🖼 现在有 <b>' + orphans.length
            + ' 张原图已经没有任何错题在用了</b>（删题不删图留下的）。<br>'
            + '<span class="tiny">' + esc(orphans.slice(0, 3).join('、')) + (orphans.length > 3 ? ' 等' : '') + '</span><br>'
            + '<button class="btn danger block small mt8" id="mdCleanImg">清理这些无主图片</button>'
            + '<div class="tiny faint mt8">图片在 data\\images\\ 里，清理前会再确认一次；拿不准就先跑一次「备份错题数据」。</div></div>';
        } else {
          orphanMsg = '<div class="tiny faint mt8">✓ 没有无主图片，硬盘很干净。</div>';
        }
      } catch (e) { /* 盘点失败不影响删除本身 */ }
            box.innerHTML = '<div class="notice info">已删除 ' + ok + ' 题 ✓</div>' + orphanMsg;
      $('#mdGo').style.display = 'none';
      const cleanBtn = $('#mdCleanImg');
      if (cleanBtn) cleanBtn.onclick = async () => {
        const orphans = (await Store._api('orphan_images')).items || [];
        if (!orphans.length) { toast('没有需要清理的图片'); return; }
        if (!confirm('要删除这 ' + orphans.length + ' 张已无错题引用的原图吗？\n\n图片文件会被移出 data\\images\\（移到备份文件夹），建议先跑一次「备份错题数据」。')) return;
        try {
          const r = await Store._api('orphan_images', { method: 'POST' });
          toast('已把 ' + ((r.moved || []).length) + ' 张无主图片移到备份文件夹 ✓');
          cleanBtn.parentElement.remove();
        } catch (e) { toast('清理失败：' + e.message, 3600); }
      };
      renderList();
    };
  })().catch(e => {
    const box = $('#mdList');
    if (box) box.innerHTML = '<div class="notice warn">读取失败：' + esc(e.message) + '</div>';
  });
}

/** 列表正文（列表 / 按知识点 / 按错因 三种排布） */
function listBodyHTML(items, f) {
  f = f || S.listFilter;
  if (!items.length) {
    if (f.q || (f.subject && f.subject !== '全部') || f.onlyLow
      || (f.tags && f.tags.length) || rcLabel(f)) {
      return '<div class="empty"><div class="big">🔍</div><div>没有匹配的错题</div>'
        + '<div class="tiny mt8">换个关键词，或把筛选条件放宽试试</div></div>';
    }
    return '<div class="empty"><div class="big">📷</div><div>还没有错题</div>'
      + '<div class="tiny mt8">点下面的「＋ 拍照录入」，把作业错题拍下来</div>'
      + '<div class="mt16"><button class="btn" onclick="startCapture()">＋ 拍照录入第一题</button></div></div>';
  }
  if (f.group === 'none') return '<div class="mt8"></div>' + items.map(m => itemCard(m)).join('');
  const map = {};
  items.forEach(m => {
    let keys;
    if (f.group === 'kp') {
      const raw = String(m.knowledge_point || '').trim();
      keys = raw ? raw.split(/[,，、;；/|]+/).map(s => s.trim()).filter(Boolean) : ['未标知识点'];
    } else {
      /* 标签是复选的，所以同一道题会出现在它带的每个标签下面（这正合用） */
      keys = tagsOf(m);
      if (!keys.length) keys = ['未标错因'];
    }
    keys.forEach(k => { (map[k] = map[k] || []).push(m); });
  });
  let h = '';
  Object.keys(map).sort((a, b) => map[b].length - map[a].length).forEach(k => {
    h += '<div class="grouphead">' + esc(k) + '<span class="n">' + map[k].length + ' 题</span></div>';
    h += map[k].map(m => itemCard(m, true)).join('');
  });
  return h;
}

/** 搜索时只刷新列表区，保持输入框焦点 */
async function refreshListOnly() {
  const f = S.listFilter;
  const items = await Store.list(Object.assign({
    subject: f.subject, q: f.q, low: f.onlyLow ? 1 : '',
    tags: (f.tags && f.tags.length) ? f.tags : ''
  }, rcParams(f)));
  if (S.view !== 'list') return;          // 已经切走了就别再动 DOM
  const wrap = $('#listWrap');
  if (!wrap) return;                      // 容器没了说明列表已被重画，等下次 renderList 自己带上新条件
  wrap.innerHTML = listBodyHTML(items, f);
  bindItemClicks();
}

function itemCard(m, compact) {
  const img = m.question_image
    ? '<img class="thumb" loading="lazy" src="' + esc(firstImg(m.question_image)) + '" alt="">'
    : '<div class="thumb ph">📄</div>';
  const kp = m.knowledge_point || m.chapter || '未标知识点';
  const tags = tagsOf(m);
  const v = VERDICT[m.is_correct] || VERDICT.unknown;
  const verdictBadge = m.is_correct && m.is_correct !== 'unknown'
    ? '<span class="badge ' + (m.is_correct === 'wrong' ? 'bad' : m.is_correct === 'right' ? 'ok' : 'warn') + '">' + v.label + '</span>' : '';
  return '<div class="item" data-id="' + m.id + '">' + img
    + '<div class="body">'
    + '<div class="l1"><span class="badge">' + esc(m.subject || '未分类') + '</span>'
    /* 标签最多显示两个，多的用 +N 收起来 —— 列表要的是「一眼扫过」，不是标签墙 */
    + tags.slice(0, 2).map(t => '<span class="badge k">' + esc(t) + '</span>').join('')
    + (tags.length > 2 ? '<span class="badge k">+' + (tags.length - 2) + '</span>' : '')
    + verdictBadge
    /* 有干净原题的题给个小标记：一眼看出哪些题复习时不用开图片 */
    + (String(m.clean_text || '').trim() ? '<span class="badge k" title="已有干净原题（去手写、不含答案）">📖</span>' : '')
    + '</div>'
    + '<div class="qt clamp2">' + (esc(cleanOrText(m).slice(0, 90)) || '<span class="faint">（未识别题目文字）</span>') + '</div>'
    + '<div class="l3"><span class="ellipsis grow">' + esc(String(kp).slice(0, 22)) + '</span>'
    /* 练过几次 —— 按复习次数筛选时要能一眼核对 */
    + '<span class="tiny faint" title="练过几次">🔁' + Number(m.review_count || 0) + '</span>'
    + masteryDots(m.mastery || 0) + '<span>' + fmtDate(m.created_at) + '</span></div>'
    + '</div></div>';
}
function bindItemClicks() {
  $$('#main .item').forEach(el => {
    el.onclick = () => go('detail', el.dataset.id);
  });
}

/* ---------------- 视图：拍照录入 / 编辑 ---------------- */

  };
}

/** 全新一次拍照录入的初始状态。photos：跨页题的多张照片（按顺序），image 恒等于第一张
 *  audio：听力音频的 data URL（可选）；listeningText：音频转写出的原文 */
function newCap() {
  return {
    id: null, image: null, photos: [], busy: false, aiDone: false, edit: false,
    audio: null, audioName: '', audioSize: 0, audioDuration: 0, listeningText: '',
    audioBusy: false,
    form: emptyForm()
  };
}

/** 想「重新开始一次录入」的入口都走这里 */
function startCapture() {
  S.cap = newCap();
  go('capture', null, true);
}

function openCapture(param) {
  if (param && param.id) {
    Store.get(param.id).then(m => {
      S.cap = {
        id: m.id, image: firstImg(m.question_image) || null,
        photos: splitImgs(m.question_image),
        busy: false, aiDone: false, edit: true,
        /* 编辑旧错题时，把已存的听力音频与原文一并带出来，改完还能一起保存 */
        audio: m.audio_url || null, audioName: m.audio_url ? '已存听力音频' : '',
        audioSize: 0, audioDuration: 0, listeningText: m.listening_text || '', audioBusy: false,
        form: {
          subject: m.subject || '数学', source_type: m.source_type || '作业',
          chapter: m.chapter || '', knowledge_points: m.knowledge_point || '',
          /* 标签是复选的，统一放数组里；老库没有标签时退回主错因，保证有东西可编辑 */
          error_reason: m.error_reason || '', reason_tags: tagsOf(m),
          is_correct: m.is_correct || 'unknown',
          question_text: m.question_text || '', student_answer: m.student_answer || '',
          /* ★必须把已有的干净原题带进表单：不带的话保存时上传上去的是空串，
             会把之前辛苦提取的干净原题抹掉（编辑一道老题就丢一份）。 */
          clean_text: m.clean_text || '',
          correct_answer: m.correct_answer || '', explanation: m.explanation || '',
          similar_question: m.similar_question || '', check_result: m.check_result || '',
          mastery: m.mastery || 0
        }
      };
      renderCapture();
    }).catch(e => toast(e.message));
    return;
  }
  /* 注意：这里绝对不能重置 S.cap —— 刚拍完照也是走 go('capture') 进来的，
     一重置就把刚压好的照片丢了（曾经真的丢过）。要重开一次录入请用 startCapture()。 */
  if (!S.cap) S.cap = newCap();
  renderCapture();
}

function renderCapture() {
  const c = S.cap;
  const hasImg = !!c.image;
  setTitle(c.edit ? '编辑错题' : '拍照录入',
    c.edit ? '' : (hasImg ? '第 2 步 · 校对' : '第 1 步 · 拍照'));
  let h = '';

  /* 还没取图、也没进入手工录入 → 显示取图引导 */
  if (!hasImg && !c.aiDone) {
    h += '<div class="drop"><div class="ico">📷</div>'
      + '<div class="mt8" style="font-weight:600">把作业/试卷上的错题拍清楚</div>'
      + '<div class="tiny muted mt8">尽量正对、光线充足、只拍一道题<br>题目跨页也没关系：先拍第 1 页，之后可「续拍一页」（最多 3 张）</div>'
      + '<div class="row mt16" style="justify-content:center;gap:10px">'
      + '<button class="btn lg" id="btnCam">📷 拍照</button>'
      + '<button class="btn lg gray" id="btnLib">🖼️ 相册</button></div>'
      + '<div class="mt12"><button class="btn ghost" id="btnManual">✍️ 不拍照，手工录入</button></div>'
      + '</div>';
    h += audioBoxHtml(c);
    h += '<div class="pad tiny muted">小提示：照片只用于识别题目，不会公开发布。识别结果保存前你都能改。</div>';
    $('#main').innerHTML = h;
    $('#btnCam').onclick = () => $('#camInput').click();
    $('#btnLib').onclick = () => $('#libInput').click();
    $('#btnManual').onclick = () => {
      c.image = null; c.aiDone = true; c.busy = false;
      c.form = c.form || emptyForm();
      renderCapture();
    };
    bindAudioButtons(c);
    return;
  }

  /* 照片列表（跨页题可有多张；旧数据/编辑模式退化为单张数组） */
  const ph = (c.photos && c.photos.length) ? c.photos : (hasImg ? [c.image] : []);
  if (ph.length) {
    h += '<div class="pad" style="padding-bottom:0">';
    ph.forEach((url, i) => {
      h += '<div class="preview" style="margin-bottom:10px">'
        + '<img id="prev' + i + '" src="' + esc(url) + '" alt="错题照片第' + (i + 1) + '页">'
        + (i === 0 ? '<span class="pageno">第 1 页</span>' : '<span class="pageno">第 ' + (i + 1) + ' 页</span>')
        + '<button class="redo" data-delp="' + i + '">删除</button>'
        + '</div>';
    });
    if (ph.length > 1) h += '<div class="tiny muted center" style="margin-bottom:8px">这些页会一起交给 AI：单题识别当作一道题；整卷识别逐页列出全部题目</div>';
    h += '</div>';
  }

  if (c.busy) {
    h += '<div class="loading"><div class="spin"></div><div style="font-weight:600">'
      + (ph.length > 1 ? 'AI 正在把 ' + ph.length + ' 张照片拼成一道题识别讲解…' : 'AI 正在识别题目并讲解…')
      + '</div>'
      + '<div class="tiny muted mt8">一般 10～40 秒，跨页多图会稍慢，请稍等</div></div>';
    $('#main').innerHTML = h;
    bindPhotoButtons(c, ph);
    return;
  }

  if (hasImg && !c.aiDone) {
    h += '<div class="pad">';
    if (ph.length < 6) {
      h += '<div class="row" style="gap:10px;margin-bottom:12px">'
        + '<button class="btn gray grow" id="btnMoreCam">📷 续拍一页</button>'
        + '<button class="btn gray grow" id="btnMoreLib">🖼️ 续选一页</button></div>'
        + '<div class="tiny muted center" style="margin-bottom:12px">题目跨页/被切断时，把剩下的部分拍下来加进来（最多 6 张，英语卷整面正反面都行）。'
        + '存下后复习时可在题目上方一张一张翻看、随手放大。</div>';
    }
    h += '<button class="btn block lg" id="btnBatch">'
      + (ph.length > 1 ? '📚 整卷识别（' + ph.length + ' 页多题）' : '📚 整页识别（一图多题）') + '</button>'
      + '<div class="tiny muted center mt8">'
      + (ph.length > 1
          ? '把这 ' + ph.length + ' 页当作同一份试卷，逐页逐题全部列出来（跨页的题自动拼成一道）'
          : '列出整页全部题目 + 正确答案，再挑着存进错题本')
      + '</div>';
    h += '<div class="mt16 row" style="gap:10px">'
      + '<button class="btn ghost grow" id="btnAI">🤖 单题·检查讲解</button>'
      + '<button class="btn ghost grow" id="btnOnly">📖 单题·只讲解</button></div>'
      + '<div class="tiny muted center mt8">'
      + (ph.length > 1 ? '上面两个单题按钮会把这几页当成' : '单题识别用于整页上只有一道题的情况；')
      + (ph.length > 1 ? '同一道题来检查讲解' : '多题请用整页识别')
      + '</div>'
      + '<div class="mt12"><button class="btn gray block" id="btnSkip">✍️ 手工录入</button></div>'
      + '</div>';
    h += audioBoxHtml(c);
    h += '<div class="pad" style="padding-top:0">'
      + '<div class="fld"><label>补充说明（可选）</label>'
      + '<input type="text" id="extra" placeholder="例如：这是第 3 单元测验第 5 题"></div></div>';
    $('#main').innerHTML = h;
    bindPhotoButtons(c, ph);
    bindAudioButtons(c);
    $('#btnBatch').onclick = runBatch;         // 多页也能整卷识别（跨页题拼接 + 逐页列全）
    if (ph.length < 6) {                      // 到 6 张上限时这两个按钮不渲染，别绑空
      $('#btnMoreCam').onclick = () => $('#camInput').click();
      $('#btnMoreLib').onclick = () => $('#libInput').click();
    }
    $('#btnAI').onclick = () => runAI('check');
    $('#btnOnly').onclick = () => runAI('explain');
    $('#btnSkip').onclick = () => { c.aiDone = true; renderCapture(); };
    return;
  }

  /* ---- 校对表单 ---- */
  const f = c.form;
  const v = VERDICT[f.is_correct] || VERDICT.unknown;
  if (f.check_result || (f.is_correct && f.is_correct !== 'unknown')) {
    h += '<div class="verdict ' + v.cls + '"><div style="font-size:20px">' + v.ico + '</div><div class="grow">'
      + '<div class="v">AI 检查：' + v.label + '</div>'
      + (checkText(f.check_result) ? '<div class="tiny" style="margin-top:2px">' + esc(checkText(f.check_result)) + '</div>' : '')
      + '</div></div>';
  }

  h += '<div class="pad">';
  h += '<div class="notice info">下面每一项都可以手动修改，确认无误再保存 👇</div>';
  h += '<div class="mt16"></div>';
  h += fldSeg('学科', 'subject', SUBJECTS.concat(['未分类']));
  h += fldSeg('来源', 'source_type', SOURCES);
  h += fldSeg('检查结论', 'is_correct', ['wrong', 'right', 'partial', 'unknown'],
    k => (VERDICT[k] ? VERDICT[k].ico + ' ' + VERDICT[k].label : k));
  h += fldInput('章节', 'chapter', '例如：第三单元 分数除法');
  h += fldInput('知识点（多个用逗号隔开）', 'knowledge_points', '例如：分数乘法, 约分');
  h += '<div class="fld"><label>错因标签（可多选：孩子到底为什么做错）</label>'
    + tagPickerBox('cap', f.reason_tags) + '</div>';
  h += fldText('题目文本', 'question_text', '识别出的题目，可修改', 4);
  /* 复习真正拿来做题的那一份：AI 检查时已顺手整理好，也可以在这里手动润色 */
  h += fldText('📖 干净原题（去手写、不含答案；复习时用它做题）', 'clean_text',
    'AI 检查时会一并整理：只保留印刷体题干，孩子写的一律去掉，填空留 ____ 或 ( )', 5);
  h += (String(f.clean_text || '').trim()
    ? '<div class="tiny faint" style="margin:-4px 0 12px">📖 已自动整理好，可直接用；不满意可以改，或清空后到详情页重新提取</div>'
    : '<div class="tiny faint" style="margin:-4px 0 12px">这次没整理出干净原题（模型偶尔会漏）。先照常保存，之后在详情页点「📖 提取干净原题」补上即可</div>');
  h += fldText('孩子的答案', 'student_answer', '照片里写的是什么', 2);
  h += fldText('正确答案', 'correct_answer', '正确答案与关键步骤', 3);
  h += fldText('讲解', 'explanation', 'AI 讲解，可修改', 8);
  h += fldText('举一反三', 'similar_question', '同类练习题（可空）', 2);
  h += '<div class="fld"><label>掌握度（0 完全不会 ～ 5 已掌握）</label>'
    + '<div class="dotpick" id="dotpick">'
    + [0, 1, 2, 3, 4, 5].map(n => '<button class="d ' + (f.mastery === n ? 'on' : '') + '" data-n="' + n + '">' + n + '</button>').join('')
    + '</div></div>';
  h += '<div class="row mt16" style="gap:10px">'
    + '<button class="btn gray" id="btnCancel" style="flex:0 0 34%">放弃</button>'
    + '<button class="btn grow" id="btnSave">' + (c.edit ? '保存修改' : '存入错题本') + '</button></div>';
  h += '</div>';

  $('#main').innerHTML = h;
  setTitle(c.edit ? '编辑错题' : (hasImg ? '确认并保存' : '手工录入'),
    c.edit ? '' : (hasImg ? '第 2 步 · 校对' : '不拍照也能录'));

  if (hasImg) bindPhotoButtons(c, ph);
  bindForm();
  bindTagPicker('cap', () => S.cap.form.reason_tags || [], v => { S.cap.form.reason_tags = v; },
    () => { const y = window.scrollY; renderCapture(); window.scrollTo(0, y); });
  $('#btnCancel').onclick = () => { if (confirm('放弃这次录入？')) go('list', null, true); };
  $('#btnSave').onclick = saveCapture;
}

/** 录入页照片按钮的统一绑定：删除某一张（跨页时） */
function bindPhotoButtons(c, ph) {
  $$('#main [data-delp]').forEach(b => b.onclick = () => {
    if (c.busy) return;
    c.photos.splice(Number(b.dataset.delp), 1);
    c.image = c.photos[0] || null;
    if (!c.photos.length) { c.aiDone = false; }
    renderCapture();
  });
}

/* ---------------- 听力音频：UI ---------------- */

/** 音频模块的 HTML：没选音频显示「上传」按钮，选了显示文件卡片 */
function audioBoxHtml(c) {
  let h = '<div class="pad" style="padding-top:0">';
  if (!c.audio) {
    h += '<button class="btn ghost block" id="btnAudio">🎧 上传听力音频（可选）</button>'
      + '<div class="tiny muted center mt8">英语卷有听力题时传上录音：程序会把录音转成文字，'
      + '再结合照片判断听力题做得对不对。<b>不传的话听力题一律不检查</b>。</div>';
  } else {
    h += '<div class="audiobox">'
      + '<div class="row" style="gap:10px;align-items:center">'
      + '<div style="font-size:22px">🎧</div><div class="grow" style="min-width:0">'
      + '<div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
      + esc(c.audioName || '听力音频') + '</div>'
      + '<div class="tiny muted">' + (c.audioDuration ? fmtDuration(c.audioDuration) + ' · ' : '')
      + (c.audioSize ? fmtSize(c.audioSize) : '已存音频') + '</div></div>'
      + (c.edit ? '' : '<button class="btn ghost small" id="btnAudioDel">删除</button>')
      + '</div>'
      + '<audio controls preload="metadata" src="' + esc(c.audio) + '" style="width:100%;margin-top:8px"></audio>';
    if (c.listeningText) {
      h += '<div class="tiny" style="margin-top:8px"><b>已转写的听力原文</b>（识别时会一并交给 AI）：</div>'
        + '<textarea id="listenText" rows="4" placeholder="听力原文">' + esc(c.listeningText) + '</textarea>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function bindAudioButtons(c) {
  const b = $('#btnAudio');
  if (b) b.onclick = () => $('#audioInput').click();
  const d = $('#btnAudioDel');
  if (d) d.onclick = () => {
    if (c.busy) return;
    c.audio = null; c.audioName = ''; c.audioSize = 0; c.audioDuration = 0; c.listeningText = '';
    renderCapture();
  };
  const t = $('#listenText');
  if (t) t.oninput = () => { c.listeningText = t.value; };
}

/** 隐藏 input 一旦选中音频文件：读进来 + 存进当前录入状态 + 立刻转写 */
function onAudioPicked(file) {
  const c = S.cap;
  if (!c || !file) return;
  c.audioBusy = true;
  readAudioFile(file).then(info => {
    c.audio = info.url;
    c.audioName = info.name;
    c.audioSize = info.size;
    c.audioDuration = info.duration;
    c.listeningText = '';
    c.audioBusy = false;
    renderCapture();
    if (c.audio && !c.edit) toast('音频已就绪，正在转文字…', 2000);
    /* 选完就顺手转写：用户点检查时就不用再等这一段 */
    if (c.audio) {
      asrTranscribe(c.audio).then(text => {
        if (S.cap !== c) return;              // 已经离开这次录入，丢弃
        c.listeningText = text;
        if (S.view === 'capture') renderCapture();
        toast('听力原文已转写出来，可以点检查了', 2600);
      }).catch(e => {
        toast('转写失败：' + (e.message || e) + '（仍可直接保存音频，检查时听力题会被跳过）', 4200);
      });
    }
  }).catch(e => {
    c.audioBusy = false;
    toast(e.message || '读取音频失败', 3600);
    renderCapture();
  });
}

function resetShot() {
  S.cap.photos = [];
  S.cap.image = null; S.cap.aiDone = false; S.cap.busy = false;
  renderCapture();
}

function fldSeg(label, key, options, labeler) {
  const cur = String(S.cap.form[key] == null ? '' : S.cap.form[key]);
  return '<div class="fld"><label>' + esc(label) + '</label><div class="seg" data-field="' + key + '">'
    + options.map(o => '<button type="button" data-val="' + esc(o) + '" class="' + (String(o) === cur ? 'on' : '') + '">'
      + esc(labeler ? labeler(o) : o) + '</button>').join('')
    + '</div></div>';
}
function fldInput(label, key, ph) {
  return '<div class="fld"><label>' + esc(label) + '</label>'
    + '<input type="text" data-field="' + key + '" placeholder="' + esc(ph || '') + '" value="' + esc(S.cap.form[key] || '') + '"></div>';
}
function fldText(label, key, ph, rows) {
  return '<div class="fld"><label>' + esc(label) + '</label>'
    + '<textarea data-field="' + key + '" rows="' + (rows || 3) + '" placeholder="' + esc(ph || '') + '">'
    + esc(S.cap.form[key] || '') + '</textarea></div>';
}

function bindForm() {
  $$('#main [data-field]').forEach(el => {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.oninput = () => { S.cap.form[el.dataset.field] = el.value; };
    }
  });
  $$('#main .seg').forEach(seg => {
    seg.onclick = (ev) => {
      const b = ev.target.closest('button[data-val]');
      if (!b) return;
      const field = seg.dataset.field;
      S.cap.form[field] = b.dataset.val;
      $$('button', seg).forEach(x => x.classList.toggle('on', x === b));
    };
  });
  const dp = $('#dotpick');
  if (dp) dp.onclick = (ev) => {
    const b = ev.target.closest('button[data-n]');
    if (!b) return;
    S.cap.form.mastery = Number(b.dataset.n);
    $$('button', dp).forEach(x => x.classList.toggle('on', x === b));
  };
}

async function runAI(mode) {
  const c = S.cap;
  c.busy = true; renderCapture();
  try {
    const extra = ($('#extra') && $('#extra').value || '').trim();
    const imgs = (c.photos && c.photos.length) ? c.photos : [c.image];
    const listen = await ensureListeningText(c);      // 有音频但还没转写 → 现在补转一次
    const a = await aiAnalyze(imgs, mode, S.listFilter.subject, extra, listen);
    c.form.subject = normalizeSubject(a.subject) === '未分类' && S.listFilter.subject !== '全部'
      ? S.listFilter.subject : normalizeSubject(a.subject);
    c.form.source_type = SOURCES.indexOf(a.source_type) >= 0 ? a.source_type : '作业';
    c.form.chapter = a.chapter || '';
    c.form.knowledge_points = Array.isArray(a.knowledge_points) ? a.knowledge_points.join('，') : (a.knowledge_points || '');
    c.form.question_text = a.question_text || '';
    /* 干净原题（去手写、不含答案）在这同一次调用里就一起拿回来了，保存错题时一并落库。
       模型没给也不报错 —— 留空，回头在详情页/复习页随时能补。 */
    c.form.clean_text = String(a.clean_text || '').trim();
    c.form.student_answer = a.student_answer || '';
    c.form.correct_answer = a.correct_answer || '';
    c.form.explanation = a.explanation || '';
    c.form.similar_question = a.similar_question || '';
    c.form.check_result = a.check_result || '';
    c.form.is_correct = ['right', 'wrong', 'partial', 'unknown'].indexOf(a.is_correct) >= 0 ? a.is_correct : 'unknown';
    /* 标签只认清单里的词（模型偶尔会写成近义词，normalizeTags 会折算）；
       老的主错因不再单独问，由标签推出来，两个字段永远一致 */
    c.form.reason_tags = normalizeTags(a.reason_tags);
    c.form.error_reason = reasonFromTags(c.form.reason_tags);
    c.aiDone = true;
    toast('识别完成，请核对后保存');
  } catch (e) {
    toast(e.message || '识别失败', 3200);
    c.aiDone = false;
  }
  c.busy = false;
  renderCapture();
}

/** 拿到可用的听力原文：已有就用；有音频但没转写过就当场转；两者都没有就返回空串（= 跳过听力题） */
async function ensureListeningText(c) {
  if (!c || !c.audio) return '';
  if ((c.listeningText || '').trim()) return c.listeningText.trim();
  toast('正在把听力音频转成文字…', 2400);
  try {
    const text = await asrTranscribe(c.audio);
    c.listeningText = text;
    return text;
  } catch (e) {
    // 转写失败不该让整次识别崩掉：退回「没有音频」的路径，听力题会被跳过并标明原因
    toast('听力音频转写失败，本次将跳过听力题：' + (e.message || e), 4200);
    return '';
  }
}

/* 注：以前这里有个 stitchPhotos()，把多页竖向拼成一张长图再存库。
   现在多页各存各的、复习时在「原图窗口」里一张一张翻（见 bindPhotoBox），
   拼图这条路彻底不用了 —— 长图放到能看清字的时候横向早就出屏，还要反复对位。
   顺带删掉的 STITCH_MAX_PIXELS 也是为它服务的。 */

async function saveCapture() {
  const f = S.cap.form;
  const ph = (S.cap.photos && S.cap.photos.length) ? S.cap.photos : (S.cap.image ? [S.cap.image] : []);
  if (!f.question_text && !ph.length) { toast('题目文本和照片至少有一样'); return; }
  const btn = $('#btnSave');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    /* 多页各存各的（用 | 连起来），不再拼成一张长图 ——
       长图在手机上放到能看清字的时候，横向早就出屏了，而且每次都要重新对位。
       分开存还有额外好处：每页都保留 2400px 的原尺寸，比拼接时被限流后的图更清楚。 */
    const payload = {
      subject: f.subject, chapter: f.chapter, knowledge_point: f.knowledge_points,
      reason_tags: (f.reason_tags || []).join('，'),
      error_reason: reasonFromTags(f.reason_tags),
      question_text: f.question_text, clean_text: f.clean_text || '',
      student_answer: f.student_answer,
      correct_answer: f.correct_answer, explanation: f.explanation, similar_question: f.similar_question,
      check_result: f.check_result, is_correct: f.is_correct, mastery: Number(f.mastery) || 0,
      source_type: f.source_type, question_image: ph.join('|'),
      /* 听力音频与转写原文一并存下（编辑时不动音频就原样带回） */
      audio_url: S.cap.audio || '', listening_text: S.cap.listeningText || ''
    };
    let saved;
    if (S.cap.edit) saved = await Store.update(S.cap.id, payload);
    else saved = await Store.create(payload);
    toast('已存入错题本 ✓');
    S.stats = await Store.stats();
    go('detail', saved.id, true);
  } catch (e) {
    toast('保存失败：' + e.message, 3400);
    btn.disabled = false; btn.textContent = '再试一次';
  }
}

/* ---------------- 视图：一图多题（整页识别） ---------------- */
function batchCounts(b) {
  const c = { right: 0, wrong: 0, partial: 0, unknown: 0, picked: 0 };
  b.items.forEach(x => { c[x.is_correct] = (c[x.is_correct] || 0) + 1; if (x.save) c.picked++; });
  c.wrongish = c.wrong + c.partial;
  return c;
}

function batchCard(it, i) {
  const v = VERDICT[it.is_correct] || VERDICT.unknown;
  const tags = it.reason_tags || [];
  const badgeCls = it.is_correct === 'wrong' ? 'bad' : it.is_correct === 'right' ? 'ok'
    : it.is_correct === 'partial' ? 'warn' : 'k';
  let h = '<div class="qcard ' + v.cls + '">';

  h += '<div class="hd"><span class="no">' + it.index + '</span>'
    + '<span class="badge ' + badgeCls + '">' + v.ico + ' ' + v.label + '</span>'
    /* 已经一并整理出干净原题的，给个小书标 —— 一眼看出哪些题复习时不用开图片 */
    + (String(it.clean_text || '').trim()
      ? '<span class="badge k" title="已同时整理好干净原题（去手写、不含答案），复习时用它做题">📖</span>' : '')
    + '<span class="grow"></span>'
    + '<button class="pick' + (it.save ? ' on' : '') + '" data-pick="' + i + '">'
    + (it.save ? '☑ 存入' : '☐ 存入') + '</button></div>';

  h += '<div class="bd">';
  h += '<div class="qt' + (it.open ? '' : ' clip') + '" data-toggle="' + i + '">' + esc(it.question_text) + '</div>';

  h += '<div class="ansbox">'
    + '<div class="ln' + (it.student_answer && it.is_correct !== 'right' ? ' bad' : '') + '">'
    + '<span class="k">孩子写的</span><span class="v' + (it.student_answer ? '' : ' faint') + '">'
    + esc(it.student_answer || '（照片里没有作答）') + '</span></div>'
    + '<div class="ln ok"><span class="k">正确答案</span><span class="v">'
    + esc(it.correct_answer || '（模型没给出，可展开讲解看看）') + '</span></div>'
    + '</div>';

  if (checkText(it.check_result)) {
    h += '<div class="tiny muted" style="margin-top:8px">🔍 ' + esc(checkText(it.check_result)) + '</div>';
  }
  if (it.knowledge_points.length) {
    h += '<div class="chips" style="margin-top:8px">'
      + it.knowledge_points.slice(0, 4).map(k => '<span class="chip">' + esc(k) + '</span>').join('')
      + '</div>';
  }

  const expLabel = it.expBusy ? '⏳ 讲解生成中…'
    : it.explanation ? (it.open ? '收起讲解' : '再看讲解')
      : (it.is_correct === 'wrong' || it.is_correct === 'partial' ? '📖 讲解 + 分析错因' : '📖 讲解这道题');
  h += '<div class="qfoot">'
    + '<button class="mini' + (it.explanation ? '' : ' pri') + '" data-exp="' + i + '"'
    + (it.expBusy ? ' disabled' : '') + '>' + expLabel + '</button>'
    + '<button class="mini' + (tags.length ? '' : ' pri') + '" data-tagedit="' + i + '">'
    + '🏷️ ' + (tags.length ? '标签 ' + tags.length : '打标签') + '</button>'
    + '</div>';
  /* 标签：先给一行只读预览，点「打标签」才展开选择器 —— 一页十几道题全展开太占地方 */
  if (tags.length) h += '<div class="tagsline">' + tagChipsHTML(tags) + '</div>';
  if (it.tagOpen) {
    h += '<div class="tagwrap">' + tagPickerBox('b' + i, tags) + '</div>';
  }

  if (it.open) {
    /* 干净原题就在展开区最上面：用户一眼就能核对「模型抄的这份能不能直接拿去复习」 */
    if (String(it.clean_text || '').trim()) {
      h += '<div class="qexp"><div class="tiny muted" style="margin-bottom:6px">'
        + '📖 干净原题（已去掉手写、不含答案；复习时用这一份）</div>'
        + '<div style="white-space:pre-wrap">' + esc(it.clean_text) + '</div></div>';
    }
    if (it.expBusy) {
      h += '<div class="qexp center"><div class="spin sm"></div>'
        + '<div class="tiny muted mt8">正在生成讲解，约 10～30 秒…</div></div>';
    } else if (it.explanation) {
      h += '<div class="qexp">' + fmtMD(it.explanation) + '</div>';
    }
    if (it.similar_question && it.explanation) {
      h += '<div class="qexp sim">🧩 <b>举一反三</b>' + '\n' + esc(it.similar_question) + '</div>';
    }
  }
  h += '</div></div>';
  return h;
}

/* 识别中的秒表：让用户看到「还在跑」，而不是干等着怀疑卡死。
   切页 / 重渲染时先清掉旧的，避免多个 interval 叠在一起。 */
let _busyTick = null, _busyT0 = 0;
function busyTimer(on) {
  if (_busyTick) { clearInterval(_busyTick); _busyTick = null; }
  const n = $('#busySec');
  if (!on || !n) return;
  _busyT0 = Date.now();
  const paint = () => {
    const el = $('#busySec');
    if (!el) { clearInterval(_busyTick); _busyTick = null; return; }
    el.textContent = Math.round((Date.now() - _busyT0) / 1000);
  };
  paint();
  _busyTick = setInterval(paint, 1000);
}

/** 把识别失败的话翻成人能看懂、能照着做的提示 */
function noticeErrorHTML(msg, multi) {
  const m = String(msg || '');
  let title = '识别失败：' + m;
  let tips = [];
  if (m.indexOf('思考') >= 0 || m.indexOf('预算') >= 0 || m.indexOf('token') >= 0) {
    title = '模型光顾着「思考」，还没来得及写答案就把额度用完了。';
    tips = ['程序已经自动关掉思考重试过一次，仍然不够。',
      multi ? '页数越多越费额度：把照片分两次传（一次 3～4 页）最稳。' : '到「设置」页把「Token 预算」调大一些再试。',
      '也可以在「设置」页换一个更快的模型。'];
  } else if (m.indexOf('超时') >= 0 || m.indexOf('连不上') >= 0 || m.indexOf('Failed to fetch') >= 0 || m.indexOf('网络') >= 0) {
    title = '没能连上模型接口（或等待太久被中断了）。';
    tips = ['先确认这台电脑能上网、启动窗口还在正常运行。',
      multi ? '页数多时上传和等待都更久，可以少传几页分两次识别。' : '稍等片刻再点「再试一次」。',
      '如果一直不行，到「设置」页点「拉取可用模型」确认 Key 和接口地址没问题。'];
  } else {
    tips = ['照片没动，点「再试一次」即可，不用重拍。',
      multi ? '如果反复失败，把照片分两次传（一次 3～4 页）。' : '如果反复失败，到「设置」页换一个模型试试。'];
  }
  let h = '<div class="notice warn" style="margin:14px">❌ ' + esc(title);
  if (tips.length) {
    h += '<div class="tiny" style="margin-top:6px;line-height:1.7">'
      + tips.map(t => '· ' + esc(t)).join('<br>') + '</div>';
  }
  h += '</div>';
  return h;
}

function renderBatch(keepScroll) {
  const y = keepScroll ? window.scrollY : 0;
  const b = S.batch;
  if (!b) {
    /* 结果页却在内存里找不到结果（多半是从首页横幅进来的）→ 直接用草稿还原 */
    if (S.draft && S.draft.items && S.draft.items.length) { Draft.restore(S.draft); return; }
    go('list', null, true); return;
  }

  const el = $('#main');
  busyTimer(false);   // 重新渲染前先停掉上一轮的秒表（结果回来时也要停）

  /* ---- 识别中 / 失败 ---- */
  const pages = (b.photos && b.photos.length) ? b.photos : (b.image ? [b.image] : []);
  const multi = pages.length > 1;
  if (b.busy || b.error || !b.items.length) {
    setTitle(multi ? '整卷识别' : '整页识别', b.busy ? '识别中…' : '');
    let h = '';
    if (pages.length) {
      h += '<div class="pad" style="padding-bottom:0">';
      pages.forEach((u, i) => {
        h += '<div class="preview" style="margin-bottom:10px"><img src="' + esc(u) + '" alt="第' + (i + 1) + '页">'
          + (multi ? '<span class="pageno">第 ' + (i + 1) + ' 页</span>' : '') + '</div>';
      });
      h += '</div>';
    }
    if (b.busy) {
      /* 整卷识别要几十秒，手机上的浏览器等太久会自己断掉连接（表现为「分析不了」）。
         这里把「已等了多少秒」实时显示出来，用户能看出程序在动、不是在卡死。 */
      h += '<div class="loading"><div class="spin"></div><div style="font-weight:600">'
        + (multi ? 'AI 正在逐页逐题识别 ' + pages.length + ' 页…' : 'AI 正在逐题识别…') + '</div>'
        + '<div class="tiny muted mt8">已等 <b id="busySec">0</b> 秒 · '
        + (multi ? '整卷页数多、题目多，一般 30～90 秒，请稍等' : '整页题目多，一般 20～60 秒，请稍等') + '</div></div>';
    } else {
      h += noticeErrorHTML(b.error || '没有识别到题目', multi)
        + '<div class="pad"><button class="btn block" id="bRetry">🔄 再试一次</button>'
        + (pages.length > 3 ? '<div class="mt12"><button class="btn gray block" id="bFewer">📷 少拍几页重来（一次 3～4 页最稳）</button></div>' : '')
        + '<div class="mt12"><button class="btn gray block" id="bAgain2">📷 重新拍一张</button></div></div>';
    }
    el.innerHTML = h;
    const bd = (id, fn) => { const n = $('#' + id); if (n) n.onclick = fn; };
    bd('bRetry', () => runBatch());
    bd('bFewer', () => startCapture());
    bd('bAgain2', () => startCapture());
    busyTimer(b.busy);
    return;
  }

  /* ---- 正常结果 ---- */
  const c = batchCounts(b);
  setTitle(multi ? '整卷识别' : '整页识别', '共 ' + b.items.length + ' 题' + (multi ? ' · ' + pages.length + ' 页' : ''));
  let h = '<div class="bstat">';
  h += '<div class="btop"><img class="bthumb" id="bThumb" src="' + esc(b.image) + '" alt="原图">'
    + '<div class="grow"><div class="row wrap" style="gap:6px">'
    + (multi ? '<span class="badge">' + pages.length + ' 页</span>' : '')
    + '<span class="badge">共 ' + b.items.length + ' 题</span>'
    + (c.right ? '<span class="badge ok">✅ 对 ' + c.right + '</span>' : '')
    + (c.wrong ? '<span class="badge bad">❌ 错 ' + c.wrong + '</span>' : '')
    + (c.partial ? '<span class="badge warn">⚠️ 半对 ' + c.partial + '</span>' : '')
    + (c.unknown ? '<span class="badge k">❔ 未作答 ' + c.unknown + '</span>' : '')
    + '</div>'
    + '<div class="tiny muted mt8">' + esc(b.subject || '未分类') + (b.chapter ? ' · ' + esc(b.chapter) : '')
    + (b.source_type ? ' · ' + esc(b.source_type) : '') + '</div>'
    + '<div class="tiny mt8">已勾选 <b style="color:var(--pri-d);font-size:15px">' + c.picked + '</b> 题将存入错题本</div>'
    + '</div></div>';
  if (b.recovered) {
    h += '<div class="notice warn mt8">⚠️ 模型输出中途被截断，已自动保住前面写完整的 ' + b.items.length
      + ' 题；后面的题可能没列全。想要更完整可以点「重拍」再来一次。</div>';
  }
  if (b.missing) {
    h += '<div class="notice warn mt8">⚠️ 模型说这页有 ' + b.declared + ' 道题，但只识别出 '
      + b.items.length + ' 道，<b>可能漏了 ' + b.missing + ' 道</b>。把照片拍正、拍清晰，或在「补充说明」里写一句「共 '
      + b.declared + ' 道题，请一道别漏」，再点「重拍」试一次。</div>';
  }
  if (b.missing || b.recovered) {
    h += '<div class="tiny muted mt8">已经识别出来的题是完好的，可以先用着，漏掉的再单独拍。</div>';
  }
  /* 明确告诉家长「这份结果不会丢」—— 否则误触离开一次就等于重拍，代价太大 */
  h += '<div class="notice info mt8">💾 这份结果<b>已经自动暂存</b>，误触返回、切页签、刷新后'
    + '都能从首页的「继续整理」找回来；点「存入错题本」后自动清除。</div>';
  /* 听力音频状态：让家长一眼看出这次听力题到底检没检查 */
  if (b.asrNote) {
    const bad = !b.listeningText;
    h += '<div class="notice ' + (bad ? 'warn' : 'info') + ' mt8">'
      + (bad ? '🎧 ' : '🎧 ') + esc(b.asrNote) + '</div>';
  } else if (!b.audio) {
    h += '<div class="notice mt8">🎧 本次没有上传听力音频，<b>听力题一律未检查</b>'
      + '（在录入页可上传录音后再识别一遍）。</div>';
  }
  h += '<div class="row mt8" style="gap:8px">'
    + '<button class="btn gray" id="bAgain" style="flex:none;padding:11px 12px;font-size:14px">📷 重拍</button>'
    + '<button class="btn gray grow" id="bCourse" style="font-size:14px">✍️ 改成单题模式</button>'
    + '<button class="btn gray" id="bDrop" style="flex:none;padding:11px 12px;font-size:14px">🗑️ 放弃</button></div>'
    + '</div>';

  /* 干净原题：这一次检查已经顺手整理好一部分（模型偶尔会漏某道题）——
     把「整理了几道」明明白白摆出来，漏了的可以在这里一键补，不用一道一道点。 */
  const clHas = b.items.filter(x => String(x.clean_text || '').trim()).length;
  const clTodo = b.items.filter(x => x.save && !String(x.clean_text || '').trim()).length;
  if (b.cleanBusy) {
    h += '<div class="notice warn mt8">⏳ 正在补「干净原题」…已完成 '
      + (b.cleanDone || 0) + ' / ' + (b.cleanTotal || clTodo) + ' 道（每道约 3～8 秒）'
      + '<div class="row mt8"><button class="btn ghost small" id="bCleanStop2">停止</button></div></div>';
  } else if (clHas || clTodo) {
    h += '<div class="notice mt8">📖 <b>干净原题</b>（去掉手写、不含答案，复习时用它做题）：本次已整理 '
      + clHas + ' / ' + b.items.length + ' 道';
    if (clTodo) {
      h += '；<b>已勾选的题里还有 ' + clTodo + ' 道</b>没整理出来'
        + '<div class="row mt8"><button class="btn ghost small" id="bCleanGo">📖 给勾选的题补上（'
        + clTodo + ' 道）</button></div>';
    } else {
      h += '，勾选的题都齐了 ✓';
    }
    h += '</div>';
  }

  const tabs = [['all', '全部', b.items.length], ['wrong', '只看错题', c.wrongish], ['picked', '只看已勾选', c.picked]];
  h += '<div class="tabs">' + tabs.map(t =>
    '<button data-bfilter="' + t[0] + '" class="' + (b.filter === t[0] ? 'on' : '') + '">'
    + t[1] + ' ' + t[2] + '</button>').join('') + '</div>';

  const vis = [];
  b.items.forEach((x, i) => {
    if (b.filter === 'wrong' && !(x.is_correct === 'wrong' || x.is_correct === 'partial')) return;
    if (b.filter === 'picked' && !x.save) return;
    vis.push({ x: x, i: i });
  });
  if (!vis.length) {
    h += '<div class="empty"><div class="big">🗂️</div><div>这个筛选下没有题目</div></div>';
  } else {
    h += '<div class="blist">' + vis.map(o => batchCard(o.x, o.i)).join('') + '</div>';
  }

  h += '<div class="savebar">'
    + '<button class="btn gray" id="bAll" style="flex:none;padding:11px 10px;font-size:13px">全选错题</button>'
    + '<button class="btn gray" id="bNone" style="flex:none;padding:11px 10px;font-size:13px">清空</button>'
    + '<button class="btn grow" id="bSave"' + (c.picked && !b.saving ? '' : ' disabled') + '>'
    + (b.saving ? '保存中…' : '存入错题本（' + c.picked + '）') + '</button>'
    + '</div>';

  el.innerHTML = h;
  if (keepScroll) window.scrollTo(0, y);

  $('#bThumb').onclick = () => zoomImage(b.image);
  /* 每题一个标签选择器：改完就地写回这道题（草稿一起更新，切页/刷新也不丢） */
  $$('#main [data-taghost]').forEach(host => {
    const key = host.dataset.taghost;
    const idx = parseInt(String(key).slice(1), 10);
    if (!isFinite(idx) || !b.items[idx]) return;
    bindTagPicker(key, () => b.items[idx].reason_tags || [],
      v => { b.items[idx].reason_tags = v; Draft.push(); },
      () => renderBatch(true));
  });
  $$('#main [data-bfilter]').forEach(n => n.onclick = () => { b.filter = n.dataset.bfilter; renderBatch(); });
  $('#bAll').onclick = () => {
    b.items.forEach(x => { if (x.is_correct === 'wrong' || x.is_correct === 'partial') x.save = true; });
    Draft.push();
    renderBatch(true);
  };
  $('#bNone').onclick = () => { b.items.forEach(x => { x.save = false; }); Draft.push(); renderBatch(true); };
  $('#bSave').onclick = saveBatch;
  const clGo = $('#bCleanGo');
  if (clGo) clGo.onclick = () => runBatchClean();
  const clStop = $('#bCleanStop2');
  if (clStop) clStop.onclick = () => {
    b.cleanStop = true;
    clStop.disabled = true; clStop.textContent = '正在停下…';
  };
  $('#bAgain').onclick = startCapture;
  $('#bDrop').onclick = () => Draft.discard();
  $('#bCourse').onclick = () => { if (S.cap) S.cap.aiDone = false; else S.cap = newCap(); go('capture', null, true); };

  el.onclick = (ev) => {
    const p = ev.target.closest('[data-pick]');
    if (p) { const i = Number(p.dataset.pick); b.items[i].save = !b.items[i].save; Draft.push(); renderBatch(true); return; }
    const e2 = ev.target.closest('[data-exp]');
    if (e2) { batchExplain(Number(e2.dataset.exp)); return; }
    const te = ev.target.closest('[data-tagedit]');
    if (te) {
      const i = Number(te.dataset.tagedit);
      b.items[i].tagOpen = !b.items[i].tagOpen;
      renderBatch(true);
      return;
    }
    const t2 = ev.target.closest('[data-toggle]');
    if (t2 && !t2.closest('.qfoot')) {
      const i = Number(t2.dataset.toggle);
      b.items[i].open = !b.items[i].open;
      renderBatch(true);
    }
  };
}

async function runBatch() {
  const c = S.cap || {};
  const extraEl = $('#extra');
  if (extraEl) c.extra = extraEl.value.trim();
  /* 整页模式也支持多页：同一份卷子拍了几页就一起发过去，逐页逐题识别 */
  const ph = (c.photos && c.photos.length) ? c.photos.slice() : (c.image ? [c.image] : []);
  if (!ph.length) { toast('先拍一张照片'); return; }

  const run = {
    image: ph[0], photos: ph, busy: true, filter: 'all', subject: '未分类', source_type: '作业',
    chapter: '', items: [], error: '', saving: false, recovered: false, declared: 0, missing: 0,
    /* 听力音频整卷共用一份：跟着 run 走，保存时所有题共用同一个 audio_url */
    audio: c.audio || null, audioName: c.audioName || '', audioSize: c.audioSize || 0,
    audioDuration: c.audioDuration || 0, listeningText: '',
    asrNote: ''
  };
  S.batch = run;
  go('batch');          // 可返回：按「←」回到录入页（刚拍的照片还在，能重拍/换张）；重试时不会重复入栈
  try {
    /* 有音频就先转写，再把原文一起交给模型；转写失败则退回「没音频」路径 */
    run.listeningText = await ensureListeningText(c);
    if (S.batch !== run) return;
    if (c.audio && !run.listeningText) run.asrNote = '听力音频转写失败，本次听力题已跳过';
    else if (c.audio) run.asrNote = '已结合听力音频检查听力题';
    const r = await aiAnalyzeBatch(ph, S.listFilter.subject, c.extra || '', run.listeningText);
    if (S.batch !== run) return;              // 用户已经重拍/离开，丢弃这次结果
    run.subject = (r.subject === '未分类' && S.listFilter.subject !== '全部') ? S.listFilter.subject : r.subject;
    run.source_type = r.source_type;
    run.chapter = r.chapter;
    run.items = r.items;
    run.recovered = r.recovered;
    run.declared = r.declared || 0;
    run.missing = r.missing || 0;
    run.busy = false;
    const nBad = r.items.filter(x => x.is_correct === 'wrong' || x.is_correct === 'partial').length;
    toast('认出 ' + r.items.length + ' 题'
      + (run.missing ? '，可能有 ' + run.missing + ' 题漏了' : '')
      + (nBad ? '，' + nBad + ' 题做错/半对已默认勾选' : ''), 3400);
    /* 识别成果来之不易（几十秒 + 可能已展开的讲解），一出结果就立刻暂存一份：
       误触返回 / 切页签 / 刷新后能从首页横幅找回 */
    Draft.push(true);
  } catch (e) {
    if (S.batch !== run) return;
    run.busy = false;
    run.error = e.message || '识别失败';
  }
  /* 识别要花几十秒，期间用户可能切去别的页签了 —— 结果回来时把整页识别页重新拿到前台，
     否则结果会盖在被切过去的那个页面上（而且用户也找不到它） */
  if (S.view !== 'batch') { S.view = 'batch'; syncTab(); }
  renderBatch();
}

/** 按需展开讲解：做错的题顺带补一次错因分析 */
async function batchExplain(i) {
  const b = S.batch;
  const it = b && b.items[i];
  if (!it || it.expBusy) return;
  if (it.open) { it.open = false; renderBatch(true); return; }
  it.open = true;
  if (it.explanation) { renderBatch(true); return; }
  it.expBusy = true;
  renderBatch(true);
  try {
    const a = await aiExplainOne(it, b.subject);
    it.explanation = String(a.explanation || '').trim();
    if (!it.explanation) throw new Error('模型没返回讲解内容，可再点一次');
    /* 讲一遍就会更清楚孩子到底错在哪：模型这次给的标签直接覆盖旧的（原来空着也算补齐） */
    if (it.is_correct !== 'right') {
      const tg = normalizeTags(a.reason_tags);
      if (tg.length) it.reason_tags = tg;
    }
    if (a.similar_question) it.similar_question = String(a.similar_question).trim();
  } catch (e) {
    it.open = false;
    toast('讲解失败：' + e.message, 3400);
  }
  it.expBusy = false;
  Draft.push();          // 讲解也是花钱花时间换来的，一并暂存
  renderBatch(true);
}

async function saveBatch() {
  const b = S.batch;
  const picked = b.items.filter(x => x.save);
  if (!picked.length) { toast('先勾选要存入的题目'); return; }
  b.saving = true;
  renderBatch(true);
  try {
    const payloads = picked.map(x => ({
      subject: b.subject || '未分类',
      chapter: b.chapter || '',
      knowledge_point: (x.knowledge_points || []).join('，'),
      reason_tags: (x.reason_tags || []).join('，'),
      error_reason: x.is_correct === 'right' ? '' : reasonFromTags(x.reason_tags),
      question_text: x.question_text || '',
      /* 检查时一并整理好的干净原题，跟着错题一起入库（服务端会自动盖提取时间） */
      clean_text: x.clean_text || '',
      student_answer: x.student_answer || '',
      correct_answer: x.correct_answer || '',
      explanation: x.explanation || '',
      similar_question: x.similar_question || '',
      check_result: x.check_result || '',
      is_correct: x.is_correct || 'unknown',
      mastery: 0,
      source_type: b.source_type || '作业',
      /* 听力原文跟着题目走（整卷共用的音频在 shared_audio 里只存一次） */
      listening_text: b.listeningText || ''
    }));
    /* 原图按页分别存，所有题共用同一组（服务端只落盘一次，不会塞 N 份） */
    const ph = (b.photos && b.photos.length) ? b.photos : [b.image];
    const n = await Store.createMany(payloads, ph.filter(Boolean).join('|'), b.audio || '');
    toast('已存入错题本 ' + n + ' 题 ✓');
    await Draft.done();          // 草稿功成身退（原图转正成错题原图，不会被删）
    S.cap = newCap();
    S.batch = null;
    S.stats = await Store.stats();
    go('list', null, true);
  } catch (e) {
    toast('保存失败：' + e.message, 3600);
    b.saving = false;
    renderBatch(true);
  }
}

/** 给「已勾选但还没整理出干净原题」的题补提取：串行、有进度、随时能停。
    正常路径用不上（检查那一次就一起整理好了），专门兜「模型偶尔漏字段」这种情况。 */
async function runBatchClean() {
  const b = S.batch;
  if (!b || b.cleanBusy) return;
  if (!cleanSupported()) { toast(cleanUnsupportedError().message, 5200); return; }
  const todo = b.items.filter(x => x.save && !String(x.clean_text || '').trim());
  if (!todo.length) { toast('勾选的题都已经有干净原题了'); return; }
  const pages = (b.photos && b.photos.length) ? b.photos : (b.image ? [b.image] : []);
  if (!pages.length) { toast('这批题没有原图，提取不了干净原题', 3200); return; }
  if (!confirm('给已勾选的 ' + todo.length + ' 道题补出干净原题？\n\n'
      + '需要联网调用 AI，每道约 3～8 秒，按量计费；中途随时可以停，已经补好的会留着。')) return;

  b.cleanBusy = true; b.cleanStop = false; b.cleanDone = 0; b.cleanTotal = todo.length;
  let ok = 0, fail = 0, firstErr = '';
  renderBatch(true);
  for (let i = 0; i < todo.length; i++) {
    if (b.cleanStop) break;
    try {
      /* 复用单题提取那一整套（读图 → 超长图纵切 → 用题目文字点名「只抄这一道」）。
         这里给它一个伪「错题」对象：图是这份卷子的全部页，线索是这道题已有的题目文字。 */
      const txt = await extractClean({
        question_image: pages.join('|'),
        question_text: todo[i].question_text
      });
      if (!String(txt || '').trim()) throw new Error('模型没返回内容');
      todo[i].clean_text = txt;
      ok++;
    } catch (e) {
      /* 后端版本不对这种错就别继续了，免得挨个失败刷屏 */
      if (e && e.stopCleanBatch) { firstErr = e.message; break; }
      fail++; if (!firstErr) firstErr = (e && e.message) || '提取失败';
    }
    b.cleanDone = ok;
    Draft.push(true);          // 补出来的也是花钱换的，一并暂存
    renderBatch(true);
  }
  b.cleanBusy = false;
  b.cleanStop = false;
  Draft.push(true);
  if (firstErr && !ok) toast('补干净原题失败：' + firstErr, 4200);
  else if (fail) toast('补好了 ' + ok + ' 道，' + fail + ' 道失败（可再点一次）', 3600);
  else toast('已补好 ' + ok + ' 道干净原题 ✓');
  renderBatch(true);
}

/* ---------------- 视图：错题详情 ---------------- */
async function renderDetail(id) {
  // 连点两道题时，先点的那道可能后返回，用序号把过期的响应丢掉
  const seq = (renderDetail._seq = (renderDetail._seq || 0) + 1);
  setTitle('错题详情', '');
  $('#main').innerHTML = '<div class="pad center muted">读取中…</div>';
  let m;
  try {
    m = await Store.get(id);
  } catch (e) {
    if (S.view === 'detail' && renderDetail._seq === seq) { toast(e.message); go('list', null, true); }
    return;
  }
  if (S.view !== 'detail' || renderDetail._seq !== seq) return;
  S.detail = m;
  const v = VERDICT[m.is_correct] || VERDICT.unknown;
  const sch = scheduleOf(m);
  let h = '';
  /* 原图放在错题上方：多页时一张一张翻，缩放只在这个窗口里生效、不影响下面的内容 */
  if (m.question_image) h += photoBoxHTML(splitImgs(m.question_image), 'pbDetail');
  h += '<div class="pad"><div class="row wrap" id="dTagRow" style="gap:6px">'
    + detailBadgesHTML(m, tagsOf(m)) + '</div>';
  h += '<div class="row mt12" style="gap:10px"><div class="grow">'
    + '<div class="tiny muted">掌握度 ' + (m.mastery || 0) + '/5 · 复习 ' + (m.review_count || 0) + ' 次'
    + (m.last_reviewed_at ? ' · 最近 ' + fmtDate(m.last_reviewed_at) : '') + '</div>'
    + masteryDots(m.mastery || 0) + '</div>'
    + '<div class="tiny faint" style="text-align:right">录入 ' + fmtDate(m.created_at) + '<br>'
    + esc(m.mastery >= 5 ? '已掌握 · 已退出复习池' : ('下次：' + dueText(sch))) + '</div></div></div>';

  /* 检查结论里的【错处：…】是给程序看的标记，显示前一律剥掉 */
  if (checkText(m.check_result)) h += sec('🔍 检查结论', checkText(m.check_result));
  /* 听力音频：能回放，复习重听很方便 */
  if (m.audio_url) {
    h += '<div class="sec"><h3>🎧 听力音频</h3>'
      + '<audio controls preload="metadata" src="' + esc(m.audio_url) + '" style="width:100%"></audio>'
      + '</div>';
  }
  if (m.listening_text) h += sec('🎧 听力原文', m.listening_text, '听力原文');
  h += cleanBlockHTML(m);          // 复习真正要用的那一份：无手写、无答案、篇章整篇
  if (m.question_text) h += sec('📝 识别出的题目', m.question_text, '题目');
  if (m.student_answer) h += sec('✏️ 孩子的答案', m.student_answer, '孩子答案');
  if (m.correct_answer) h += secHTML('✅ 正确答案',
    renderWrongMarked(m.correct_answer, wrongItemsOf(m).items, 'a').html);
  if (m.explanation) h += sec('💡 讲解', m.explanation, '讲解');
  if (m.similar_question) h += sec('🔁 举一反三', m.similar_question, '同类题');
  /* 错因标签：在这儿就能直接改（改完自动保存），不必绕到「编辑」页去 */
  h += '<div class="sec"><h3>🎯 错因标签</h3>'
    + '<div class="chips" id="dTagChips">' + tagChipsHTML(tagsOf(m), '还没打标签') + '</div>'
    + '<button class="btn ghost block small mt8" id="dTagEdit">'
    + (S.detailTagOpen ? '收起标签选择' : '🏷️ 改标签（可多选）') + '</button>'
    + (S.detailTagOpen ? '<div class="mt8">' + tagPickerBox('detail', tagsOf(m)) + '</div>' : '')
    + '<div class="tiny muted mt8">复习时可以按这些标签专门抽题练一练。'
    + '修改会立即保存。</div></div>';
  if (m.knowledge_point || m.chapter) {
    h += '<div class="sec"><h3>📚 章节与知识点</h3><div class="chips">'
      + (m.chapter ? '<span class="chip">' + esc(m.chapter) + '</span>' : '')
      + String(m.knowledge_point || '').split(/[,，、;；/|]+/).filter(Boolean)
        .map(k => '<span class="chip">' + esc(k.trim()) + '</span>').join('')
      + '</div></div>';
  }
  if (m.reviews && m.reviews.length) {
    h += '<div class="sec"><h3>🔁 复习记录</h3>'
      + m.reviews.map(r => '<div class="row tiny" style="padding:4px 0">'
        + '<span class="' + (r.is_correct ? '' : '') + '">' + (r.is_correct ? '✅ 做对' : '❌ 做错') + '</span>'
        + '<span class="faint grow">' + esc(r.note || '') + '</span>'
        + '<span class="faint">' + fmtDate(r.reviewed_at) + '</span></div>').join('')
      + '</div>';
  }

  h += '<div class="actions"><button class="btn gray" id="dEdit">✏️ 编辑</button>'
    + '<button class="btn danger" id="dDel">🗑 删除</button></div>';
  /* 核心 5 错因 + 语法时态的题：错因模式出题更有针对性（变式题专治这个错法）；
     其余题维持按知识点出同类题。两个入口都保留，家长可切换。 */
  const drillable = tagsOf(m).some(t => REASON_DRILL_TAGS.indexOf(t) >= 0);
  if (drillable) {
    h += '<div class="actions"><button class="btn ok block" id="dDrill">🎯 按错因出举一反三（专治这个错法）</button></div>';
    h += '<div class="actions"><button class="btn ghost" id="dDrillKp">按知识点出同类题</button></div>';
  } else {
    h += '<div class="actions"><button class="btn ok block" id="dDrill">🎯 按知识点出几道同类题</button></div>';
  }
  h += '<div class="actions"><button class="btn ghost" id="dCopy">📋 复制讲解</button>'
    + '<button class="btn ok" id="dMaster">' + ((m.mastery || 0) >= 5 ? '↩︎ 取消已掌握' : '✓ 标记已掌握') + '</button></div>';
  h += '<div class="pad tiny faint center">复习时答案会先隐藏，让孩子自己先做一遍</div>';
  if (S.view !== 'detail') return;        // 读取详情是异步的，用户可能已经翻了别的题/切了页
  $('#main').innerHTML = h;
  syncWide();                             // 详情页在大屏上要放宽（照片才铺得开）

  $$('#main img[data-zoom]').forEach(img => img.onclick = () => zoomImage(img.dataset.zoom));
  if (m.question_image) bindPhotoBox(splitImgs(m.question_image), 'pbDetail');
  $('#dTagEdit').onclick = () => { S.detailTagOpen = !S.detailTagOpen; renderDetail(m.id); };
  bindTagPicker('detail', () => tagsOf(m), v => {
    m.tags = v;
    m.reason_tags = v.join('，');
    m.error_reason = reasonFromTags(v);
    tagSaveSoon(m.id);
  }, () => {
    /* 只重画标签那一块 —— 整页重渲染要重新拉一次接口，点一下跳一下很难受 */
    const row = $('#dTagRow');
    if (row) row.innerHTML = detailBadgesHTML(m, tagsOf(m));
    const box = $('#dTagChips');
    if (box) box.innerHTML = tagChipsHTML(tagsOf(m), '还没打标签');
  });
  bindCleanBlock(m);
  $('#dEdit').onclick = () => go('capture', { id: m.id });
  $('#dDel').onclick = async () => {
    if (!confirm('确定删除这道错题？（删除后列表不再显示）')) return;
    await Store.remove(m.id);
    S.stats = await Store.stats();
    toast('已删除');
    go('list', null, true);
  };
  $('#dMaster').onclick = async () => {
    const to = (m.mastery || 0) >= 5 ? 0 : 5;
    await Store.update(m.id, { mastery: to });
    S.stats = await Store.stats();
    toast(to === 5 ? '已标记为掌握 ✓' : '已取消已掌握');
    renderDetail(m.id);
  };
  $('#dDrill').onclick = () => go('drill', { id: m.id, byReason: tagsOf(m).some(t => REASON_DRILL_TAGS.indexOf(t) >= 0) });
  const kpBtn = $('#dDrillKp');
  if (kpBtn) kpBtn.onclick = () => go('drill', { id: m.id, byReason: false });   // 错因模式题的「按知识点」副入口
  $('#dCopy').onclick = async () => {
    const txt = '【' + (m.subject || '') + '】' + cleanOrText(m) + '\n'
      + '正确答案：' + (m.correct_answer || '') + '\n讲解：' + (m.explanation || '');
    toast(await copyText(txt) ? '已复制 ✓' : '复制失败，请长按选中文字');
  };
}

function sec(title, text, tag) {
